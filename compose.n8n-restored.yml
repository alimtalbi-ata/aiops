services:
  aiops2-n8n:
    image: "n8nio/n8n:2.40.6"
    environment:
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_HOST: "aiops2-postgres"
      DB_POSTGRESDB_PASSWORD: "${DB_POSTGRESDB_PASSWORD:?required}"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: "aiops"
      DB_TYPE: "postgresdb"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?required}"
      N8N_RELEASE_TYPE: "stable"
      N8N_SECURE_COOKIE: "false"
    networks:
      - aiops2-control
      - aiops2-data
      - aiops2-integration
    ports:
      - "10.79.94.202:15678:5678"
    volumes:
      - aiops2-rebuild-n8n-data:/home/node/.n8n

volumes:
  aiops2-rebuild-n8n-data:
    external: true
    name: aiops2-rebuild-n8n-data
