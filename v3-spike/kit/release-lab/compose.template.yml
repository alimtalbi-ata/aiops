# Nine-service synthetic LAB only. Build-free generated kit; no E17 target, no LIVE.
services:
  postgres:
    image: @IMAGE_postgres@
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${V3_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/004_operational_model.sql:/docker-entrypoint-initdb.d/004_operational_model.sql:ro
      - ./sql/008_event_idempotency.sql:/docker-entrypoint-initdb.d/008_event_idempotency.sql:ro
      - ./sql/poc-execution-receipts.sql:/docker-entrypoint-initdb.d/009_poc_execution_receipts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
  core:
    image: @IMAGE_core@
    environment:
      DATABASE_URL: postgresql://aiops:${V3_DB_PASSWORD:?required}@postgres:5432/aiops
      AIOPS_ADMIN_TOKEN: ${V3_LAB_TOKEN:?required}
      AIOPS_INTERNAL_TOKEN: ${V3_LAB_TOKEN:?required}
      WORKER_URL: http://worker:815
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:810/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  twin:
    image: @IMAGE_twin@
    environment:
      DATABASE_URL: postgresql://aiops:${V3_DB_PASSWORD:?required}@postgres:5432/aiops
      AIOPS_ADMIN_TOKEN: ${V3_LAB_TOKEN:?required}
      AIOPS_INTERNAL_TOKEN: ${V3_LAB_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:811/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  evidence:
    image: @IMAGE_evidence@
    environment:
      DATABASE_URL: postgresql://aiops:${V3_DB_PASSWORD:?required}@postgres:5432/aiops
      AIOPS_ADMIN_TOKEN: ${V3_LAB_TOKEN:?required}
      AIOPS_INTERNAL_TOKEN: ${V3_LAB_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:812/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  policy:
    image: @IMAGE_policy@
    environment:
      DATABASE_URL: postgresql://aiops:${V3_DB_PASSWORD:?required}@postgres:5432/aiops
      AIOPS_ADMIN_TOKEN: ${V3_LAB_TOKEN:?required}
      AIOPS_INTERNAL_TOKEN: ${V3_LAB_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:813/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  # Explicitly opt-in; no host ports, no historical generic stage worker.
  temporal-postgres:
    image: @IMAGE_temporal-postgres@
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${V3_DB_PASSWORD:?required}
    volumes:
      - temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
  temporal:
    # Published auto-setup GA tag; CI must verify actual pull/runtime.
    image: @IMAGE_temporal@
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${V3_DB_PASSWORD:?required}
      POSTGRES_SEEDS: temporal-postgres
      BIND_ON_IP: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 && temporal operator namespace describe --address 127.0.0.1:7233 --namespace default >/dev/null"]
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 30s
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks: [backend]
  worker:
    image: @IMAGE_worker@
    command: ["uvicorn", "worker.v3_boundary:app", "--host", "0.0.0.0", "--port", "815"]
    environment:
      CORE_URL: http://core:810
      TEMPORAL_ADDRESS: temporal:7233
      AIOPS_V3_BOUNDARY: "1"
      AIOPS_INTERNAL_TOKEN: ${V3_LAB_TOKEN:?required}
    depends_on:
      core:
        condition: service_healthy
      evidence:
        condition: service_healthy
      temporal:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:815/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 50
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  gamma:
    image: @IMAGE_gamma@
    environment:
      AIOPS_V3_GAMMA_CONTAINER_LAB: "1"
      AIOPS_INTERNAL_TOKEN: ${V3_LAB_TOKEN:?required}
      NO_PROXY: "127.0.0.1,localhost"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - gamma-audit:/audit
    ports:
      - "127.0.0.1:18080:18080"
    networks: [backend, edge]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      core: {condition: service_healthy}
      twin: {condition: service_healthy}
      evidence: {condition: service_healthy}
      policy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/',timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30

networks:
  edge: {}
  backend:
    internal: true
volumes:
  postgres-data: {}
  temporal-data: {}
  gamma-audit: {}
