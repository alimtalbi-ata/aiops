# CI-only packaging profile; GAMMA contains the existing HITL gate.
services:
  gamma:
    build:
      context: ..
      dockerfile: kit/gamma.Dockerfile
    environment:
      AIOPS_V3_GAMMA_CONTAINER_LAB: "1"
      AIOPS_INTERNAL_TOKEN: ${V3_LAB_TOKEN:?required}
      NO_PROXY: "127.0.0.1,localhost"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - gamma-audit:/audit
    ports:
      - "127.0.0.1:18080:18080"
    networks: [backend, edge]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      core: {condition: service_healthy}
      twin: {condition: service_healthy}
      evidence: {condition: service_healthy}
      policy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/',timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
volumes:
  gamma-audit: {}
