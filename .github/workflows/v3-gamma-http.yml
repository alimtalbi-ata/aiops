name: V3 connected GAMMA synthetic browser
on:
  push:
    branches: [v3-spike/p0-gamma-incidents-20261125, v3-spike/central-integration]
  pull_request:
    branches: [v3-spike/central-integration]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install playwright==1.51.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_gamma_http.py -v
