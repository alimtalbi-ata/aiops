name: V3 spike qualification
on:
  push:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/kit/**'
      - 'v3-spike/contracts/**'
      - 'v3-spike/ux/**'
      - '.github/workflows/v3-spike-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-unit:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Synthetic contract tests (locked dependency)
        run: |
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
          python3 -B - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import unittest
          path = pathlib.Path("v3-spike/contracts/event_store.py").resolve()
          spec = importlib.util.spec_from_file_location("v3_event_store", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(module.Tests)
          expected = 17
          actual = suite.countTestCases()
          print(f"contracts-unit collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL contract test collection: {actual} != {expected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL contract tests: executed={result.testsRun} expected={expected}")
          print(f"PASS contract tests: executed={result.testsRun}", flush=True)
          PY
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "runtime=NOT_RUN deploy_authorized=false"
  ux-browser:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install isolated browser dependencies
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Synthetic GAMMA browser acceptance (strict 5 tests)
        run: |
          python3 -B - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import unittest
          path = pathlib.Path("v3-spike/ux/test_gamma.py").resolve()
          spec = importlib.util.spec_from_file_location("v3_gamma_browser", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(module.GammaAcceptance)
          expected = 5
          actual = suite.countTestCases()
          print(f"ux-browser collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL UX test collection: {actual} != {expected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL UX tests: executed={result.testsRun} expected={expected}")
          print(f"PASS UX tests: executed={result.testsRun}", flush=True)
          PY
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "runtime=NOT_RUN deploy_authorized=false"

  kit-unit:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          date -u +%FT%TZ
          git rev-parse HEAD
          python3 --version
      - name: Synthetic kit unit tests (strict 5 methods)
        working-directory: v3-spike/kit
        run: |
          python3 -B - <<'PY'
          import unittest
          import test_preflight
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(test_preflight.IsolationTests)
          expected = 5
          actual = suite.countTestCases()
          print(f"kit-unit collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL kit test collection: {actual} != {expected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL kit tests: executed={result.testsRun} expected={expected}")
          print(f"PASS kit tests: executed={result.testsRun}", flush=True)
          PY
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "deploy_authorized=false activation_authorized=false"
          echo "runtime=NOT_RUN"

  secure-boundary:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install isolated security integration dependency
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Synthetic security boundary tests (strict 6 methods)
        run: |
          python3 -B - <<'PY'
          import ast
          import pathlib
          import sys
          import unittest
          from unittest import mock
          path = pathlib.Path("v3-spike/contracts/secure_boundary.py").resolve()
          # The SQLite integration test imports event_store from this directory.
          sys.path.insert(0, str(path.parent))
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          classes = [node for node in ast.walk(tree) if isinstance(node, ast.ClassDef) and node.name == "SecurityTests"]
          if len(classes) != 1:
              raise SystemExit(f"FAIL security test class collection: {len(classes)} != 1")
          tests = [node for node in classes[0].body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")]
          expected = 6
          if len(tests) != expected:
              raise SystemExit(f"FAIL security test AST collection: {len(tests)} != {expected}")
          # Tests live under __main__; execute the source as __main__ while intercepting unittest.main.
          namespace = {"__name__": "__main__", "__file__": str(path)}
          with mock.patch.object(unittest, "main", return_value=None):
              exec(compile(source, str(path), "exec"), namespace)
          cls = namespace.get("SecurityTests")
          if not isinstance(cls, type) or not issubclass(cls, unittest.TestCase):
              raise SystemExit("FAIL SecurityTests not available")
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(cls)
          actual = suite.countTestCases()
          print(f"secure-boundary collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL security test collection: {actual} != {expected}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL security tests: executed={result.testsRun} expected={expected}")
          print(f"PASS security tests: executed={result.testsRun}", flush=True)
          PY
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "security_boundary=synthetic_only runtime=NOT_RUN deploy_authorized=false"

  compose-static:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Syntax-only fixture references: never pull or execute these images.
      GAMMA_IMAGE: fixture/gamma@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CORE_IMAGE: fixture/core@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DEMO_IMAGE: fixture/demo@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate canonical Compose for default and demo (no containers)
        working-directory: v3-spike/kit
        run: |
          set -eu
          docker compose version
          test "$(find . -maxdepth 1 -name '*compose*.yml' -o -name '*compose*.yaml' | wc -l)" -eq 1
          for profile in default demo; do
            if [ "$profile" = default ]; then
              docker compose -f docker-compose.yml config --format json > /tmp/v3-compose.json
              docker compose -f docker-compose.yml config --services > /tmp/v3-services.txt
            else
              docker compose -f docker-compose.yml --profile demo config --format json > /tmp/v3-compose.json
              docker compose -f docker-compose.yml --profile demo config --services > /tmp/v3-services.txt
            fi
            python3 -B preflight.py < /tmp/v3-compose.json
            python3 -B - "$profile" /tmp/v3-services.txt <<'PY'
          import sys
          profile=sys.argv[1]
          actual=set(open(sys.argv[2]).read().splitlines())
          expected={"gamma","core"} | ({"demo"} if profile=="demo" else set())
          if actual!=expected:
              raise SystemExit(f"FAIL profile={profile} services={actual} expected={expected}")
          print(f"PASS compose-static profile={profile} services={sorted(actual)}")
          PY
          done
          echo "NO_PULL NO_UP NO_RUNTIME"
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "compose_static_only=true runtime=NOT_RUN deploy_authorized=false"
