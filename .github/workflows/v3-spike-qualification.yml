  compose-static:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Syntax-only fixture references: never pull or execute these images.
      GAMMA_IMAGE: fixture/gamma@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CORE_IMAGE: fixture/core@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DEMO_IMAGE: fixture/demo@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate canonical Compose for default and demo (no containers)
        working-directory: v3-spike/kit
        run: |
          set -eu
          docker compose version
          # The fixture remains canonical; specialized LAB/integration overlays coexist.
          expected=$(printf '%s\n' compose.e17-product-ci.yml compose.gamma-ci.yml compose.poc-source.yml docker-compose.yml glpi-native.compose.yml mattermost-native.compose.yml | LC_ALL=C sort)
          actual=$(find . -maxdepth 1 \( -name '*compose*.yml' -o -name '*compose*.yaml' \) -printf '%f\n' | LC_ALL=C sort)
          test "$actual" = "$expected"
          while IFS= read -r name; do test -f "$name" && test ! -L "$name"; done <<< "$expected"
          echo "PASS canonical fixture and six-file Compose inventory"
          mkdir -p reports
          for profile in default demo; do
            if [ "$profile" = default ]; then
              docker compose -f docker-compose.yml config --format json > /tmp/v3-compose.json
              docker compose -f docker-compose.yml config --services > /tmp/v3-services.txt
            else
              docker compose -f docker-compose.yml --profile demo config --format json > /tmp/v3-compose.json
              docker compose -f docker-compose.yml --profile demo config --services > /tmp/v3-services.txt
            fi
            python3 -B -c 'import json; c=json.load(open("/tmp/v3-compose.json")); print("COMPOSE_NETWORK_KEYS", {k: sorted(v) for k,v in c["networks"].items()}, "COMPOSE_SERVICE_KEYS", {k: sorted(v) for k,v in c["services"].items()}, flush=True)'
          python3 -B preflight.py < /tmp/v3-compose.json
            python3 -B - "$profile" /tmp/v3-services.txt <<'PY'
          import sys
          profile=sys.argv[1]
          actual=set(open(sys.argv[2]).read().splitlines())
          expected={"gamma","core"} | ({"demo"} if profile=="demo" else set())
          if actual!=expected:
              raise SystemExit(f"FAIL profile={profile} services={actual} expected={expected}")
          print(f"PASS compose-static profile={profile} services={sorted(actual)}")
          PY
          echo PASS > "reports/compose-${profile}.status"
          done
          echo "NO_PULL NO_UP NO_RUNTIME"
      - name: Compose static JUnit (strict default/demo receipts)
        if: always()
        working-directory: v3-spike/kit
        run: |
          python3 -B - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          reports = pathlib.Path("reports")
          reports.mkdir(exist_ok=True)
          root = ET.Element("testsuite", name="compose-static", tests="2", failures="0")
          for profile in ("default", "demo"):
              testcase = ET.SubElement(root, "testcase", classname="ComposeStatic", name=profile)
              result_file = pathlib.Path(f"reports/compose-{profile}.status")
              if not result_file.exists() or result_file.read_text().strip() != "PASS":
                  ET.SubElement(testcase, "failure", message=f"{profile} Compose validation not passed").text = "Missing successful config/preflight/services receipt"
                  root.set("failures", str(int(root.get("failures")) + 1))
          ET.ElementTree(root).write(reports / "compose-static.xml", encoding="utf-8", xml_declaration=True)
          if root.get("failures") != "0":
              raise SystemExit("FAIL Compose static JUnit")
          print("PASS Compose static JUnit default/demo")
          PY
      - name: Publish Compose JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-compose-junit
          path: v3-spike/kit/reports/compose-static.xml
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "compose_static_only=true runtime=NOT_RUN deploy_authorized=false"
