      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "runtime=NOT_RUN deploy_authorized=false"

  kit-unit:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          date -u +%FT%TZ
          git rev-parse HEAD
          python3 --version
      - name: BOM Markdown structure and CI inventory lint
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          text = Path("v3-spike/kit/BOM-BUILD-PLAN.md").read_text(encoding="utf-8")
          assert chr(92) + "n" not in text, "FAIL literal escaped newlines in BOM"
          def validate_table(source):
              lines = source.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith("| Liaison Event/Twin/Evidence |")]
              assert len(matches) == 1, "FAIL binding row missing or duplicated"
              i = matches[0]
              assert i > 0 and lines[i-1].startswith("| CI |"), "FAIL binding row detached from inventory table"
              start = next((j for j in range(i, -1, -1) if lines[j].startswith("| Élément |")), None)
              assert start is not None, "FAIL inventory header absent"
              assert all(line.startswith("|") and line.endswith("|") for line in lines[start:i+1]), "FAIL inventory table discontinuity"
          validate_table(text)
          # Both real blank lines and literal escaped newlines must be rejected.
          for label, prefix in (("blank-line", "\n"), ("literal-backslash-n", "\\n")):
              mutated = text.replace("| Liaison Event/Twin/Evidence |", prefix + "| Liaison Event/Twin/Evidence |", 1)
              assert mutated != text, f"FAIL mutation not applied: {label}"
              try:
                  validate_table(mutated)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"FAIL BOM lint accepted {label} mutation")
          assert "\n## État de qualification" in text, "FAIL missing qualification section"
          for term in ("SQLite 17", "sécurité 9", "GAMMA 5", "kit 7", "resource-binding 6", "authenticated-binding 4", "pair-decision 7", "Compose default/DEMO"):
              assert term in text, f"FAIL BOM missing {term}"
          print("PASS BOM structure and six-job inventory; no runtime qualification")
          PY
      - name: Synthetic kit unit tests (strict 7 methods)
        working-directory: v3-spike/kit
        run: |
          python3 -m pip install --disable-pip-version-check 'unittest-xml-reporting==3.2.0'
          mkdir -p reports
          python3 -B - <<'PY'
          import xmlrunner
          import unittest
          import xmlrunner
          import os
          os.makedirs('reports', exist_ok=True)
          import test_preflight
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(test_preflight.IsolationTests)
          expected = 7
          actual = suite.countTestCases()
          print(f"kit-unit collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL kit test collection: {actual} != {expected}")
          result = xmlrunner.XMLTestRunner(output='reports', verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL kit tests: executed={result.testsRun} expected={expected}")
          print(f"PASS kit tests: executed={result.testsRun}", flush=True)
          PY
      - name: OCI BOM structural tests (strict 5 methods, NOT attestation)
        working-directory: v3-spike/kit
        run: |
          python3 -B - <<'PY'
          import unittest
          import xmlrunner
          import os
          os.makedirs('reports', exist_ok=True)
          import xmlrunner
          import test_oci_release_gate
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(test_oci_release_gate.OCIReleaseStructureTests)
          expected = 5
          actual = suite.countTestCases()
          print(f"oci-structure collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL OCI structural collection: {actual} != {expected}")
          result = xmlrunner.XMLTestRunner(output='reports', verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL OCI structural tests: executed={result.testsRun} expected={expected}")
          print("OCI_STRUCTURE_ONLY_PASS; registry/signature/license/provenance NOT_ATTESTED", flush=True)
          PY
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "deploy_authorized=false activation_authorized=false"
          echo "runtime=NOT_RUN"
      - name: Publish kit JUnit (preflight6 and OCI5)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-kit-junit
          path: v3-spike/kit/reports/*.xml
          if-no-files-found: error
          retention-days: 14

  secure-boundary:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install isolated security integration dependency
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0' 'unittest-xml-reporting==3.2.0'
      - name: Fail-closed security dependency closure
        run: |
          python3 -B - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("xmlrunner") is not None, "FAIL missing xmlrunner"
          assert importlib.util.find_spec("jsonschema") is not None, "FAIL missing jsonschema"
          print("PASS secure-boundary dependency closure")
          PY
      - name: Synthetic security boundary tests (strict 9 methods)
        run: |
          python3 -B - <<'PY'
          import ast
          import pathlib
          import sys
          import unittest
          import xmlrunner
          import os
          os.makedirs('reports', exist_ok=True)
          from unittest import mock
          path = pathlib.Path("v3-spike/contracts/secure_boundary.py").resolve()
          # The SQLite integration test imports event_store from this directory.
          sys.path.insert(0, str(path.parent))
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          classes = [node for node in ast.walk(tree) if isinstance(node, ast.ClassDef) and node.name == "SecurityTests"]
          if len(classes) != 1:
              raise SystemExit(f"FAIL security test class collection: {len(classes)} != 1")
          tests = [node for node in classes[0].body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")]
          expected = 9
          if len(tests) != expected:
              raise SystemExit(f"FAIL security test AST collection: {len(tests)} != {expected}")
          # Tests live under __main__; execute the source as __main__ while intercepting unittest.main.
          namespace = {"__name__": "__main__", "__file__": str(path)}
          with mock.patch.object(unittest, "main", return_value=None):
              exec(compile(source, str(path), "exec"), namespace)
          cls = namespace.get("SecurityTests")
          if not isinstance(cls, type) or not issubclass(cls, unittest.TestCase):
              raise SystemExit("FAIL SecurityTests not available")
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(cls)
          actual = suite.countTestCases()
          print(f"secure-boundary collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL security test collection: {actual} != {expected}")
          result = xmlrunner.XMLTestRunner(output='reports', verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL security tests: executed={result.testsRun} expected={expected}")
          print(f"PASS security tests: executed={result.testsRun}", flush=True)
          PY
      - name: Publish security JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-security-junit
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "security_boundary=synthetic_only runtime=NOT_RUN deploy_authorized=false"


