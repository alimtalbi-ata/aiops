name: V3 spike qualification
on:
  push:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/kit/**'
      - 'v3-spike/contracts/**'
      - 'v3-spike/ux/**'
      - '.github/workflows/v3-spike-qualification.yml'
  pull_request:
    branches: [v3-spike/central-integration]
    paths:
      - '.github/workflows/v3-spike-qualification.yml'
      - 'v3-spike/kit/*compose*.yml'
      - 'v3-spike/kit/*compose*.yaml'
      - 'v3-spike/kit/preflight.py'
      - 'v3-spike/kit/fixture.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-unit:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and clean checkout
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Synthetic contract tests (locked dependency)
        run: |
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0' 'unittest-xml-reporting==3.2.0'
          python3 -B - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import unittest
          import xmlrunner
          import os
          os.makedirs('reports', exist_ok=True)
          path = pathlib.Path("v3-spike/contracts/event_store.py").resolve()
          spec = importlib.util.spec_from_file_location("v3_event_store", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(module.Tests)
          expected = 17
          actual = suite.countTestCases()
          print(f"contracts-unit collection: actual={actual} expected={expected}", flush=True)
          if actual != expected:
              raise SystemExit(f"FAIL contract test collection: {actual} != {expected}")
          result = xmlrunner.XMLTestRunner(output='reports', verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected:
              raise SystemExit(f"FAIL contract tests: executed={result.testsRun} expected={expected}")
          print(f"PASS contract tests: executed={result.testsRun}", flush=True)
          PY
      - name: Publish contracts JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-contracts-junit
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "runtime=NOT_RUN deploy_authorized=false"
  ux-browser:
