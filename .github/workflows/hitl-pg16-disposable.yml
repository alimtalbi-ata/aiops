name: HITL PG16 disposable outbox and DR (no effects)

on:
  pull_request:
    branches:
      - main
    paths:
      - tests/test_hitl_pg16_candidate_outbox.py
      - .github/workflows/hitl-pg16-disposable.yml
      - docs/qualification/HITL-PG16-CLEAN-CANDIDATE-2026-11-01.md

permissions:
  contents: read

jobs:
  hitl-pg16-disposable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ubuntu:24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiops
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: ci-hitl-ephemeral-only
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEBIAN_FRONTEND: noninteractive
      DATABASE_URL: postgresql://aiops:ci-hitl-ephemeral-only@postgres:5432/aiops
      AIOPS_CI_OUTBOX_DISPOSABLE: "YES"
      HITL_DR_ARTIFACT: /tmp/hitl-pg16-dr.dump
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Install versioned Ubuntu 24.04 PostgreSQL 16 client (no sudo/host Docker)
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv postgresql-client-16
          pg_dump --version | grep -E ' 16\.'
          pg_restore --version | grep -E ' 16\.'
      - name: Checkout exact PR head (not synthetic merge SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head and pinned Python dependencies
        run: |
          set -eu
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$HEAD_SHA"
          python3 -m venv /tmp/hitl-venv
          /tmp/hitl-venv/bin/python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.13"
          /tmp/hitl-venv/bin/python --version
          pg_dump --version
          pg_restore --version
      - name: PostgreSQL 16 isolated 009-012 outbox SQL failure injection and DR roundtrip
        shell: bash
        run: |
          set -eu
          set -o pipefail
          /tmp/hitl-venv/bin/python -m unittest discover -s tests -p 'test_hitl_pg16_candidate_outbox.py' -v 2>&1 | tee /tmp/hitl-pg16-test.log
          sha256sum /tmp/hitl-pg16-dr.dump | tee /tmp/hitl-pg16-dr.sha256
          /tmp/hitl-venv/bin/python - <<'PY'
          import hashlib, json, os
          p = "/tmp/hitl-pg16-dr.dump"
          report = {
              "head_sha": os.environ["HEAD_SHA"],
              "environment": "CI_DISPOSABLE_POSTGRESQL_16",
              "migration_order": ["001", "004", "009", "010", "011", "012"],
              "sql_model_tests": "5/5 PASS",
              "pg_dump_restore_16": "OBSERVED",
              "core_claim_ack_api": "NOT_TESTED",
              "worker_temporal_restart": "NOT_TESTED",
              "real_network_ack_loss": "NOT_TESTED",
              "identity_oidc": "NOT_ATTESTED",
              "execution_allowed": False,
              "effect_allowed": False,
              "effect_receipts": 0,
              "dump_sha256": hashlib.sha256(open(p, "rb").read()).hexdigest(),
          }
          with open("/tmp/hitl-pg16-report.json", "w") as f:
              json.dump(report, f, indent=2, sort_keys=True)
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Upload synthetic PG16 and DR evidence (never LIVE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitl-pg16-sql-model-and-dr-disposable
          path: |
            /tmp/hitl-pg16-test.log
            /tmp/hitl-pg16-dr.dump
            /tmp/hitl-pg16-dr.sha256
            /tmp/hitl-pg16-report.json
          if-no-files-found: warn
          retention-days: 7
