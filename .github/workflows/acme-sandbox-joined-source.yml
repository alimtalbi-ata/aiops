name: ACME sandbox joined source contracts (no host effects)

on:
  pull_request:
    paths:
      - 'app/core/acme_sandbox.py'
      - 'app/twin/acme_sandbox.py'
      - 'app/simulator/acme_sandbox.py'
      - 'app/worker/acme_simulated_hitl.py'
      - 'app/worker/workflow.py'
      - 'app/worker/main.py'
      - 'app/policy/acme_sandbox.py'
      - 'app/policy/main.py'
      - 'deploy/debian-acme-sim-e2e.py'
      - 'tests/test_worker_acme_simulated_hitl.py'
      - 'tests/test_policy_acme_sandbox.py'
      - 'tests/test_debian_acme_sim_e2e.py'
      - '.github/workflows/acme-sandbox-joined-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-join:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned disposable test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi==0.116.1' 'pydantic==2.11.7' 'httpx==0.28.1' 'requests==2.32.4'
      - name: Exact HEAD and source compile
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m compileall -q app/core/acme_sandbox.py app/twin/acme_sandbox.py app/simulator/acme_sandbox.py app/worker/acme_simulated_hitl.py app/worker/workflow.py app/worker/main.py app/policy/acme_sandbox.py deploy/debian-acme-sim-e2e.py
      - name: Worker causal no-effect unit tests
        run: |
          set -o pipefail
          PYTHONPATH=app:. python -m unittest discover -s tests -p 'test_worker_acme_simulated_hitl.py' -v 2>&1 | tee /tmp/acme-worker-tests.log
          grep -E '^Ran 28 tests in ' /tmp/acme-worker-tests.log
          grep -x 'OK' /tmp/acme-worker-tests.log
          ! grep -E 'skipped=|NOT_QUALIFIED' /tmp/acme-worker-tests.log
      - name: Policy sandbox security unit tests
        run: |
          set -o pipefail
          PYTHONPATH=app:. python -m unittest discover -s tests -p 'test_policy_acme_sandbox.py' -v 2>&1 | tee /tmp/acme-policy-tests.log
          grep -E '^Ran 8 tests in ' /tmp/acme-policy-tests.log
          grep -x 'OK' /tmp/acme-policy-tests.log
          ! grep -E 'skipped=|NOT_QUALIFIED' /tmp/acme-policy-tests.log
      - name: Debian runner pre-resolution and final readback unit tests
        run: |
          set -o pipefail
          PYTHONPATH=app:. python -m unittest discover -s tests -p 'test_debian_acme_sim_e2e.py' -v 2>&1 | tee /tmp/acme-debian-tests.log
          grep -E '^Ran 7 tests in ' /tmp/acme-debian-tests.log
          grep -x 'OK' /tmp/acme-debian-tests.log
          ! grep -E 'skipped=|NOT_QUALIFIED' /tmp/acme-debian-tests.log
