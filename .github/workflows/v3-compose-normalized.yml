name: V3 Compose normalized topology CI
on:
  push:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/product/docker-compose.yml'
      - '.github/workflows/v3-compose-normalized.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-normalized:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact SHA and Docker Compose availability
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker compose version
      - name: Generate normalized default and demo fixtures without pulling images
        env:
          CORE_IMAGE: 'example.invalid/core@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          TEMPORAL_IMAGE: 'example.invalid/temporal@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          WORKER_IMAGE: 'example.invalid/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          POLICY_IMAGE: 'example.invalid/policy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          HITL_IMAGE: 'example.invalid/hitl@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          EVIDENCE_IMAGE: 'example.invalid/evidence@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          GAMMA_IMAGE: 'example.invalid/gamma@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        run: |
          set -eu
          mkdir -p reports
          unset DEMO_IMAGE || true
          docker compose -f v3-spike/product/docker-compose.yml config --format json > reports/default.json
          DEMO_IMAGE='example.invalid/demo@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' docker compose -f v3-spike/product/docker-compose.yml --profile demo config --format json > reports/demo.json
          if docker compose -f v3-spike/product/docker-compose.yml config --no-interpolate --format json >/dev/null 2>&1; then
            echo "non-interpolated syntax check PASS"
          fi
      - name: Execute semantic normalized graph assertions and JUnit
        run: |
          set -eu
          python3 -m venv /tmp/v3-compose-venv
          /tmp/v3-compose-venv/bin/python -m pip install 'unittest-xml-reporting==3.2.0'
          /tmp/v3-compose-venv/bin/python - <<'PY'
          import json, pathlib, unittest, xmlrunner
          root=pathlib.Path('reports')
          default=json.loads((root/'default.json').read_text())
          demo=json.loads((root/'demo.json').read_text())
          required={'core','temporal','worker','policy','hitl','evidence','gamma'}
          class Normalized(unittest.TestCase):
              def test_default_service_set(self):
                  self.assertEqual(set(default['services']),required)
              def test_demo_service_set(self):
                  self.assertEqual(set(demo['services']),required|{'demo'})
              def test_only_gamma_publishes_loopback(self):
                  for graph in (default,demo):
                      for name,svc in graph['services'].items():
                          ports=svc.get('ports',[])
                          if name=='gamma':
                              self.assertEqual(len(ports),1)
                              self.assertEqual(ports[0]['host_ip'],'127.0.0.1')
                              self.assertEqual(int(ports[0]['published']),18080)
                          else: self.assertFalse(ports,name)
              def test_backend_is_internal(self):
                  for graph in (default,demo):
                      self.assertTrue(graph['networks']['backend']['internal'])
              def test_images_are_synthetic_digests(self):
                  for graph in (default,demo):
                      for svc in graph['services'].values():
                          self.assertRegex(svc['image'],r'^example\\.invalid/[a-z]+@sha256:a{64}$')
              def test_no_privileged_or_host_namespace(self):
                  for graph in (default,demo):
                      for svc in graph['services'].values():
                          self.assertFalse(svc.get('privileged',False))
                          self.assertNotEqual(svc.get('network_mode'),'host')
                          self.assertTrue(svc.get('read_only',False))
              def test_declared_mount_sources(self):
                  for graph in (default,demo):
                      names=set(graph.get('volumes',{}))
                      for svc in graph['services'].values():
                          for mount in svc.get('volumes',[]):
                              self.assertEqual(mount['type'],'volume')
                              self.assertIn(mount['source'],names)
              def test_worker_startup_dependencies_are_only_started(self):
                  deps=default['services']['worker']['depends_on']
                  self.assertEqual(set(deps),{'core','temporal'})
                  self.assertTrue(all(v['condition']=='service_started' for v in deps.values()))
          suite=unittest.defaultTestLoader.loadTestsFromTestCase(Normalized)
          result=xmlrunner.XMLTestRunner(output=str(root),verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun!=8:
              raise SystemExit('FAIL normalized Compose semantic tests')
          PY
      - name: Publish JUnit and normalized fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-compose-normalized-junit
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: UTC receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "docker_compose_config_only=true runtime=NOT_RUN debian=NOT_RUN"
