name: Core exact-head registered Worker 348 PG16 Temporal cross-qualification
on:
  pull_request:
    branches:
      - main
      - integration/enterprise-slice-main-20261031-2230
    paths:
      - .github/workflows/core-worker348-crosshead-pg16.yml
      - app/core/hitl_reject_delivery.py
      - tests/test_core_hitl_reject_terminal_pg16.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-worker-crosshead:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: postgres:16-bookworm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiops
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: ci-core-worker-crosshead-disposable
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://aiops:ci-core-worker-crosshead-disposable@127.0.0.1:5432/aiops
      PGPASSWORD: ci-core-worker-crosshead-disposable
      AIOPS_XREF_CI_DISPOSABLE: "1"
      AIOPS_WORKER_CORE344_JOINED: "YES"
      AIOPS_INTERNAL_TOKEN: ci-crosshead-import-only
      AIOPS_EXPECTED_HEAD_SHA: 653033bb02b721bd0f4ce90d64d95a4d83a1c4ea
      AIOPS_CORE344_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AIOPS_CORE344_ROOT: ${{ github.workspace }}
      AIOPS_WORKER_CORE344_RECEIPT_DIR: /tmp/worker-core344-crosshead-receipt
      PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}/worker348/app:${{ github.workspace }}/tests:${{ github.workspace }}/worker348/tests
    steps:
      - name: Install Git for exact two-source checkouts
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 653033bb02b721bd0f4ce90d64d95a4d83a1c4ea
          path: worker348
          persist-credentials: false
      - name: Exact Core and Worker SHAs and disposable PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$AIOPS_CORE344_HEAD_SHA"
          test "$(git -C worker348 -c safe.directory="$GITHUB_WORKSPACE/worker348" rev-parse HEAD)" = "$AIOPS_EXPECTED_HEAD_SHA"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 python3-venv socat openssl
          python3 -m venv /tmp/core-worker-crosshead-venv
          /tmp/core-worker-crosshead-venv/bin/python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.13" "requests==2.32.4" "fastapi==0.116.1" "httpx==0.28.1" "temporalio==1.16.0" "uvicorn==0.35.0"
          /tmp/core-worker-crosshead-venv/bin/python -m py_compile worker348/tests/test_worker_hitl_terminal_joined_pg16.py worker348/app/worker/main.py app/core/hitl_reject_delivery.py
          socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/tmp/core-worker-crosshead-socat.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if /usr/lib/postgresql/16/bin/pg_isready -h 127.0.0.1 -p 5432 -U aiops -d aiops >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(/usr/lib/postgresql/16/bin/psql -h 127.0.0.1 -U aiops -d aiops -Atqc 'show server_version_num' | cut -c1-2)" = 16
      - name: Two independent OS Worker pollers and persisted Temporal restart
        shell: bash
        run: |
          set -euo pipefail
          /tmp/core-worker-crosshead-venv/bin/python -m unittest discover -s worker348/tests -p 'test_worker_hitl_terminal_joined_pg16.py' -v 2>&1 | tee /tmp/core-worker-crosshead.log
          grep -E '^Ran 1 test in ' /tmp/core-worker-crosshead.log
          grep -x 'OK' /tmp/core-worker-crosshead.log
          ! grep -E 'skipped=|NOT_QUALIFIED' /tmp/core-worker-crosshead.log
      - name: Verify canonical redacted receipt and fail-closed limitations
        shell: bash
        run: |
          set -euo pipefail
          /tmp/core-worker-crosshead-venv/bin/python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["AIOPS_WORKER_CORE344_RECEIPT_DIR"])/"worker-core344-joined.json"
          data=json.loads(p.read_text())
          digest=data.pop("payload_sha256")
          assert digest==hashlib.sha256(json.dumps(data,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          assert data["worker_head"]==os.environ["AIOPS_EXPECTED_HEAD_SHA"]
          assert data["core_head"]==os.environ["AIOPS_CORE344_HEAD_SHA"]
          assert data["worker_os_processes"]==2 and data["distinct_pids"]
          assert data["temporal_persisted_restarts"]==1
          assert data["production_registered_activity"]=="reject_terminal_recover"
          assert data["core_http_recover"]=="200_DEAD"
          assert data["core_http_readback"]=="200_DEAD_IDEMPOTENT"
          assert data["core_pg16_014_rows"]==1 and data["core_pg16_015_migration"]
          assert data["core_outbox_status"]=="DEAD" and data["core_outbox_attempts"]==8
          assert data["core_replay_idempotent"] and data["post_dead_source_revoked"]=="UNKNOWN"
          assert data["unauthorized_bearer"]==401 and data["wrong_tenant"]==403
          assert data["temporal_signal_count"]==data["approve_count"]==data["effect_receipts"]==0
          assert not data["human_glpi_allow"] and not data["live_effect"] and not data["glpi_write"]
          assert not data["same_run_015_event_writer_joined"] and not data["debian_deployed"]
          assert data["release_stable"]=="NO_GO"
          for secret in ("Bearer ","postgresql://","lease_token","ci-core-worker-crosshead-disposable"):
              assert secret not in p.read_text()
          print("CORE_WORKER_CROSSHEAD_JOINED_PASS",digest)
          PY
          cd "$AIOPS_WORKER_CORE344_RECEIPT_DIR"
          sha256sum worker-core344-joined.json > worker-core344-joined.sha256
          sha256sum --check worker-core344-joined.sha256
      - name: Upload redacted two-SHA receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-worker348-crosshead-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/worker-core344-crosshead-receipt/worker-core344-joined.json
            /tmp/worker-core344-crosshead-receipt/worker-core344-joined.sha256
          retention-days: 7
          if-no-files-found: warn
