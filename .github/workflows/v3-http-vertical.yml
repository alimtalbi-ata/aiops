name: V3 HTTP vertical synthetic smoke
on:
  push:
    branches: ['v3-spike/**']
    paths:
      - 'v3-spike/vertical/**'
      - '.github/workflows/v3-http-vertical.yml'
  pull_request:
    branches: [v3-spike/central-integration]
concurrency:
  group: v3-http-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record exact tested revision
        run: git rev-parse HEAD && python3 --version
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_http_demo.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_vertical_demo.py -v

      - run: python3 -m unittest discover -s v3-spike/vertical -p test_core_read.py -v

      - run: python3 -m unittest discover -s v3-spike/vertical -p test_core_http.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_rca_preview.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_copilot_context.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_hitl_demo.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_ingestion_demo.py -v

      - run: python3 -m unittest discover -s v3-spike/vertical -p test_mattermost_demo.py -v

      - run: python3 -m unittest discover -s v3-spike/vertical -p test_glpi_demo.py -v

      - run: python3 -m unittest discover -s v3-spike/vertical -p test_glpi_rest.py -v

      - run: python3 -m unittest discover -s v3-spike/vertical -p test_glpi_bridge.py -v

      - run: python3 -m unittest discover -s v3-spike/vertical -p test_analyst_critic.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_evidence_integrity.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_correlation.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_historical_correlation.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_historical_analyst_critic.py -v
