name: V3 HTTP vertical synthetic smoke
on:
  push:
    branches: [v3-spike/p0-http-vertical-20261125, v3-spike/central-integration]
  pull_request:
    branches: [v3-spike/central-integration]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_http_demo.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_vertical_demo.py -v
