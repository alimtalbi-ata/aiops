              endpoint=origin+"/api/v1/incident-context/dynamic?run_id="+run
              with urllib.request.urlopen(endpoint,timeout=20) as response:
                  projection=json.load(response)
              copilot=projection["copilot"]
              docs=copilot["document_retrieval"]
              assert docs["run_id"]==run and docs["state"]=="MATCHED"
              assert docs["classification"]=="SYNTHETIC_DOCUMENT_RETRIEVAL"
              assert docs["operational_decision"]=="DENY" and docs["production_authorized"] is False
              assert docs["llm_inference_performed"] is False and docs["causality_established"] is False
              assert re.fullmatch(r"[a-f0-9]{64}",docs["catalog_sha256"])
              citations=docs["citations"]
              assert citations and citations[0]["doc_id"]=="SYN-LATENCY-001"
              assert all(c["asset"]=="NODE-CI-ROOT" and c["provenance"]=="SYNTHETIC_REFERENCE_ONLY" and c["observed_evidence"] is False and re.fullmatch(r"[a-f0-9]{64}",c["doc_sha256"]) for c in citations)
              assert copilot["sources"]==projection["context"]["evidence"]
              assert len(copilot["sources"])==receipt["evidence_count"]
              assert copilot["root_cause"]=="UNKNOWN" and copilot["confidence"] is None
              with urllib.request.urlopen(endpoint,timeout=20) as response:
                  assert json.load(response)["copilot"]["document_retrieval"]==docs
              print(json.dumps({"scenario":receipt_name,"run_id":run,"document_retrieval":"PASS","catalog_sha256":docs["catalog_sha256"],"citation_ids":[c["doc_id"] for c in citations],"observed_evidence_count":len(copilot["sources"]),"production_authorized":False}))
          # Enterprise E1: real persisted Core, Twin and Evidence, mixed signals.
          def ingest_enterprise(rows):
              req=urllib.request.Request(origin+"/api/v1/ingest/create",data=json.dumps(rows).encode(),headers={"Origin":origin,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)
          def read_enterprise(run):
              with urllib.request.urlopen(origin+"/api/v1/enterprise-context?run_id="+run,timeout=20) as response:
                  return json.load(response)
          p="NODE-CI-ENT-"
          base={"kind":"metric","source":"ent-ci","resource":"NODE-CI-ROOT","severity":"critical","tenant":"synthetic-demo","synthetic":True}
          scope={"asset_id":p+"ASSET-PAR","application_id":p+"APP-PAY"}
          rows=[
              dict(base,id="ent-ci-m1",enterprise=dict(scope,occurred_at="2026-01-01T09:00:00Z"),observation={"metric":"latency_ms","phase":"baseline","value":40}),
              dict(base,id="ent-ci-m2",enterprise=dict(scope,occurred_at="2026-01-01T09:00:10Z"),observation={"metric":"latency_ms","phase":"incident","value":160}),
              dict(base,id="ent-ci-l1",kind="log",enterprise=dict(scope,occurred_at="2026-01-01T09:00:11Z",group_id=p+"GROUP-FIN",user_id=p+"USER-FIN-01",message="Synthetic slow payment")),
              dict(base,id="ent-ci-e1",kind="event",enterprise=dict(scope,occurred_at="2026-01-01T09:00:12Z",message="Synthetic latency alarm"))]
          created=ingest_enterprise(rows)
          run=created["core"]["run"]["run_id"]
          assert created==ingest_enterprise(rows)
