          test "$(docker inspect -f '{{.State.Health.Status}}' "$evidence_initial")" = healthy
          "${compose[@]}" up --no-deps --no-recreate --wait --wait-timeout 300 temporal-postgres
          # Before the first execution only, recover a confirmed bind collision.
          # Never remove the database, touch other services, or retry a history test.
          temporal_log=$(mktemp "$V3_ROOT/.temporal-start.XXXXXX")
