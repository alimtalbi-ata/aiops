name: V3 source POC kit static
on:
  pull_request:
    paths:
      - 'v3-spike/kit/**'
      - 'v3-spike/vertical/**'
      - '.github/workflows/v3-poc-source-kit.yml'
      - '.github/scripts/**'
jobs:
  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n v3-spike/kit/poc-start.sh
      - run: bash -n .github/scripts/retry-rootless-compose-port.sh .github/scripts/test_retry_rootless_compose_port.sh
      - run: bash .github/scripts/test_retry_rootless_compose_port.sh
      - run: python3 -m unittest discover -s v3-spike/kit -p test_rootless_preflight.py -v
      - run: python3 -m unittest discover -s v3-spike/kit -p test_pocctl.py -v
      - run: python3 -m unittest discover -s v3-spike/kit -p 'test_poc_restore*.py' -v
      - run: python3 -m py_compile app/worker/v3_boundary.py app/worker/v3_boundary_workflow.py v3-spike/kit/poc-temporal-boundary-smoke.py v3-spike/kit/poc-temporal-ui-smoke.py
      - name: Validate Workbench JavaScript syntax before service tests
        run: |
          set -euo pipefail
          python3 - <<'PY' | node --check
          from pathlib import Path
          html=Path("v3-spike/vertical/operator.html").read_text()
          assert html.count("<script>")==1 and html.count("</script>")==1
          print(html.split("<script>",1)[1].split("</script>",1)[0])
          PY
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_hitl_demo.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_context.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_dual_model_advisory.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_ai_invocation_ledger.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_historical_rag_context.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_real_rag_fixture.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_gamma_ai_telemetry.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_ai_runtime.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_clock.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_telemetry.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_activity.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_corpus.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_knowledge.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_hybrid.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_scenarios.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_case_knowledge.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_episodes.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_triage.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_parametric.py -v
      - run: python3 -m py_compile v3-spike/kit/poc-gamma.py v3-spike/kit/poc-dynamic-smoke.py
      - run: docker compose -f v3-spike/kit/compose.poc-source.yml config --quiet
        env:
          V3_ROOT: /tmp/aiops-v3-ci
          V3_DB_PASSWORD: synthetic-ci-only
          V3_LAB_TOKEN: synthetic-ci-only-not-real-credential-0000
  real-services:
    runs-on: ubuntu-24.04
    env:
      V3_ROOT: /tmp/aiops-v3-ci
      V3_DB_PASSWORD: synthetic-ci-only
      V3_LAB_TOKEN: synthetic-ci-only-not-real-credential-0000
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$V3_ROOT/data/postgres"
      - run: docker compose -f v3-spike/kit/compose.poc-source.yml up --build --wait --wait-timeout 300
      - name: Verify actual HTTP health
        run: |
          for pair in core:810 twin:811 evidence:812 policy:813; do
            endpoint=$(docker compose -f v3-spike/kit/compose.poc-source.yml port "${pair%:*}" "${pair#*:}")
            curl --fail --silent --show-error "http://$endpoint/health"
          done
      - name: Seed and verify persistent synthetic scenario
        run: |
          compose=(docker compose -f v3-spike/kit/compose.poc-source.yml)
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U aiops -d aiops < v3-spike/kit/poc-seed.sql
          endpoint=$("${compose[@]}" port evidence 812)
          for sample in baseline:40 incident:160; do
            phase="${sample%:*}"; value="${sample#*:}"
            curl --fail --silent --show-error -H 'Content-Type: application/json' -d "{\"source\":\"poc-kit-$phase\",\"claim\":\"synthetic latency sample\",\"confidence\":0.5,\"provenance\":{\"run_id\":\"RUN-CI-CONTEXT\",\"synthetic\":true},\"payload\":{\"metric\":\"latency_ms\",\"phase\":\"$phase\",\"value\":$value}}" "http://$endpoint/api/evidence"
          done
          "${compose[@]}" down
          "${compose[@]}" up --wait --wait-timeout 300
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops -Atc "select count(*) from aiops.evidence where provenance->>'run_id'='RUN-CI-CONTEXT'")" = 2
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops -Atc "select status from aiops.runs where run_id='RUN-CI-CONTEXT'")" = CREATED
      - run: python3 -m pip install playwright==1.51.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Verify GAMMA context against actual containers
        run: |
          python3 - <<'PY'
          import sys, subprocess, threading, urllib.request, json, os
          sys.path.insert(0,"v3-spike/vertical")
          from http_demo import server
          from enterprise_clock import EnterpriseClock
          def port(name,n):
              return int(subprocess.check_output(["docker","compose","-f","v3-spike/kit/compose.poc-source.yml","port",name,str(n)],text=True).strip().rsplit(":",1)[1])
          with server(core_config=(port("core",810),os.environ["V3_LAB_TOKEN"],"RUN-CI-CONTEXT"),context_config=(port("twin",811),port("evidence",812),"NODE-CI-ROOT","INC-CI-CONTEXT"),policy_port=port("policy",813),enterprise_clock=EnterpriseClock(os.environ["V3_ROOT"])) as http:
              thread=threading.Thread(target=http.serve_forever,daemon=True)
              thread.start()
              try:
                  with urllib.request.urlopen(f"http://127.0.0.1:{http.server_port}/api/v1/incident-context?decision=simulate",timeout=20) as response:
                      body=json.load(response)
                  assert body["core"]["run"]["incident_id"]=="INC-CI-CONTEXT"
                  assert body["context"]["diagnosis"]["preview"]["conditional_reduction_ms"]==120
                  assert body["context"]["rca"]=="UNKNOWN"
                  assert body["copilot"]["sources"]==body["context"]["evidence"]
                  assert body["copilot"]["confidence"] is None
                  assert body["simulation"]["policy_decision"]=="SIMULATE"
                  assert body["simulation"]["executed_on_host"] is False
                  from playwright.sync_api import sync_playwright, expect
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch(headless=True)
                      try:
                          page=browser.new_page()
                          page.goto(f"http://127.0.0.1:{http.server_port}/")
                          page.locator("#load-context").click()
                          for value in ("INC-CI-CONTEXT","NODE-CI-CHILD","RCA: UNKNOWN","Policy: DENY","Conditional reduction: 120 ms","Copilot: Incident INC-CI-CONTEXT","Source: "):
                              expect(page.locator("#context-result")).to_contain_text(value)
                          page.locator("#context-sim").click()
                          expect(page.locator("#context-result")).to_contain_text("Policy decision: SIMULATE")
                          expect(page.locator("#context-result")).to_contain_text("Host execution: NONE")

                          page.locator("#clock-read").click()
                          expect(page.locator("#clock-result")).to_contain_text("Logical tick: 0")
                          page.locator("#param-horizon").fill("8")
                          page.locator("#param-frequency").fill("100")
                          page.locator("#param-configure").click()
                          expect(page.locator("#param-result")).to_contain_text("Planned episodes (not evidence): 7")
                          expect(page.locator("#param-result")).to_contain_text("Materialized observations: 0")
                          for tick in (1,2):
                              page.locator("#clock-next").click()
                              expect(page.locator("#clock-result")).to_contain_text("Logical tick: "+str(tick))
                          page.locator("#clock-next").click()
                          expect(page.locator("#clock-result")).to_contain_text("Logical tick: 3")
                          page.locator("#clock-open").click()
                          expect(page.locator("#enterprise-result")).to_contain_text("HISTORICAL_LOGICAL_VERSION")
                          page.locator("#hybrid-query").fill("Payments latency runbook")
                          page.locator("#hybrid-search").click()
                          expect(page.locator("#hybrid-result")).to_contain_text("ENT-DOC-001 v2")
                          expect(page.locator("#hybrid-result")).to_contain_text("BM25_CHAR_TRIGRAM_TFIDF_RRF_V1")
                          page.locator("#hybrid-query").fill("zzzzzzzz")
                          page.locator("#hybrid-search").click()
                          expect(page.locator("#hybrid-result")).to_contain_text("NO_MATCH")
                          page.locator("#scenario-catalog").click()
                          expect(page.locator("#scenario-result")).to_contain_text("WAN_LOSS")
                          expect(page.locator("#scenario-result")).to_contain_text("HR_DEVICE_FAILURE")
                          expect(page.locator("#scenario-result")).to_contain_text("Model")
                          page.locator("#clock-scenarios").click()
                          expect(page.locator("#clock-result")).to_contain_text("Scenario campaign: PUBLISHED")
                          expect(page.locator("#clock-run")).to_contain_text("CPU_SATURATION")
                          # A: actual historical search, then select a different verified run.
                          old_run=page.locator("#clock-run").input_value()
                          page.locator("#clock-open").click()
                          expect(page.locator("#enterprise-result")).to_contain_text(old_run)
                          page.locator("#hybrid-query").fill("Payments latency runbook")
                          page.locator("#hybrid-search").click()
                          expect(page.locator("#hybrid-result")).to_contain_text("ENT-DOC-001 v2")
                          hr_run=page.locator("#clock-run option").filter(has_text="HR_HTTP_ERRORS").get_attribute("value")
                          assert hr_run and hr_run!=old_run
                          page.locator("#clock-run").select_option(hr_run)
                          page.locator("#clock-open").click()
                          expect(page.locator("#enterprise-result")).to_contain_text(hr_run)
                          expect(page.locator("#hybrid-result")).to_have_text("UNKNOWN / DENY — selection changed")
                          expect(page.locator("#hybrid-result")).not_to_contain_text(old_run)
                          # Delayed response from A must not reappear after selecting B.
                          page.locator("#clock-run").select_option(old_run)
                          page.locator("#clock-open").click()
                          expect(page.locator("#enterprise-result")).to_contain_text(old_run)
                          held=[]
                          def hold_search(route):
                              held.append((route,route.fetch()))
                          page.route("**/api/v1/enterprise-search",hold_search)
                          page.locator("#hybrid-search").click()
                          for _ in range(50):
                              if held: break
                              page.wait_for_timeout(100)
                          assert len(held)==1
                          page.locator("#clock-run").select_option(hr_run)
                          page.locator("#clock-open").click()
                          expect(page.locator("#enterprise-result")).to_contain_text(hr_run)
                          held[0][0].fulfill(response=held[0][1])
                          page.unroute("**/api/v1/enterprise-search",hold_search)
                          page.wait_for_timeout(250)
                          expect(page.locator("#hybrid-result")).to_have_text("UNKNOWN / DENY — selection changed")
                          page.locator("#clock-run").select_option(old_run)
                          page.locator("#clock-open").click()
                          expect(page.locator("#enterprise-result")).to_contain_text(old_run)
                          print("A RAG run switch and late response isolation PASS")
                          page.locator("#clock-next").click()
                          expect(page.locator("#clock-result")).to_contain_text("Logical tick: 4")
                          page.locator("#param-read").click()
                          expect(page.locator("#param-result")).to_contain_text("Logical tick: 4")
                          expect(page.locator("#param-result")).to_contain_text("ONSET")
                          expect(page.locator("#param-result")).to_contain_text("Model only. Policy DENY.")
                          page.locator("#triage-read").click()
                          expect(page.locator("#triage-result")).to_contain_text("8 / 8 modeled triage cases")
                          expect(page.locator("#triage-result")).to_contain_text("CPU_CONTRADICTORY_PROBES")
                          page.locator("#triage-filter").select_option("SECURITY_REVIEW")
                          expect(page.locator("#triage-result")).to_contain_text("IDENTITY_SUSPICIOUS_ACCESS")
                          expect(page.locator("#triage-result")).not_to_contain_text("CPU_CONTRADICTORY_PROBES")
                          expect(page.locator("#triage-result")).to_contain_text("No automatic incident, cause or compromise established")
                          page.locator("#episodes-read").click()
                          expect(page.locator("#episodes-result")).to_contain_text("STORAGE_CASCADE")
                          page.locator("#episode-select").select_option("E12-0001-LYON_INTERMITTENT")
                          expect(page.locator("#episodes-result")).to_contain_text("RECURRENCE")
                          expect(page.locator("#episodes-result")).to_contain_text("Modeled only; cause and observed recovery UNKNOWN")
                          page.locator("#episode-select").select_option("E12-0001-SHARED_IDENTITY")
                          expect(page.locator("#episode-run")).to_contain_text("HR_HTTP_ERRORS")
                          page.locator("#episode-open").click()
                          expect(page.locator("#enterprise-result")).to_contain_text("HR_HTTP_ERRORS")
                          page.locator("#cases-read").click()
                          expect(page.locator("#cases-result")).to_contain_text("2 modeled case reports")
                          expect(page.locator("#cases-result")).to_contain_text("ENT-CASE-00003-CPU_SATURATION")
                          expect(page.locator("#cases-result")).to_contain_text("ENT-CASE-00003-HR_HTTP_ERRORS")
                          page.locator("#knowledge-read").click()
                          expect(page.locator("#knowledge-result")).to_contain_text("ENT-KNOW-00002-CHANGE")
                          expect(page.locator("#knowledge-result")).to_contain_text("ENT-KNOW-00004-INCIDENT")
                          page.locator("#corpus-read").click()
                          expect(page.locator("#corpus-result")).to_contain_text("ENT-DOC-001 v2")
                          expect(page.locator("#corpus-result")).to_contain_text("Valid from tick 2")
                          expect(page.locator("#corpus-result")).to_contain_text("not observed evidence")
                          page.locator("#activity-read").click()
                          expect(page.locator("#activity-result")).to_contain_text("ALERT_ONLY")
                          expect(page.locator("#activity-result")).to_contain_text("INCIDENT_LINKED")
                          page.locator("#activity-filter").select_option("NODE-CI-ENT-APP-HR")
                          expect(page.locator("#activity-result")).to_contain_text("NODE-CI-ENT-APP-HR")
                          expect(page.locator("#activity-result")).not_to_contain_text("NODE-CI-ENT-APP-CRM")
                          expect(page.locator("#activity-result")).not_to_contain_text("ALERT_ONLY")
                          page.locator("#inventory-load").click()
                          expect(page.locator("#inventory-result")).to_contain_text("34 nodes",timeout=30000)
                          page.locator("#inventory-root").select_option("NODE-CI-ENT-IDENTITY")
                          page.locator("#inventory-impact").click()
                          for value in ("NODE-CI-ENT-APP-PAY","NODE-CI-ENT-APP-CRM","NODE-CI-ENT-APP-HR"):
                              expect(page.locator("#inventory-impact-result")).to_contain_text(value)
                          page.locator("#inventory-root").select_option("NODE-CI-ENT-PC-FIN-01")
                          page.locator("#inventory-impact").click()
                          expect(page.locator("#inventory-impact-result")).to_contain_text("INDIVIDUAL_ACCESS_ONLY")
                          expect(page.locator("#inventory-impact-result")).to_contain_text("NODE-CI-ENT-USER-FIN-01")
                          expect(page.locator("#inventory-impact-result")).not_to_contain_text("NODE-CI-ENT-USER-FIN-02")
                          page.locator("#create-enterprise").click()
                          expect(page.locator("#load-enterprise")).to_be_enabled(timeout=30000)
                          page.locator("#load-enterprise").click()
                          for value in ("Potential exposure", "Payments", "Customer CRM", "NODE-CI-ENT-USER-FIN-01", "Synthetic user reports slow payment", "ENT-DOC-001", "ENT-DOC-003", "Policy DENY"):
                              expect(page.locator("#enterprise-result")).to_contain_text(value,timeout=30000)
                          expect(page.locator("#enterprise-result")).not_to_contain_text("Independent HR portal")
                          page.locator("#load-dynamic-context").click()
                          expect(page.locator("#context-result")).to_contain_text("Conditional reduction: 120 ms",timeout=30000)
                          measured=json.loads(subprocess.check_output([sys.executable,"v3-spike/kit/poc-multiasset-observed.py",f"http://127.0.0.1:{http.server_port}"],text=True))
                          for incident in measured["incidents"]:
                              page.locator("#enterprise-run-id").fill(incident["run_id"])
                              page.locator("#enterprise-open-run").click()
                              expect(page.locator("#enterprise-result")).to_contain_text(incident["run_id"],timeout=30000)
                              expect(page.locator("#enterprise-result")).to_contain_text("MEASURED_SYNTHETIC_LAB")
                              if incident["resource"]=="NODE-CI-ENT-ASSET-LYO":
                                  expect(page.locator("#enterprise-result")).to_contain_text("ENT-DOC-004")
                                  expect(page.locator("#enterprise-result")).not_to_contain_text("ENT-DOC-001")
                          # E18 UI: real Core/Evidence/Twin on disposable containers, no mocks for success.
                          import uuid
                          from test_enterprise_correlation import row
                          origin=f"http://127.0.0.1:{http.server_port}"
                          run_ids=[]
                          evidence_ids=[]
                          for resource,stamp in (("NODE-CI-ENT-WAN","2026-01-01T09:00:00Z"),("NODE-CI-ENT-NET-LYO","2026-01-01T09:00:01Z")):
                              item=row(uuid.uuid4().hex,resource,stamp)
                              request=urllib.request.Request(origin+"/api/v1/ingest/create",data=json.dumps([item]).encode(),headers={"Origin":origin,"Content-Type":"application/json"})
                              with urllib.request.urlopen(request,timeout=20) as response:
                                  created=json.load(response)
                              run_ids.append(created["core"]["run"]["run_id"])
                              evidence_ids.append(created["stored_evidence"][0]["evidence_id"])
                          page.locator("#assessment-runs").fill("\n".join(run_ids))
                          page.locator("#assessment-read").click()
                          for value in ("COMPATIBLE_NOT_PROOF","NODE-CI-ENT-WAN","NODE-CI-ENT-NET-LYO","RCA: UNKNOWN","Policy DENY",*run_ids,*evidence_ids):
                              expect(page.locator("#assessment-result")).to_contain_text(value,timeout=30000)
                          page.locator("#assessment-result button").first.click()
                          expect(page.locator("#enterprise-result")).to_contain_text(run_ids[1],timeout=30000)
                          page.locator("#assessment-runs").fill(run_ids[0]+" "+run_ids[0])
                          expect(page.locator("#assessment-result")).to_be_empty()
                          page.locator("#assessment-read").click()
                          expect(page.locator("#assessment-state")).to_contain_text("2–5 distinct")
                          page.locator("#assessment-runs").fill("\n".join(run_ids))
                          held_assessment=[]
                          def hold_assessment(route):
                              held_assessment.append((route,route.fetch()))
                          page.route("**/api/v1/enterprise-correlation/assessment",hold_assessment)
                          page.locator("#assessment-read").click()
                          for _ in range(50):
                              if held_assessment: break
                              page.wait_for_timeout(100)
                          assert len(held_assessment)==1
                          page.locator("#assessment-window").fill("60")
                          held_assessment[0][0].fulfill(response=held_assessment[0][1])
                          page.unroute("**/api/v1/enterprise-correlation/assessment",hold_assessment)
                          page.wait_for_timeout(250)
                          expect(page.locator("#assessment-result")).to_be_empty()
                          expect(page.locator("#assessment-state")).to_contain_text("window changed")
                          print("E18 GAMMA historical assessment actual evidence and stale response isolation PASS")
                      finally:
                          browser.close()
              finally:
                  http.shutdown()
                  thread.join(5)
          PY
      - name: Verify actual GAMMA AI telemetry browser
        run: PYTHONPATH=v3-spike/vertical python3 v3-spike/vertical/poc_gamma_ai_telemetry.py
      - name: Verify actual GAMMA explicit AI review browser
        run: PYTHONPATH=v3-spike/vertical python3 v3-spike/vertical/poc_gamma_ai_runtime.py
      - name: Backup and restore into separate synthetic database
        run: |
          set -euo pipefail
          umask 077
          compose=(docker compose -f v3-spike/kit/compose.poc-source.yml)
          mkdir -p "$V3_ROOT/backup"
          "${compose[@]}" exec -T postgres pg_dump -U aiops -Fc aiops > "$V3_ROOT/backup/poc.dump"
          test -s "$V3_ROOT/backup/poc.dump"
          "${compose[@]}" exec -T postgres createdb -U aiops aiops_restore_ci
          "${compose[@]}" exec -T postgres pg_restore --exit-on-error -U aiops -d aiops_restore_ci < "$V3_ROOT/backup/poc.dump"
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops_restore_ci -Atc "select count(*) from aiops.evidence where provenance->>'run_id'='RUN-CI-CONTEXT'")" = 2
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops_restore_ci -Atc "select status from aiops.runs where run_id='RUN-CI-CONTEXT'")" = CREATED
          "${compose[@]}" exec -T postgres dropdb -U aiops aiops_restore_ci
      - if: always()
        run: docker compose -f v3-spike/kit/compose.poc-source.yml down
  rootless:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V3_ROOT: /tmp/aiops-v3-rootless-ci
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated rootless daemon
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker-rootless-ci.list
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session docker-ce-rootless-extras
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          # Disposable runner only: provision dedicated daemon storage before starting Docker.
          test ! -e "$V3_ROOT"
          install -m 0700 -d "$V3_ROOT" "$HOME/.config/docker"
          test ! -e "$HOME/.config/docker/daemon.json"
          (umask 077; printf '{"data-root":"%s/docker-data"}\n' "$V3_ROOT" > "$HOME/.config/docker/daemon.json")
          dockerd-rootless-setuptool.sh install --force
          systemctl --user start docker
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Start and seed using actual rootless launcher
        run: |
          docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless
