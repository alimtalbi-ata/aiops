name: V3 source POC kit static
on:
  pull_request:
    paths:
      - 'v3-spike/kit/**'
      - 'v3-spike/vertical/**'
      - '.github/workflows/v3-poc-source-kit.yml'
jobs:
  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n v3-spike/kit/poc-start.sh
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_context.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_clock.py -v
      - run: python3 -m unittest discover -s v3-spike/vertical -p test_enterprise_telemetry.py -v
      - run: python3 -m py_compile v3-spike/kit/poc-gamma.py v3-spike/kit/poc-dynamic-smoke.py
      - run: docker compose -f v3-spike/kit/compose.poc-source.yml config --quiet
        env:
          V3_ROOT: /tmp/aiops-v3-ci
          V3_DB_PASSWORD: synthetic-ci-only
          V3_LAB_TOKEN: synthetic-ci-only-not-real-credential-0000
  real-services:
    runs-on: ubuntu-24.04
    env:
      V3_ROOT: /tmp/aiops-v3-ci
      V3_DB_PASSWORD: synthetic-ci-only
      V3_LAB_TOKEN: synthetic-ci-only-not-real-credential-0000
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$V3_ROOT/data/postgres"
      - run: docker compose -f v3-spike/kit/compose.poc-source.yml up --build --wait --wait-timeout 300
      - name: Verify actual HTTP health
        run: |
          for pair in core:810 twin:811 evidence:812 policy:813; do
            endpoint=$(docker compose -f v3-spike/kit/compose.poc-source.yml port "${pair%:*}" "${pair#*:}")
            curl --fail --silent --show-error "http://$endpoint/health"
          done
      - name: Seed and verify persistent synthetic scenario
        run: |
          compose=(docker compose -f v3-spike/kit/compose.poc-source.yml)
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U aiops -d aiops < v3-spike/kit/poc-seed.sql
          endpoint=$("${compose[@]}" port evidence 812)
          for sample in baseline:40 incident:160; do
            phase="${sample%:*}"; value="${sample#*:}"
            curl --fail --silent --show-error -H 'Content-Type: application/json' -d "{\"source\":\"poc-kit-$phase\",\"claim\":\"synthetic latency sample\",\"confidence\":0.5,\"provenance\":{\"run_id\":\"RUN-CI-CONTEXT\",\"synthetic\":true},\"payload\":{\"metric\":\"latency_ms\",\"phase\":\"$phase\",\"value\":$value}}" "http://$endpoint/api/evidence"
          done
          "${compose[@]}" down
          "${compose[@]}" up --wait --wait-timeout 300
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops -Atc "select count(*) from aiops.evidence where provenance->>'run_id'='RUN-CI-CONTEXT'")" = 2
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops -Atc "select status from aiops.runs where run_id='RUN-CI-CONTEXT'")" = CREATED
      - run: python3 -m pip install playwright==1.51.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Verify GAMMA context against actual containers
        run: |
          python3 - <<'PY'
          import sys, subprocess, threading, urllib.request, json, os
          sys.path.insert(0,"v3-spike/vertical")
          from http_demo import server
          def port(name,n):
              return int(subprocess.check_output(["docker","compose","-f","v3-spike/kit/compose.poc-source.yml","port",name,str(n)],text=True).strip().rsplit(":",1)[1])
          with server(core_config=(port("core",810),os.environ["V3_LAB_TOKEN"],"RUN-CI-CONTEXT"),context_config=(port("twin",811),port("evidence",812),"NODE-CI-ROOT","INC-CI-CONTEXT"),policy_port=port("policy",813)) as http:
              thread=threading.Thread(target=http.serve_forever,daemon=True)
              thread.start()
              try:
                  with urllib.request.urlopen(f"http://127.0.0.1:{http.server_port}/api/v1/incident-context?decision=simulate",timeout=20) as response:
                      body=json.load(response)
                  assert body["core"]["run"]["incident_id"]=="INC-CI-CONTEXT"
                  assert body["context"]["diagnosis"]["preview"]["conditional_reduction_ms"]==120
                  assert body["context"]["rca"]=="UNKNOWN"
                  assert body["copilot"]["sources"]==body["context"]["evidence"]
                  assert body["copilot"]["confidence"] is None
                  assert body["simulation"]["policy_decision"]=="SIMULATE"
                  assert body["simulation"]["executed_on_host"] is False
                  from playwright.sync_api import sync_playwright, expect
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch(headless=True)
                      try:
                          page=browser.new_page()
                          page.goto(f"http://127.0.0.1:{http.server_port}/")
                          page.locator("#load-context").click()
                          for value in ("INC-CI-CONTEXT","NODE-CI-CHILD","RCA: UNKNOWN","Policy: DENY","Conditional reduction: 120 ms","Copilot: Incident INC-CI-CONTEXT","Source: "):
                              expect(page.locator("#context-result")).to_contain_text(value)
                          page.locator("#context-sim").click()
                          expect(page.locator("#context-result")).to_contain_text("Policy decision: SIMULATE")
                          expect(page.locator("#context-result")).to_contain_text("Host execution: NONE")

                          page.locator("#inventory-load").click()
                          expect(page.locator("#inventory-result")).to_contain_text("34 nodes",timeout=30000)
                          page.locator("#inventory-root").select_option("NODE-CI-ENT-IDENTITY")
                          page.locator("#inventory-impact").click()
                          for value in ("NODE-CI-ENT-APP-PAY","NODE-CI-ENT-APP-CRM","NODE-CI-ENT-APP-HR"):
                              expect(page.locator("#inventory-impact-result")).to_contain_text(value)
                          page.locator("#inventory-root").select_option("NODE-CI-ENT-PC-FIN-01")
                          page.locator("#inventory-impact").click()
                          expect(page.locator("#inventory-impact-result")).to_contain_text("INDIVIDUAL_ACCESS_ONLY")
                          expect(page.locator("#inventory-impact-result")).to_contain_text("NODE-CI-ENT-USER-FIN-01")
                          expect(page.locator("#inventory-impact-result")).not_to_contain_text("NODE-CI-ENT-USER-FIN-02")
                          page.locator("#create-enterprise").click()
                          expect(page.locator("#load-enterprise")).to_be_enabled(timeout=30000)
                          page.locator("#load-enterprise").click()
                          for value in ("Potential exposure", "Payments", "Customer CRM", "NODE-CI-ENT-USER-FIN-01", "Synthetic user reports slow payment", "ENT-DOC-001", "ENT-DOC-003", "Policy DENY"):
                              expect(page.locator("#enterprise-result")).to_contain_text(value,timeout=30000)
                          expect(page.locator("#enterprise-result")).not_to_contain_text("Independent HR portal")
                          page.locator("#load-dynamic-context").click()
                          expect(page.locator("#context-result")).to_contain_text("Conditional reduction: 120 ms",timeout=30000)
                          measured=json.loads(subprocess.check_output([sys.executable,"v3-spike/kit/poc-multiasset-observed.py",f"http://127.0.0.1:{http.server_port}"],text=True))
                          for incident in measured["incidents"]:
                              page.locator("#enterprise-run-id").fill(incident["run_id"])
                              page.locator("#enterprise-open-run").click()
                              expect(page.locator("#enterprise-result")).to_contain_text(incident["run_id"],timeout=30000)
                              expect(page.locator("#enterprise-result")).to_contain_text("MEASURED_SYNTHETIC_LAB")
                              if incident["resource"]=="NODE-CI-ENT-ASSET-LYO":
                                  expect(page.locator("#enterprise-result")).to_contain_text("ENT-DOC-004")
                                  expect(page.locator("#enterprise-result")).not_to_contain_text("ENT-DOC-001")
                      finally:
                          browser.close()
              finally:
                  http.shutdown()
                  thread.join(5)
          PY
      - name: Backup and restore into separate synthetic database
        run: |
          set -euo pipefail
          umask 077
          compose=(docker compose -f v3-spike/kit/compose.poc-source.yml)
          mkdir -p "$V3_ROOT/backup"
          "${compose[@]}" exec -T postgres pg_dump -U aiops -Fc aiops > "$V3_ROOT/backup/poc.dump"
          test -s "$V3_ROOT/backup/poc.dump"
          "${compose[@]}" exec -T postgres createdb -U aiops aiops_restore_ci
          "${compose[@]}" exec -T postgres pg_restore --exit-on-error -U aiops -d aiops_restore_ci < "$V3_ROOT/backup/poc.dump"
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops_restore_ci -Atc "select count(*) from aiops.evidence where provenance->>'run_id'='RUN-CI-CONTEXT'")" = 2
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops_restore_ci -Atc "select status from aiops.runs where run_id='RUN-CI-CONTEXT'")" = CREATED
          "${compose[@]}" exec -T postgres dropdb -U aiops aiops_restore_ci
      - if: always()
        run: docker compose -f v3-spike/kit/compose.poc-source.yml down
  rootless:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V3_ROOT: /tmp/aiops-v3-rootless-ci
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated rootless daemon
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker-rootless-ci.list
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session docker-ce-rootless-extras
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dockerd-rootless-setuptool.sh install --force
          systemctl --user start docker
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Start and seed using actual rootless launcher
        run: |
          docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless
          bash v3-spike/kit/poc-start.sh
      - name: Qualify upgrade from pre-008 schema on disposable runner
        run: |
          set -euo pipefail
          project="aiops-v3-poc-$(printf %s "$V3_ROOT" | sha256sum | cut -c1-12)"
          compose=(docker compose --project-name "$project" --env-file "$V3_ROOT/poc.env" -f v3-spike/kit/compose.poc-source.yml)
          "${compose[@]}" stop core twin evidence policy
          # Only the disposable CI database, before any dynamic run is created.
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U aiops -d aiops -c "alter table aiops.run_events drop column event_key"
          bash v3-spike/kit/poc-start.sh
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops -Atc "select to_regclass('aiops.ux_run_events_event_key') is not null")" = t
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops -Atc "select count(*) from aiops.evidence where provenance->>'run_id'='RUN-CI-CONTEXT'")" = 2
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops -Atc "select status from aiops.runs where run_id='RUN-CI-CONTEXT'")" = CREATED
          backup=$(find "$V3_ROOT/backup" -maxdepth 1 -type f -name 'pre-008.*' -print -quit)
          test -s "$backup"
          "${compose[@]}" exec -T postgres pg_restore --list < "$backup" >/dev/null
          bash v3-spike/kit/poc-start.sh
          test "$(find "$V3_ROOT/backup" -maxdepth 1 -type f -name 'pre-008.*' | wc -l)" = 1
      - name: Verify actual GAMMA launcher
        run: |
          umask 077
          printf "TOKEN=%s\nCHANNEL_ID=%s\n" "$(python3 -c 'import secrets; print(secrets.token_hex(13))')" "abcdefghijklmnopqrstuvwxyz" > "$V3_ROOT/mattermost.env"
          python3 v3-spike/kit/poc-gamma.py > "$RUNNER_TEMP/gamma.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            url=$(sed -n 's/^POC GAMMA: //p' "$RUNNER_TEMP/gamma.log")
            if [[ -n "$url" ]]; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          [[ "$url" =~ ^http://127\.0\.0\.1:[0-9]+$ ]]
          python3 v3-spike/kit/poc-enterprise-clock-smoke.py "$url" > "$V3_ROOT/clock-first.json"
          cat "$V3_ROOT/clock-first.json"
          python3 v3-spike/kit/poc-dynamic-smoke.py "$url" > "$V3_ROOT/dynamic-smoke.json"
          cat "$V3_ROOT/dynamic-smoke.json"
          python3 v3-spike/kit/poc-dynamic-smoke.py "$url" --observed > "$V3_ROOT/observed-smoke.json"
          cat "$V3_ROOT/observed-smoke.json"
          python3 v3-spike/kit/poc-multiasset-observed.py "$url" > "$V3_ROOT/multiasset-observed.json"
          cat "$V3_ROOT/multiasset-observed.json"
          curl --fail --silent --show-error "$url/api/v1/incident-context?decision=simulate" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["simulation"]["policy_decision"]=="SIMULATE"; assert d["simulation"]["executed_on_host"] is False; assert d["context"]["rca"]=="UNKNOWN"; assert d["copilot"]["sources"]==d["context"]["evidence"]; assert d["copilot"]["confidence"] is None'
          python3 - "$url" <<'PY'
          import json,sys,urllib.request,urllib.parse,urllib.error,os,pathlib
          config=dict(line.split("=",1) for line in (pathlib.Path(os.environ["V3_ROOT"])/"mattermost.env").read_text().splitlines())
          form={"token":config["TOKEN"],"channel_id":config["CHANNEL_ID"],"command":"/aiops","text":"incident"}
          def chat(fields):
              req=urllib.request.Request(sys.argv[1]+"/api/v1/mattermost/command",data=urllib.parse.urlencode(fields).encode())
              with urllib.request.urlopen(req,timeout=20) as response: return json.load(response)
          result=chat(form)
          assert result["response_type"]=="ephemeral" and "INC-CI-CONTEXT" in result["text"] and "DENY" in result["text"]
          try: chat(dict(form,token="wrong"))
          except urllib.error.HTTPError as exc: assert exc.code==403
          else: raise AssertionError("invalid token accepted")
          origin=sys.argv[1]
          # Validate reference documents through the actual GAMMA launcher, for both
          # deterministic and measured HTTP-latency runs. Do not count them as evidence.
          import re
          for receipt_name in ("dynamic-smoke.json","observed-smoke.json"):
              receipt=json.loads((pathlib.Path(os.environ["V3_ROOT"])/receipt_name).read_text())
              run=receipt["run_id"]
              assert re.fullmatch(r"RUN-[A-F0-9]{16}",run)
              endpoint=origin+"/api/v1/incident-context/dynamic?run_id="+run
              with urllib.request.urlopen(endpoint,timeout=20) as response:
                  projection=json.load(response)
              copilot=projection["copilot"]
              docs=copilot["document_retrieval"]
              assert docs["run_id"]==run and docs["state"]=="MATCHED"
              assert docs["classification"]=="SYNTHETIC_DOCUMENT_RETRIEVAL"
              assert docs["operational_decision"]=="DENY" and docs["production_authorized"] is False
              assert docs["llm_inference_performed"] is False and docs["causality_established"] is False
              assert re.fullmatch(r"[a-f0-9]{64}",docs["catalog_sha256"])
              citations=docs["citations"]
              assert citations and citations[0]["doc_id"]=="SYN-LATENCY-001"
              assert all(c["asset"]=="NODE-CI-ROOT" and c["provenance"]=="SYNTHETIC_REFERENCE_ONLY" and c["observed_evidence"] is False and re.fullmatch(r"[a-f0-9]{64}",c["doc_sha256"]) for c in citations)
              assert copilot["sources"]==projection["context"]["evidence"]
              assert len(copilot["sources"])==receipt["evidence_count"]
              assert copilot["root_cause"]=="UNKNOWN" and copilot["confidence"] is None
              with urllib.request.urlopen(endpoint,timeout=20) as response:
                  assert json.load(response)["copilot"]["document_retrieval"]==docs
              print(json.dumps({"scenario":receipt_name,"run_id":run,"document_retrieval":"PASS","catalog_sha256":docs["catalog_sha256"],"citation_ids":[c["doc_id"] for c in citations],"observed_evidence_count":len(copilot["sources"]),"production_authorized":False}))
          # Enterprise E1: real persisted Core, Twin and Evidence, mixed signals.
          def ingest_enterprise(rows):
              req=urllib.request.Request(origin+"/api/v1/ingest/create",data=json.dumps(rows).encode(),headers={"Origin":origin,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)
          def read_enterprise(run):
              with urllib.request.urlopen(origin+"/api/v1/enterprise-context?run_id="+run,timeout=20) as response:
                  return json.load(response)
          p="NODE-CI-ENT-"
          base={"kind":"metric","source":"ent-ci","resource":"NODE-CI-ROOT","severity":"critical","tenant":"synthetic-demo","synthetic":True}
          scope={"asset_id":p+"ASSET-PAR","application_id":p+"APP-PAY"}
          rows=[
              dict(base,id="ent-ci-m1",enterprise=dict(scope,occurred_at="2026-01-01T09:00:00Z"),observation={"metric":"latency_ms","phase":"baseline","value":40}),
              dict(base,id="ent-ci-m2",enterprise=dict(scope,occurred_at="2026-01-01T09:00:10Z"),observation={"metric":"latency_ms","phase":"incident","value":160}),
              dict(base,id="ent-ci-l1",kind="log",enterprise=dict(scope,occurred_at="2026-01-01T09:00:11Z",group_id=p+"GROUP-FIN",user_id=p+"USER-FIN-01",message="Synthetic slow payment")),
              dict(base,id="ent-ci-e1",kind="event",enterprise=dict(scope,occurred_at="2026-01-01T09:00:12Z",message="Synthetic latency alarm"))]
          created=ingest_enterprise(rows)
          run=created["core"]["run"]["run_id"]
          assert created==ingest_enterprise(rows)
          ent=read_enterprise(run)
          assert ent["run_id"]==run and ent["incident_id"]==created["core"]["run"]["incident_id"]
          assert len(ent["timeline"])==4 and ent["reported_user_ids"]==[p+"USER-FIN-01"]
          assert [x["event_id"] for x in ent["timeline"]]==["ent-ci-m1","ent-ci-m2","ent-ci-l1","ent-ci-e1"]
          assert {x["node_id"] for x in ent["potential_exposure"]["applications"]}=={p+"APP-PAY",p+"APP-CRM"}
          assert {x["node_id"] for x in ent["potential_exposure"]["users"]}=={p+"USER-FIN-01",p+"USER-FIN-02",p+"USER-SALES-01",p+"USER-DIRECT-01"}
          assert {x["id"] for x in ent["document_references"]}=={"ENT-DOC-001","ENT-DOC-003"}
          assert ent["observed_outage_established"] is False and ent["production_authorized"] is False
          assert {x["evidence_id"]:x["payload_hash"] for x in ent["timeline"]}=={x["evidence_id"]:x["payload_hash"] for x in created["stored_evidence"]}
          with urllib.request.urlopen(origin+"/api/v1/incident-context/dynamic?run_id="+run,timeout=20) as response:
              combined=json.load(response)
          assert combined["enterprise_context"]==ent
          assert combined["copilot"]["enterprise_document_retrieval"]["citations"]==ent["document_references"]
          assert combined["copilot"]["sources"]==combined["context"]["evidence"]
          single=dict(rows[2],id="ent-ci-user-only",enterprise=dict(scope,occurred_at="2026-01-01T09:01:00Z",user_id=p+"USER-DIRECT-01",message="Synthetic isolated user report"))
          other=ingest_enterprise([single])
          individual=read_enterprise(other["core"]["run"]["run_id"])
          assert individual["run_id"]!=run and individual["reported_user_ids"]==[p+"USER-DIRECT-01"]
          assert len(individual["timeline"])==1 and individual["observed_outage_established"] is False
          for bad in (dict(rows[2],id="ent-ci-invalid",enterprise=dict(rows[2]["enterprise"],user_id=p+"USER-HR-01")),dict(rows[2],id="ent-ci-foreign",tenant="foreign")):
              try: ingest_enterprise([bad])
              except urllib.error.HTTPError as exc: assert exc.code==503
              else: raise AssertionError("foreign or contradictory scope accepted")
          receipt={"result":"PASS","run_id":run,"evidence_count":4,"individual_run_id":individual["run_id"],"topology_sha256":ent["topology_sha256"],"production_authorized":False}
          (pathlib.Path(os.environ["V3_ROOT"])/"enterprise-smoke.json").write_text(json.dumps(receipt))
          print(json.dumps(receipt))
          with urllib.request.urlopen(origin+"/api/v1/enterprise-inventory",timeout=20) as response:
              inventory=json.load(response)
          assert len(inventory["nodes"])==34 and len(inventory["incident_roots"])==16
          assert inventory["production_authorized"] is False
          technical=[]
          for name,app,expected_apps,expected_users,doc in (
              ("IDENTITY",None,{"APP-PAY","APP-CRM","APP-HR"},{"USER-FIN-01","USER-FIN-02","USER-SALES-01","USER-HR-01","USER-DIRECT-01"},"ENT-DOC-009"),
              ("PC-FIN-01","APP-PAY",{"APP-PAY"},{"USER-FIN-01"},"ENT-DOC-010"),
              ("DB-PAY","APP-PAY",{"APP-PAY"},{"USER-FIN-01","USER-FIN-02","USER-DIRECT-01"},"ENT-DOC-007")):
              scope={"asset_id":p+name,"occurred_at":"2026-01-01T09:10:00Z","message":"Synthetic technical dependency incident"}
              if app: scope["application_id"]=p+app
              if name=="PC-FIN-01": scope["user_id"]=p+"USER-FIN-01"
              row=dict(base,id="e4-"+name.lower(),kind="log",resource=p+name,enterprise=scope)
              created=ingest_enterprise([row])
              run=created["core"]["run"]["run_id"]
              ctx=read_enterprise(run)
              assert ctx["root"]==p+name and ctx["observed_outage_established"] is False
              assert {x["node_id"] for x in ctx["potential_exposure"]["applications"]}=={p+x for x in expected_apps}
              assert {x["node_id"] for x in ctx["potential_exposure"]["users"]}=={p+x for x in expected_users}
              assert doc in {x["id"] for x in ctx["document_references"]}
              with urllib.request.urlopen(origin+"/api/v1/incident-context/dynamic?run_id="+run,timeout=20) as response:
                  combined=json.load(response)
              assert combined["enterprise_context"]==ctx
              assert combined["copilot"]["enterprise_document_retrieval"]["citations"]==ctx["document_references"]
              assert combined["copilot"]["enterprise_scope"]["potential_application_ids"]==[x["node_id"] for x in ctx["potential_exposure"]["applications"]]
              assert combined["copilot"]["root_cause"]=="UNKNOWN" and combined["copilot"]["operational_decision"]=="DENY"
              if name=="PC-FIN-01":
                  assert ctx["exposure_semantics"]=="INDIVIDUAL_ACCESS_ONLY" and ctx["reported_user_ids"]==[p+"USER-FIN-01"] and not ctx["potential_exposure"]["groups"]
                  bad=dict(row,id="e4-invalid",enterprise=dict(scope,user_id=p+"USER-FIN-02"))
                  try: ingest_enterprise([bad])
                  except urllib.error.HTTPError as exc: assert exc.code==503
                  else: raise AssertionError("unbound workstation user accepted")
              technical.append({"root":ctx["root"],"run_id":run,"potential_apps":len(expected_apps),"potential_users":len(expected_users)})
          print(json.dumps({"classification":"E4_TECHNICAL_SCOPE","result":"PASS","incidents":technical,"production_authorized":False}))
          (pathlib.Path(os.environ["V3_ROOT"])/"technical-smoke.json").write_text(json.dumps(technical))
          def post(path,body):
              req=urllib.request.Request(origin+"/api/v1/hitl/"+path,data=json.dumps(body).encode(),headers={"Origin":origin,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)
          for approved,expected in ((True,"SIMULATE_ONLY"),(False,"DENY")):
              pending=post("request",{})
              payload={"request_id":pending["request_id"],"approved":approved}
              receipt=post("decide",payload)
              assert receipt["decision"]==expected
              assert receipt["executed_on_host"] is False
              assert post("decide",payload)["decision"]=="DENY"
          PY
      - name: Backup and restore into separate synthetic database
        run: |
          set -euo pipefail
          umask 077
          project="aiops-v3-poc-$(printf %s "$V3_ROOT" | sha256sum | cut -c1-12)"
          compose=(docker compose --project-name "$project" --env-file "$V3_ROOT/poc.env" -f v3-spike/kit/compose.poc-source.yml)
          "${compose[@]}" down
          bash v3-spike/kit/poc-start.sh
          mkdir -p "$V3_ROOT/backup"
          "${compose[@]}" exec -T postgres pg_dump -U aiops -Fc aiops > "$V3_ROOT/backup/poc.dump"
          test -s "$V3_ROOT/backup/poc.dump"
          "${compose[@]}" exec -T postgres createdb -U aiops aiops_restore_ci
          "${compose[@]}" exec -T postgres pg_restore --exit-on-error -U aiops -d aiops_restore_ci < "$V3_ROOT/backup/poc.dump"
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops_restore_ci -Atc "select count(*) from aiops.evidence where provenance->>'run_id'='RUN-CI-CONTEXT'")" = 2
          test "$("${compose[@]}" exec -T postgres psql -U aiops -d aiops_restore_ci -Atc "select status from aiops.runs where run_id='RUN-CI-CONTEXT'")" = CREATED
          python3 - "$V3_ROOT/dynamic-smoke.json" <<'PY'
          import json,sys,subprocess,os,hashlib,re
          receipt=json.load(open(sys.argv[1]))
          run=receipt["run_id"]
          assert re.fullmatch(r"RUN-[A-F0-9]{16}",run) and receipt["result"]=="PASS"
          root=os.environ["V3_ROOT"]
          compose=["docker","compose","--project-name","aiops-v3-poc-"+hashlib.sha256(root.encode()).hexdigest()[:12],"--env-file",root+"/poc.env","-f","v3-spike/kit/compose.poc-source.yml"]
          for db in ("aiops","aiops_restore_ci"):
              def query(sql): return subprocess.check_output(compose+["exec","-T","postgres","psql","-U","aiops","-d",db,"-Atc",sql],text=True).strip()
              assert query("select status from aiops.runs where run_id=\'"+run+"\'")=="CREATED"
              assert query("select count(*) from aiops.evidence where provenance->>\'run_id\'=\'"+run+"\'")==str(receipt["evidence_count"])
          PY
          python3 - "$V3_ROOT/enterprise-smoke.json" <<'PY'
          import json,sys,subprocess,os,hashlib,re
          receipt=json.load(open(sys.argv[1]))
          root=os.environ["V3_ROOT"]
          compose=["docker","compose","--project-name","aiops-v3-poc-"+hashlib.sha256(root.encode()).hexdigest()[:12],"--env-file",root+"/poc.env","-f","v3-spike/kit/compose.poc-source.yml"]
          for run,count in ((receipt["run_id"],4),(receipt["individual_run_id"],1)):
              assert re.fullmatch(r"RUN-[A-F0-9]{16}",run)
              for db in ("aiops","aiops_restore_ci"):
                  def query(sql): return subprocess.check_output(compose+["exec","-T","postgres","psql","-U","aiops","-d",db,"-Atc",sql],text=True).strip()
                  assert query("select status from aiops.runs where run_id='"+run+"'")=="CREATED"
                  assert query("select count(*) from aiops.evidence where provenance->>'run_id'='"+run+"' and payload->'signal' ? 'enterprise'")==str(count)
                  assert query("select count(*) from aiops.twin_nodes where node_id like 'NODE-CI-ENT-%'")=="32"
          measured=json.load(open(root+"/multiasset-observed.json"))
          assert measured["result"]=="PASS" and len(measured["incidents"])==2
          for item in measured["incidents"]:
              run=item["run_id"]
              resource=item["resource"]
              assert re.fullmatch(r"RUN-[A-F0-9]{16}",run)
              assert resource in ("NODE-CI-ROOT","NODE-CI-ENT-ASSET-LYO")
              for db in ("aiops","aiops_restore_ci"):
                  def query(sql): return subprocess.check_output(compose+["exec","-T","postgres","psql","-U","aiops","-d",db,"-Atc",sql],text=True).strip()
                  assert query("select count(*) from aiops.evidence where provenance->>'run_id'='"+run+"' and payload->>'resource'='"+resource+"'")=="4"
                  assert query("select count(*) from aiops.evidence where provenance->>'run_id'='"+run+"' and payload->'signal'->'enterprise'->'measurement'->>'classification'='MEASURED_SYNTHETIC_LAB'")=="2"
          technical=json.load(open(root+"/technical-smoke.json"))
          assert len(technical)==3
          for item in technical:
              run=item["run_id"]; resource=item["root"]
              assert re.fullmatch(r"RUN-[A-F0-9]{16}",run) and resource in ("NODE-CI-ENT-IDENTITY","NODE-CI-ENT-PC-FIN-01","NODE-CI-ENT-DB-PAY")
              for db in ("aiops","aiops_restore_ci"):
                  def query(sql): return subprocess.check_output(compose+["exec","-T","postgres","psql","-U","aiops","-d",db,"-Atc",sql],text=True).strip()
                  assert query("select count(*) from aiops.evidence where provenance->>'run_id'='"+run+"' and payload->>'resource'='"+resource+"'")=="1"
                  assert query("select count(*) from aiops.twin_edges where edge_id like 'EDGE-CI-TECH-%'")=="32"
          clock=json.load(open(root+"/clock-first.json"))
          assert clock["result"]=="PASS" and len(set(clock["technical_run_ids"]))==4
          for run in clock["technical_run_ids"]:
              assert re.fullmatch(r"RUN-[A-F0-9]{16}",run)
              for db in ("aiops","aiops_restore_ci"):
                  def query(sql): return subprocess.check_output(compose+["exec","-T","postgres","psql","-U","aiops","-d",db,"-Atc",sql],text=True).strip()
                  assert query("select count(*) from aiops.evidence where provenance->>'run_id'='"+run+"'")== "3"
                  assert query("select count(*) from aiops.evidence where provenance->>'run_id'='"+run+"' and payload->'signal'->'enterprise'->'telemetry'->>'classification'='MEASURED_ISOLATED_WORKLOAD'")=="2"
          print("E5 technical evidence restore PASS")
          print("E4 technical inventory and incident restore PASS")
          print("E3 measured multiasset evidence restore PASS")
          print("Enterprise E1 graph and signal restore PASS")
          PY
          "${compose[@]}" exec -T postgres dropdb -U aiops aiops_restore_ci
      - name: Resume enterprise logical clock after service and launcher restart
        run: |
          set -euo pipefail
          python3 v3-spike/kit/poc-gamma.py > "$RUNNER_TEMP/gamma-clock-restart.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            url=$(sed -n 's/^POC GAMMA: //p' "$RUNNER_TEMP/gamma-clock-restart.log")
            if [[ -n "$url" ]]; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          [[ "$url" =~ ^http://127\.0\.0\.1:[0-9]+$ ]]
          python3 v3-spike/kit/poc-enterprise-clock-smoke.py "$url" --restart > "$V3_ROOT/clock-restart.json"
          cat "$V3_ROOT/clock-restart.json"
      - name: Verify isolated SQLite clock backup and restore
        run: |
          set -euo pipefail
          python3 v3-spike/kit/poc-clock-backup-smoke.py "$V3_ROOT"
      - if: always()
        run: |
          if [[ -f "$V3_ROOT/poc.env" ]]; then
            project="aiops-v3-poc-$(printf %s "$V3_ROOT" | sha256sum | cut -c1-12)"
            docker compose --project-name "$project" --env-file "$V3_ROOT/poc.env" -f v3-spike/kit/compose.poc-source.yml down
          fi
