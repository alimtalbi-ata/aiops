          curl --fail --silent --show-error "$url/api/v1/incident-context?decision=simulate" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["simulation"]["policy_decision"]=="SIMULATE"; assert d["simulation"]["executed_on_host"] is False; assert d["context"]["rca"]=="UNKNOWN"; assert d["copilot"]["sources"]==d["context"]["evidence"]; assert d["copilot"]["confidence"] is None'
          python3 - "$url" <<'PY'
          import json,sys,urllib.request,urllib.parse,urllib.error,os,pathlib
          config=dict(line.split("=",1) for line in (pathlib.Path(os.environ["V3_ROOT"])/"mattermost.env").read_text().splitlines())
          form={"token":config["TOKEN"],"channel_id":config["CHANNEL_ID"],"command":"/aiops","text":"incident"}
          def chat(fields):
              req=urllib.request.Request(sys.argv[1]+"/api/v1/mattermost/command",data=urllib.parse.urlencode(fields).encode())
              with urllib.request.urlopen(req,timeout=20) as response: return json.load(response)
          result=chat(form)
          assert result["response_type"]=="ephemeral" and "INC-CI-CONTEXT" in result["text"] and "DENY" in result["text"]
          try: chat(dict(form,token="wrong"))
          except urllib.error.HTTPError as exc: assert exc.code==403
          else: raise AssertionError("invalid token accepted")
          origin=sys.argv[1]
          # Validate reference documents through the actual GAMMA launcher, for both
          # deterministic and measured HTTP-latency runs. Do not count them as evidence.
          import re
          for receipt_name in ("dynamic-smoke.json","observed-smoke.json"):
              receipt=json.loads((pathlib.Path(os.environ["V3_ROOT"])/receipt_name).read_text())
