          for i in $(seq 1 30); do
            url=$(sed -n 's/^POC GAMMA: //p' "$RUNNER_TEMP/gamma.log")
            if [[ -n "$url" ]]; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          [[ "$url" =~ ^http://127\.0\.0\.1:[0-9]+$ ]]
          # E15: snapshot persisted Core/Evidence state around the read-only preview.
          project="aiops-v3-poc-$(printf %s "$V3_ROOT" | sha256sum | cut -c1-12)"
          compose=(docker compose --project-name "$project" --env-file "$V3_ROOT/poc.env" -f v3-spike/kit/compose.poc-source.yml)
          snapshot_correlation_state() {
            local table
            for table in runs run_events evidence gates twin_nodes twin_edges command_receipts; do
              "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U aiops -d aiops -Atc "select count(*), md5(coalesce(string_agg(to_jsonb(t)::text, '|' order by to_jsonb(t)::text), '')) from aiops.$table t"
            done
          }
          before=$(snapshot_correlation_state)
