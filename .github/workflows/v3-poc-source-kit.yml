          cat "$V3_ROOT/clock-first.json"
          python3 v3-spike/kit/poc-dynamic-smoke.py "$url" > "$V3_ROOT/dynamic-smoke.json"
          cat "$V3_ROOT/dynamic-smoke.json"
          python3 v3-spike/kit/poc-dynamic-smoke.py "$url" --observed > "$V3_ROOT/observed-smoke.json"
          cat "$V3_ROOT/observed-smoke.json"
          python3 v3-spike/kit/poc-multiasset-observed.py "$url" > "$V3_ROOT/multiasset-observed.json"
