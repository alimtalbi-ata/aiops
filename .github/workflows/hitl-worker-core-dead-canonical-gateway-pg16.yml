name: HITL Worker canonical Core DEAD gateway replay PG16 disposable

on:
  pull_request:
    branches:
      - integration/enterprise-slice-main-20261031-2230
    paths:
      - tests/test_worker_core_dead_canonical_gateway_pg16.py
      - .github/workflows/hitl-worker-core-dead-canonical-gateway-pg16.yml
      - docs/qualification/HITL-WORKER-CORE-DEAD-CANONICAL-GATEWAY-2026-11-01.md

permissions:
  contents: read

jobs:
  canonical-dead-gateway-pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ubuntu:24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiops
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: ci-hitl-ephemeral-only
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEBIAN_FRONTEND: noninteractive
      DATABASE_URL: postgresql://aiops:ci-hitl-ephemeral-only@postgres:5432/aiops
      AIOPS_CI_COMBINED_DISPOSABLE: "YES"
      AIOPS_CI_CORE_DEAD_POSITIVE: "YES"
      AIOPS_CI_CANONICAL_DEAD_GATEWAY: "YES"
      AIOPS_CI_OUTBOX_DISPOSABLE: "YES"
      AIOPS_CI_WORKER_DISPOSABLE: "YES"
      AIOPS_CI_CANONICAL_DEAD_RECEIPT_DIR: /tmp/hitl-core-dead-canonical-receipts
      HITL_DR_ARTIFACT: /tmp/hitl-core-dead-canonical-pg16-dr.dump
      AIOPS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Install PostgreSQL 16 client in disposable CI
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv postgresql-client-16
          pg_dump --version | grep -E ' 16[.]'
          pg_restore --version | grep -E ' 16[.]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact HEAD and install pinned test clients
        run: |
          set -eu
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$AIOPS_EXPECTED_HEAD_SHA"
          python3 -m venv /tmp/hitl-combined-venv
          /tmp/hitl-combined-venv/bin/python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.13" "fastapi==0.116.1" "httpx==0.28.1" "requests==2.32.4" "temporalio==1.16.0" "uvicorn==0.35.0"
          /tmp/hitl-combined-venv/bin/python -m py_compile tests/test_worker_core_dead_canonical_gateway_pg16.py
      - name: Canonical Core HTTP DEAD and gateway close replay with Temporal persisted restart
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=app:tests /tmp/hitl-combined-venv/bin/python -m unittest discover -s tests -p 'test_worker_core_dead_canonical_gateway_pg16.py' -v 2>&1 | tee /tmp/hitl-core-dead-canonical.log
      - name: Validate redacted exact-head machine-readable receipt
        shell: bash
        run: |
          set -euo pipefail
          /tmp/hitl-combined-venv/bin/python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path(os.environ["AIOPS_CI_CANONICAL_DEAD_RECEIPT_DIR"]) / "canonical-dead-gateway.json"
          receipt = json.loads(path.read_text())
          digest = receipt.pop("payload_sha256")
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          assert digest == hashlib.sha256(canonical).hexdigest(), "receipt_digest_mismatch"
          assert receipt["source_head"] == os.environ["AIOPS_EXPECTED_HEAD_SHA"]
          assert receipt["schema"] == "aiops.worker-canonical-dead-gateway-replay.v1"
          assert receipt["core_http"] == "CANONICAL_CORE_MAIN_TCP_OBSERVED"
          assert receipt["migration_014"] == "CORE_OWNED_RUNTIME_OBSERVED"
          assert receipt["event_count"] == receipt["dead_count"] == receipt["audit_row_count"] == 2
          assert len({e["event_id"] for e in receipt["events"]}) == 2
          assert all(e["status"] == "DEAD" and e["attempts"] == 8 and e["decision"] == "REJECT" and e["audit_rows"] == 1 for e in receipt["events"])
          assert receipt["gateway_close"] == "INJECTED_AFTER_CORE_TCP_DEAD_COMMIT"
          assert receipt["gateway_replay_idempotent"] is True
          assert receipt["temporal_persisted_restarts"] == 1
          assert receipt["terminal_permission_separate"] is True
          assert receipt["stale_ack_rejected_count"] == 2
          assert receipt["temporal_signal_count"] == receipt["approve_count"] == receipt["delivered_count"] == receipt["effect_receipt_count"] == 0
          assert receipt["execution_allowed"] is False and receipt["effect_allowed"] is False
          assert receipt["sql_dead_injection"] is False
          assert receipt["physical_packet_loss"] == "NOT_TESTED"
          assert receipt["oidc_glpi_identity"] == "NOT_ATTESTED"
          assert receipt["host_7777"] == "NOT_VERIFIED"
          assert receipt["universal_exactly_once"] == "NOT_CLAIMED"
          raw = path.read_text().lower()
          assert not any(s in raw for s in ("bearer", "lease_token", "hmac_secret", "postgresql://"))
          print("CANONICAL_DEAD_GATEWAY_RECEIPT_PASS", digest)
          PY
          sha256sum "$AIOPS_CI_CANONICAL_DEAD_RECEIPT_DIR/canonical-dead-gateway.json" > /tmp/hitl-core-dead-canonical.sha256
          sha256sum --check /tmp/hitl-core-dead-canonical.sha256
      - name: PostgreSQL 16 outbox DR restore regression
        shell: bash
        run: |
          set -euo pipefail
          /tmp/hitl-combined-venv/bin/python -m unittest discover -s tests -p 'test_hitl_pg16_candidate_outbox.py' -v 2>&1 | tee /tmp/hitl-core-dead-canonical-dr.log
          test -s "$HITL_DR_ARTIFACT"
          pg_restore --version | grep -E ' 16[.]'
          sha256sum "$HITL_DR_ARTIFACT" > /tmp/hitl-core-dead-canonical-dr.sha256
          sha256sum --check /tmp/hitl-core-dead-canonical-dr.sha256
      - name: Upload redacted receipt and checksums ONLY, never PostgreSQL dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitl-worker-canonical-dead-gateway-pg16-receipts-only
          path: |
            /tmp/hitl-core-dead-canonical-receipts/canonical-dead-gateway.json
            /tmp/hitl-core-dead-canonical.sha256
            /tmp/hitl-core-dead-canonical-dr.sha256
          retention-days: 7
          if-no-files-found: warn
