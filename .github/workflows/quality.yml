name: AIOps quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  policy-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install policy test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi==0.116.1" "pydantic==2.11.7"
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Policy safety unit tests
        run: python -m unittest discover -s tests -p "test_policy_safety.py" -v
      - name: Evidence-backed demo video validation (offline, fail-closed)
        run: python -m unittest discover -s tests -p "test_evidence_video.py" -v
      - name: Evidence video bundle MP4/SRT/receipt (real offline ffmpeg)
        run: |
          command -v ffmpeg
          command -v ffprobe
          python -m unittest discover -s tests -p "test_evidence_video_bundle.py" -v
      - name: Playwright capture safety contract (offline, no browser)
        run: python -m unittest discover -s tests -p "test_evidence_browser_capture.py" -v
      - name: Evidence input snapshot pinning and TOCTOU regression (offline)
        run: python -m unittest discover -s tests -p "test_evidence_snapshot.py" -v
      - name: Capture publication rollback and collision safety (offline)
        run: python -m unittest discover -s tests -p "test_evidence_publish.py" -v
      - name: Secret preflight unit tests
        run: bash tests/test_preflight_secrets.sh
      - name: Static repository audit
        run: bash tests/static-audit.sh
      - name: Validate Compose configuration with generated secrets
        run: bash deploy/init-env.sh && docker compose --env-file .env config >/dev/null
