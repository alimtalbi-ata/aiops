name: AIOps quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  quality-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi==0.116.1" "pydantic==2.11.7" "requests==2.32.4" "httpx==0.28.1" "temporalio==1.17.0" "psycopg[binary]==3.2.9" "PyJWT[crypto]==2.10.1"
      - name: Compile Python source
        run: python -m compileall -q app tests tools
      - name: Policy safety unit tests
        env:
          PYTHONPATH: app
          AIOPS_POLICY_STATE_DB: ${{ runner.temp }}/aiops-policy-safety.sqlite3
        run: python -m unittest discover -s tests -p "test_policy_safety.py" -v
      - name: Intelligence contract and adversarial tests
        run: |
          python -m unittest discover -s tests -p "test_intelligence_contract.py" -v
          python -m unittest discover -s tests -p "test_hitl_workflow_contract.py" -v
          python -m unittest discover -s tests -p "test_hitl_identity.py" -v
      - name: Analyst Critic fail-closed fault injection
        run: python -m unittest discover -s tests -p "test_ai_failure_injection.py" -v
      - name: HITL workflow and outbox fault injection (offline, no effects)
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p "test_hitl_failure_injection.py" -v
          python -m unittest discover -s tests -p "test_hitl_outbox_failure_injection.py" -v
          python -m unittest discover -s tests -p "test_hitl_outbox_worker_replay_failure_injection.py" -v
          python -m unittest discover -s tests -p "test_hitl_stage_start_ack_failure_injection.py" -v
      - name: Portal demo launch contract tests
        run: python -m unittest discover -s tests -p "test_portal_demo.py" -v
      - name: Demo Studio V2 synthetic stage-marker presentation contract
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p "test_demo_v2.py" -v
          python -m unittest discover -s tests -p "test_portal_preview_readonly.py" -v
      - name: ACME P0 cross-lot fail-closed contracts (1-4/5)
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p "test_find_acme_demo_run.py" -v
          python -m unittest discover -s tests -p "test_acme_core_authenticated_probe.py" -v
          python -m unittest discover -s tests -p "test_acme_itsm_evidence*.py" -v
          python -m unittest discover -s tests -p "test_acme_policy_demo_result.py" -v
          python -m unittest discover -s tests -p "test_probe_acme_twin_path.py" -v
          python -m unittest discover -s tests -p "test_acme_glpi_ticket_read.py" -v
          python -m unittest discover -s tests -p "test_acme_noc_glpi_join.py" -v
      - name: AI evaluation harness tests
        run: python -m unittest discover -s tests -p "test_ai_eval_harness.py" -v
      - name: Model evaluation API unit tests
        run: python -m unittest discover -s tests -p "test_model_evaluation_api.py" -v
      - name: Deterministic inference provider contract tests
        run: python -m unittest discover -s tests -p "test_fake_provider_quality.py" -v
      - name: PostgreSQL run-stage persistence contract tests
        run: python -m unittest discover -s tests -p "test_stage_persistence.py" -v
      - name: Authenticated policy and evidence boundary tests
        run: python -m unittest discover -s tests -p "test_internal_auth.py" -v
      - name: Event replay idempotency tests
        run: python -m unittest discover -s tests -p "test_event_idempotency.py" -v
      - name: Operational diagnostics redaction tests
        run: python -m unittest discover -s tests -p "test_redact_logs.py" -v
      - name: Internal HTTP retry safety tests
        run: python -m unittest discover -s tests -p "test_shared_http.py" -v
      - name: Shared safety invariant tests
        run: python -m unittest discover -s tests -p "test_safety_invariants.py" -v
      - name: Evidence freshness tests
        run: python -m unittest discover -s tests -p "test_freshness.py" -v
      - name: Evidence integrity and model grounding tests
        run: python -m unittest discover -s tests -p "test_evidence_contract.py" -v
      - name: Evidence identity and replay contract tests
        run: |
          python -m unittest discover -s tests -p "test_evidence_identity.py" -v
          python -m unittest discover -s tests -p "test_evidence_ingestion.py" -v
          python -m unittest discover -s tests -p "test_backup_verification.py" -v
      - name: Temporal worker boot contract tests
        run: python -m unittest discover -s tests -p "test_worker_boot.py" -v
      - name: Static, SQL and Temporal contract audits
        run: bash tests/static-audit.sh && bash tests/sql-audit.sh && bash tests/migration-contract.sh && bash tests/core-ledger-contract.sh && bash tests/backup-contract.sh && bash tests/temporal-contract.sh && bash tests/lifecycle-safety-contract.sh
      - name: Offline backup verification and restore safety tests
        run: python -m unittest discover -s tests -p "test_backup_verification.py" -v
      - name: Docker ownership and isolated deployment tests
        run: |
          python -m unittest discover -s tests -p "test_docker_ownership.py" -v
          python -m unittest discover -s tests -p "test_deployment_isolation.py" -v
      - name: Approved poller and Docker rollback-name contract (offline)
        run: |
          python -m unittest discover -s tests -p "test_poll_approved_deploy.py" -v
          python -m unittest discover -s tests -p "test_install_approved_cron.py" -v
          python -m unittest discover -s tests -p "test_demo_stable_rollback_name.py" -v
          python -m unittest discover -s tests -p "test_deploy_acme_p0.py" -v
      - name: Release P0 integrated ledger and Evidence offline contracts
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p "test_demo_ledger_read.py" -v
          python -m unittest discover -s tests -p "test_demo_evidence_receipts.py" -v
          python -m unittest discover -s tests -p "test_demo_field_readonly.py" -v
      - name: Secret preflight tests
        run: bash tests/test_preflight_secrets.sh
      - name: Isolated deployment identity contract
        run: bash tests/isolated-deploy-contract.sh
      - name: Zero-mutation isolation plan and topology safety tests
        run: python -m unittest discover -s tests -p "test_deployment_isolation.py" -v
      - name: Read-only operational status and redaction tests
        run: python -m unittest discover -s tests -p "test_stack_status.py" -v
      - name: Extracted-kit offline repackaging safety tests
        run: python -m unittest discover -s tests -p "test_package_tree.py" -v
      - name: Cumulative release ZIP adversarial verification tests
        run: python -m unittest discover -s tests -p "test_package_verification.py" -v
      - name: Generate isolated CI environment
        run: bash deploy/init-env.sh
      - name: Validate full Compose model
        run: docker compose --env-file .env config --quiet
      - name: Build every application image
        run: docker compose --env-file .env build
      - name: Build opt-in model evaluation runner
        run: docker compose --env-file .env --profile qualification build aiops2-model-evaluator

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Python for disposable HITL integration
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure PostgreSQL 16 client from matching container image
        run: |
          mkdir -p "$RUNNER_TEMP/pg16-bin"
          for client in pg_dump pg_restore psql; do
            cat > "$RUNNER_TEMP/pg16-bin/$client" <<EOF
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec docker run --rm --network host \
            -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /tmp:/tmp \
            -w "$GITHUB_WORKSPACE" postgres:16-alpine $client "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/pg16-bin/$client"
          done
          echo "$RUNNER_TEMP/pg16-bin" >> "$GITHUB_PATH"
          docker run --rm postgres:16-alpine pg_dump --version | grep -E ' 16\.'
          docker run --rm postgres:16-alpine pg_restore --version | grep -E ' 16\.'
      - name: Install pinned PostgreSQL 16 HITL test dependencies
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.13" "fastapi==0.116.1" "pydantic==2.11.7"
      - name: Apply complete migration chain to disposable PostgreSQL
        env:
          PGPASSWORD: ci-only-password
        run: |
          for file in db/migrations/*.sql; do
            echo "APPLY $file"
            psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Assert AI decision ledger and immutable audit triggers exist
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='aiops' and table_name in ('analysis_records','critique_records','policy_decisions','action_proposals','approval_records','effect_receipts','verification_records','reconciliation_records','learning_cases','model_evaluation_runs')" | grep -x 10
          psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='aiops' and table_name='hitl_decision_outbox'" | grep -x 1
          psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_trigger where not tgisinternal and tgname like 'trg_immutable_%'" | grep -x 9
      - name: Verify immutable ledger and gold-set safety invariants
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -c "insert into aiops.runs(run_id,mode,scenario_id,status,idempotency_key) values('CI-LEDGER-RUN','DEMO','CI-SCENARIO','CREATED','CI-LEDGER-RUN-KEY')"
          psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -c "insert into aiops.analysis_records(analysis_id,run_id,idempotency_key,revision,contract_version,provider,model,prompt_version,evidence_ids,evidence_set_hash,output,confidence,status) values('CI-IMMUTABLE-ANALYSIS','CI-LEDGER-RUN','CI-IMMUTABLE-KEY',1,'2.0','ci','fake','ci-test','[]','fixture-hash','{}',0.5,'VALID')"
          if psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -c "update aiops.analysis_records set confidence=0.1 where analysis_id='CI-IMMUTABLE-ANALYSIS'" 2>/tmp/immutable.err; then echo "FAIL|immutable_analysis_was_mutable"; exit 1; fi
          grep -Fq "immutable ledger" /tmp/immutable.err
          echo "IMMUTABLE_ANALYSIS=PASS"
          psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -c "insert into aiops.evidence(evidence_id,source,claim,confidence,provenance,payload_hash,payload) values('CI-GOLD-EVIDENCE','ci-fixture','synthetic learning guard fixture',0.9,jsonb_build_object('synthetic',false),'ci-gold-hash','{}'::jsonb)"
          if psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -c "insert into aiops.learning_cases(learning_case_id,idempotency_key,source_run_id,revision,case_type,synthetic,human_reviewed,outcome_verified,gold_eligible,evidence_ids,reviewed_at,reviewed_by,review_note) values('CI-GOLD-REJECT','CI-GOLD-KEY','CI-LEDGER-RUN',1,'INCIDENT',true,true,false,true,jsonb_build_array('CI-GOLD-EVIDENCE'),now(),'ci-reviewer','negative eligibility fixture')" 2>/tmp/gold.err; then echo "FAIL|synthetic_case_entered_gold_set"; exit 1; fi
          grep -Fq "gold learning eligibility" /tmp/gold.err
          echo "SYNTHETIC_GOLD_SET_BLOCK=PASS"
      - name: Exercise proposal, dual approval, effect, verification and learning lifecycle
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -f tests/sql/ledger-invariants.sql
      - name: Verify atomic Evidence identity and append-only constraints
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -f tests/sql/evidence-identity-invariants.sql
      - name: Qualify HITL outbox concurrency and lease fencing on disposable PostgreSQL 16
        env:
          AIOPS_CI_OUTBOX_DISPOSABLE: "YES"
          PGPASSWORD: ci-only-password
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: aiops
          PGDATABASE: aiops
        run: python tests/test_hitl_pg16_outbox_integration.py
      - name: Upload PostgreSQL 16 HITL outbox qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops2-hitl-pg16-outbox-report
          path: reports/hitl-pg16-outbox.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Qualified disposable PostgreSQL disaster recovery drill
        env:
          PGPASSWORD: ci-only-password
        run: bash tests/postgres-dr-rehearsal.sh
      - name: Upload recovery qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops2-postgres-dr-report
          path: reports/postgres-dr-rehearsal.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Reapply Evidence identity migration to prove idempotency
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -f db/migrations/010_evidence_identity.sql
      - name: Reapply decision ledger migration to prove idempotency
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -f db/migrations/009_ai_decision_ledger.sql
      - name: Reapply HITL decision outbox migration to prove idempotency
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U aiops -d aiops -v ON_ERROR_STOP=1 -f db/migrations/011_hitl_decision_outbox.sql

  mariadb-dr-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rehearse isolated MariaDB backup and restore
        env:
          AIOPS_CI_DR: "YES"
        run: bash tests/mariadb-dr-rehearsal.sh
      - name: Upload MariaDB disaster recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops2-mariadb-dr-report
          path: reports/mariadb-dr-rehearsal.json
          if-no-files-found: ignore
          retention-days: 30

  migration-runner-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate isolated environment
        run: bash deploy/init-env.sh
      - name: Prepare legacy-only initdb fixture
        run: |
          mkdir -p /tmp/aiops-legacy-migrations
          cp db/migrations/00[0-8]_*.sql /tmp/aiops-legacy-migrations/
          cat > /tmp/compose-migrate.yml <<'YAML'
          services:
            aiops2-postgres:
              image: postgres:16-alpine
              container_name: aiops2-postgres
              environment:
                POSTGRES_DB: ${POSTGRES_DB:-aiops}
                POSTGRES_USER: ${POSTGRES_USER:-aiops}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
              volumes:
                - /tmp/aiops-legacy-migrations:/docker-entrypoint-initdb.d:ro
          YAML
      - name: Upgrade legacy schema and prove repeatability
        env:
          COMPOSE_FILE: /tmp/compose-migrate.yml
        run: |
          docker compose --env-file .env up -d
          for i in $(seq 1 60); do
            docker compose --env-file .env exec -T aiops2-postgres pg_isready -h 127.0.0.1 -U aiops -d aiops >/dev/null 2>&1 && break
            sleep 1
          done
          docker compose --env-file .env exec -T aiops2-postgres pg_isready -h 127.0.0.1 -U aiops -d aiops
          bash deploy/migrate.sh
          psql_command="docker compose --env-file .env exec -T aiops2-postgres psql -At -U aiops -d aiops"
          eval "$psql_command -c \"select count(*) from information_schema.tables where table_schema='aiops' and table_name='analysis_records'\"" | grep -x 1
          eval "$psql_command -c \"select count(*) from public.aiops_schema_migrations where execution_mode='APPLIED' and version='009_ai_decision_ledger.sql'\"" | grep -x 1
          bash deploy/migrate.sh | grep -F 'MIGRATION=SKIP|009_ai_decision_ledger.sql'
          docker compose --env-file .env down -v

  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: compose.yml:.github/compose.e2e.yml
      COMPOSE_PROFILES: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate isolated CI environment
        run: bash deploy/init-env.sh
      - name: Validate test-profile Compose override
        run: docker compose --env-file .env config --quiet
      - name: Start isolated full Core dependency graph with deterministic provider
        run: docker compose --env-file .env up -d --build --wait --wait-timeout 180 aiops2-portal aiops2-simulator aiops2-test-llm aiops2-worker
      - name: Run explicit schema upgrade runner
        run: bash deploy/migrate.sh
      - name: Qualify real Temporal workflow against deterministic synthetic provider
        run: bash tests/runtime-e2e.sh
      - name: Qualify Evidence replay, deduplication and cross-run isolation
        run: bash tests/evidence-e2e.sh
      - name: Build deterministic model evaluation runner
        run: docker compose --env-file .env --profile test --profile qualification build aiops2-model-evaluator
      - name: Score evidence-grounded Analyst/Critic fixtures and persist evaluation
        run: |
          mkdir -p reports
          AIOPS_EVAL_UID="$(id -u)" AIOPS_EVAL_GID="$(id -g)" docker compose --env-file .env --profile test --profile qualification run --rm aiops2-model-evaluator
          bash tests/model-evaluation-e2e.sh
      - name: Restart disposable Temporal and Worker then verify synthetic no-effect replay
        env:
          AIOPS_CI_DISPOSABLE: "YES"
        run: |
          test "$AIOPS_CI_DISPOSABLE" = "YES"
          test "$COMPOSE_PROFILES" = "test"
          docker compose --env-file .env restart aiops2-temporal aiops2-worker
          docker compose --env-file .env up -d --wait --wait-timeout 180 aiops2-temporal aiops2-worker
          bash tests/runtime-e2e.sh
      - name: Qualify real Core outbox to Temporal CI sink after disposable restart
        env:
          AIOPS_CI_DISPOSABLE: "YES"
        run: |
          test "$AIOPS_CI_DISPOSABLE" = "YES"
          test "$COMPOSE_PROFILES" = "test"
          mkdir -p reports
          docker compose --env-file .env exec -T \
            -e AIOPS_CI_DISPOSABLE=YES -e GITHUB_ACTIONS=true -e COMPOSE_PROFILES=test \
            aiops2-core sh -c 'cat > /tmp/ci_hitl_outbox_temporal.py && python /tmp/ci_hitl_outbox_temporal.py' \
            < tests/hitl_outbox_temporal_disposable.py > reports/hitl-outbox-temporal.json
          python3 - <<'PY'
          import json
          r=json.load(open("reports/hitl-outbox-temporal.json",encoding="utf-8"))
          assert r["result"]=="PASS" and r["mode"]=="DEMO"
          assert r["outbox_state"]=="DELIVERED" and r["attempts"]==2
          assert r["temporal_signals"]==2 and r["effect_receipts"]==0
          assert r["execution_allowed"] is False and r["effect_allowed"] is False
          assert r["identity"]=="NOT_ATTESTED"
          assert r["ci_sink_worker_restart_inflight"]=="OBSERVED"
          assert r["production_worker_restart_inflight"]=="NOT_TESTED"
          assert r["temporal_server_restart_inflight"]=="NOT_TESTED"
          print("CI_HITL_OUTBOX_TEMPORAL=PASS|signals=2|effects=0|sink_worker_replay=OBSERVED")
          PY
      - name: Prepare no-effect outbox workflow pending across Temporal server restart
        env:
          AIOPS_CI_DISPOSABLE: "YES"
        run: |
          test "$AIOPS_CI_DISPOSABLE" = "YES"
          test "$COMPOSE_PROFILES" = "test"
          docker compose --env-file .env exec -T \
            -e AIOPS_CI_DISPOSABLE=YES -e GITHUB_ACTIONS=true -e COMPOSE_PROFILES=test \
            aiops2-core sh -c 'cat > /tmp/ci_hitl_temporal_restart.py && python /tmp/ci_hitl_temporal_restart.py prepare' \
            < tests/hitl_temporal_server_restart_disposable.py > reports/hitl-temporal-restart-prepared.json
          python3 - <<'PY'
          import json
          r=json.load(open("reports/hitl-temporal-restart-prepared.json",encoding="utf-8"))
          assert r["phase"]=="PREPARED" and r["attempts"]==1
          assert r["identity"]=="NOT_ATTESTED" and r["effect_receipts"]==0
          assert r["execution_allowed"] is False and r["effect_allowed"] is False
          print("CI_TEMPORAL_RESTART_PENDING=PASS|effects=0")
          PY
      - name: Restart disposable Temporal server and application Worker while HITL workflow is in flight
        env:
          AIOPS_CI_DISPOSABLE: "YES"
        run: |
          test "$AIOPS_CI_DISPOSABLE" = "YES"
          test "$COMPOSE_PROFILES" = "test"
          test -s reports/hitl-temporal-restart-prepared.json
          worker_container="$(docker compose --env-file .env ps -q aiops2-worker)"
          test -n "$worker_container"
          worker_started_before="$(docker inspect -f '{{.State.StartedAt}}' "$worker_container")"
          docker compose --env-file .env restart aiops2-temporal aiops2-worker
          docker compose --env-file .env up -d --wait --wait-timeout 180 aiops2-temporal aiops2-worker
          worker_started_after="$(docker inspect -f '{{.State.StartedAt}}' "$worker_container")"
          test -n "$worker_started_after"
          test "$worker_started_before" != "$worker_started_after"
          echo "CI_APP_WORKER_RESTART_INFLIGHT=PASS"
      - name: Recover in-flight Temporal history and replay synthetic REJECT without effects
        env:
          AIOPS_CI_DISPOSABLE: "YES"
        run: |
          test "$AIOPS_CI_DISPOSABLE" = "YES"
          test "$COMPOSE_PROFILES" = "test"
          docker compose --env-file .env exec -T \
            -e AIOPS_CI_DISPOSABLE=YES -e GITHUB_ACTIONS=true -e COMPOSE_PROFILES=test \
            -e AIOPS_CI_TEMPORAL_RESTARTED_INFLIGHT=YES \
            -e AIOPS_CI_APP_WORKER_RESTARTED_INFLIGHT=YES \
            aiops2-core python /tmp/ci_hitl_temporal_restart.py resume \
            < reports/hitl-temporal-restart-prepared.json > reports/hitl-temporal-restart.json
          python3 - <<'PY'
          import json
          r=json.load(open("reports/hitl-temporal-restart.json",encoding="utf-8"))
          assert r["result"]=="PASS" and r["mode"]=="DEMO"
          assert r["outbox_state"]=="DELIVERED" and r["attempts"]==2
          assert r["temporal_signals"]==2 and r["effect_receipts"]==0
          assert r["execution_allowed"] is False and r["effect_allowed"] is False
          assert r["identity"]=="NOT_ATTESTED"
          assert r["temporal_server_restart_inflight"]=="OBSERVED_CI_DISPOSABLE"
          assert r["app_worker_restart_inflight"]=="OBSERVED_CI_DISPOSABLE"
          assert r["production_worker_restart_inflight"]=="NOT_TESTED"
          assert r["production_incident_workflow"]=="NOT_TESTED"
          print("CI_TEMPORAL_AND_APP_WORKER_RESTART_INFLIGHT=PASS|signals=2|effects=0")
          PY
      - name: Upload disposable HITL outbox to Temporal qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops2-hitl-outbox-temporal-report
          path: |
            reports/hitl-outbox-temporal.json
            reports/hitl-temporal-restart-prepared.json
            reports/hitl-temporal-restart.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload runtime qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops2-runtime-e2e-report
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Show bounded service logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color --tail=160 aiops2-portal aiops2-worker aiops2-core aiops2-intelligence aiops2-test-llm || true
      - name: Tear down isolated test stack
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans || true

  release-kit:
    runs-on: ubuntu-latest
    needs:
      - quality-build-package
      - database-migrations
      - migration-runner-upgrade
      - mariadb-dr-rehearsal
      - runtime-e2e
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi==0.116.1" "pydantic==2.11.7" "requests==2.32.4" "httpx==0.28.1" "temporalio==1.17.0" "psycopg[binary]==3.2.9" "PyJWT[crypto]==2.10.1"
      - name: Re-run release-blocking unit and contract tests
        env:
          PYTHONPATH: app
          AIOPS_POLICY_STATE_DB: ${{ runner.temp }}/aiops-policy-release.sqlite3
        run: |
          python -m compileall -q app tests tools
          python -m unittest discover -s tests -p "test_policy_safety.py" -v
          python -m unittest discover -s tests -p "test_intelligence_contract.py" -v
          python -m unittest discover -s tests -p "test_hitl_workflow_contract.py" -v
          python -m unittest discover -s tests -p "test_hitl_identity.py" -v
          python -m unittest discover -s tests -p "test_ai_failure_injection.py" -v
          python -m unittest discover -s tests -p "test_portal_demo.py" -v
          python -m unittest discover -s tests -p "test_ai_eval_harness.py" -v
          python -m unittest discover -s tests -p "test_model_evaluation_api.py" -v
          python -m unittest discover -s tests -p "test_fake_provider_quality.py" -v
          python -m unittest discover -s tests -p "test_stage_persistence.py" -v
          python -m unittest discover -s tests -p "test_redact_logs.py" -v
          python -m unittest discover -s tests -p "test_shared_http.py" -v
          python -m unittest discover -s tests -p "test_internal_auth.py" -v
          python -m unittest discover -s tests -p "test_event_idempotency.py" -v
          python -m unittest discover -s tests -p "test_safety_invariants.py" -v
          python -m unittest discover -s tests -p "test_freshness.py" -v
          python -m unittest discover -s tests -p "test_evidence_contract.py" -v
          python -m unittest discover -s tests -p "test_evidence_identity.py" -v
          python -m unittest discover -s tests -p "test_evidence_ingestion.py" -v
          python -m unittest discover -s tests -p "test_worker_boot.py" -v
          bash tests/static-audit.sh
          bash tests/sql-audit.sh
          bash tests/migration-contract.sh
          bash tests/core-ledger-contract.sh
          bash tests/backup-contract.sh
          bash tests/lifecycle-safety-contract.sh
          bash tests/isolated-deploy-contract.sh
          python -m unittest discover -s tests -p "test_deployment_isolation.py" -v
          python -m unittest discover -s tests -p "test_docker_ownership.py" -v
          python -m unittest discover -s tests -p "test_stack_status.py" -v
          python -m unittest discover -s tests -p "test_package_tree.py" -v
          bash tests/temporal-contract.sh
      - name: Generate isolated packaging environment
        run: bash deploy/init-env.sh
      - name: Download runtime qualification report for cumulative kit
        uses: actions/download-artifact@v4
        with:
          name: aiops2-runtime-e2e-report
          path: reports
      - name: Assemble cumulative deployment kit only after all gates pass
        env:
          REQUIRE_RUNTIME_REPORT: "1"
        run: bash deploy/package.sh
      - name: Verify cumulative release content, checksums and CI evidence
        run: |
          shopt -s nullglob
          kits=(dist/*.zip)
          [[ "${#kits[@]}" == "1" ]] || { echo "FAIL|expected_one_cumulative_zip"; exit 1; }
          python3 tests/verify-package.py "${kits[0]}"
      - name: Verify extracted ZIP can repackage offline without inheriting CI status
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          originals=(dist/*.zip)
          [[ "${#originals[@]}" -eq 1 ]]
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          mkdir -p "$sandbox/extracted"
          unzip -q "${originals[0]}" -d "$sandbox/extracted"
          (
            cd "$sandbox/extracted"
            REQUIRE_RUNTIME_REPORT=0 bash deploy/package.sh
            repackaged=(dist/*.zip)
            [[ "${#repackaged[@]}" -eq 1 ]]
            verification="$(python3 tests/verify-package.py "${repackaged[0]}")"
            echo "$verification"
            grep -Fq 'qualification=UNQUALIFIED_SOURCE_ONLY' <<< "$verification"
          )
      - name: Upload qualified cumulative deployment kit and checksum
        uses: actions/upload-artifact@v4
        with:
          name: aiops2-core-deployment-kit
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
