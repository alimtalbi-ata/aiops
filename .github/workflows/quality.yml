name: AIOps quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  policy-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install policy test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi==0.116.1" "pydantic==2.11.7" "requests==2.32.4" "httpx==0.28.1"
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Policy safety unit tests
        run: python -m unittest discover -s tests -p "test_policy_safety.py" -v
      - name: Portal authorization unit tests
        run: PYTHONPATH=app python -m unittest discover -s tests -p "test_portal_auth.py" -v
      - name: Shared HTTP retry-safety tests
        run: PYTHONPATH=app python -m unittest discover -s tests -p "test_shared_http.py" -v
      - name: Idempotency receipt scope tests
        run: PYTHONPATH=app python -m unittest discover -s tests -p "test_idempotency_receipts.py" -v
      - name: Secret preflight unit tests
        run: bash tests/test_preflight_secrets.sh
      - name: Shell syntax checks
        run: bash -n deploy/install.sh deploy/preflight.sh deploy/init-env.sh deploy/check-secrets.sh deploy/ensure-portal-token.sh tests/qualification.sh tests/synthetic-e2e.sh tests/static-audit.sh deploy/qualify-update.sh
      - name: Static repository audit
        run: bash tests/static-audit.sh
      - name: Validate Compose configuration with generated secrets
        run: bash deploy/init-env.sh && docker compose --env-file .env config >/dev/null
