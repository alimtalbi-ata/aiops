name: Portal #385 NOC operator exact-head source gate
on:
  pull_request:
    branches:
      - integration/enterprise-slice-main-20261031-2230
    paths:
      - app/portal/main.py
      - app/portal/noc_operator_page.py
      - app/portal/noc_operator_client.js
      - tests/test_portal_noc_operator_385.py
      - .github/workflows/portal-385-noc-ux.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noc-operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install disposable portal imports
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt 'cryptography==46.0.4'
      - name: Compile portal and client
        run: |
          python -m py_compile app/portal/main.py app/portal/noc_operator_page.py tests/test_portal_noc_operator_385.py
          node --check app/portal/noc_operator_client.js
      - name: RG-UX-01/02/03 NOC source-only negative gates
        env:
          PYTHONPATH: app
          AIOPS_INTERNAL_TOKEN: disposable-ci-not-live
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_portal_noc_operator_385.py -v 2>&1 | tee /tmp/noc-ux-tests.log
          grep -E '^Ran 5 tests in ' /tmp/noc-ux-tests.log
          grep -x 'OK' /tmp/noc-ux-tests.log
          ! grep -E 'skipped=|FAILED|ERROR' /tmp/noc-ux-tests.log
