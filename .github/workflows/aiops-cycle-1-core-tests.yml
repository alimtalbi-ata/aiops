name: AIOps autonomous cycle 1 — core tests

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiops-cycle-1-core-tests
  cancel-in-progress: false

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi==0.116.1' 'requests==2.32.4' 'httpx==0.28.1'
      - name: Verify portal bootstrap and ACME simulation contracts
        run: |
          python -m unittest discover -s tests -p 'test_portal_bootstrap_read_model.py' -v
          python -m unittest discover -s tests -p 'test_portal_acme_impact_read_model.py' -v
          python -m unittest discover -s tests -p 'test_acme_impact_simulation_metadata.py' -v
          python -m unittest discover -s tests -p 'test_platform_registry_portal_route.py' -v
