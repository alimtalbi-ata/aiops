name: V3 kit CLI synthetic dry-run
on:
  push:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/kit/kit_cli.py'
      - 'v3-spike/kit/test_kit_cli.py'
      - '.github/workflows/v3-kit-cli-dry-run.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit-cli-dry-run:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact source SHA
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Execute sixteen synthetic CLI tests with strict JUnit
        env:
          GAMMA_IMAGE: 'registry.example.invalid/fixture@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          CORE_IMAGE: 'registry.example.invalid/fixture@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          DEMO_IMAGE: 'registry.example.invalid/fixture@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check 'unittest-xml-reporting==3.2.0' 'PyYAML==6.0.3'
          mkdir -p reports
          python3 -B - <<'PY'
          import importlib.util
          import pathlib
          import unittest
          import xmlrunner
          path = pathlib.Path("v3-spike/kit/test_kit_cli.py").resolve()
          spec = importlib.util.spec_from_file_location("test_kit_cli", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(module.KitCliTests)
          if suite.countTestCases() != 16:
              raise SystemExit("FAIL expected exactly sixteen CLI tests")
          result = xmlrunner.XMLTestRunner(output="reports", verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 13:
              raise SystemExit("FAIL CLI dry-run tests")
          print("PASS synthetic CLI dry-run 16/16")
          PY
      - name: Publish JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-kit-cli-junit
          path: reports/*.xml
          if-no-files-found: error
          retention-days: 14
      - name: UTC receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "synthetic=true runtime=NOT_RUN host_mutated=false"
