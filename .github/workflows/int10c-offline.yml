name: INT10C offline
on:
  push:
    branches: [integration/aiops2-int10-c-20261118]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app:tests
      C_CONTRACT_PATH: app/worker/int06a_contract.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r app/requirements.txt pytest
      - name: Exact SHA and three offline repetitions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p proof
          git rev-parse HEAD > proof/executed_sha
          python -VV > proof/python-version.txt
          python -m pip --version > proof/pip-version.txt
          python -m pip freeze --all > proof/dependencies.txt
          python -m pip check > proof/dependency-check.txt
          uname -sm > proof/platform.txt
          sha256sum app/requirements.txt .github/workflows/int10c-offline.yml > proof/source-inputs.sha256
          git ls-tree -r HEAD app/worker > proof/worker-tree.txt
          for n in 1 2 3; do
            python -m pytest -q tests/test_int10c_activity_body.py tests/test_int10c_packaging.py tests/test_int10c_lab_readiness.py tests/test_int10c_lab_lifecycle.py tests/test_int10c_process_policy.py tests/test_int10c_terminal_contract_boundary.py tests/test_int10c_fenced_terminal.py tests/test_int10c_recovery.py tests/test_int08c_arc08.py tests/test_int09c_recovery.py tests/test_int09c_terminal_recovery.py tests/test_int09c_historical_wire.py tests/test_int09c_causal.py tests/test_int09b_admission_nominal.py tests/test_int09b_preterminal.py tests/test_int09c_golden_final.py tests/test_int08c_offline.py tests/test_acme_runtime_context.py tests/test_acme_authority_readers.py tests/test_acme_authority_continuity.py tests/test_int07_offline_collector.py tests/test_int06a_contract.py tests/test_int06a_integrated_refusals.py tests/test_worker_acme_simulated_hitl.py tests/test_reuse466_predicates.py tests/test_reuse79_worker_bindings.py tests/test_worker_receipt_negative_matrix.py tests/test_worker_temporal_transition_receipts.py tests/test_worker_demo_postcheck_boundary.py tests/test_core_unqualified_resolve.py tests/test_worker_execution_start_boundary.py tests/test_worker_policy_gate_execution.py --junitxml=proof/run-$n.xml | tee proof/run-$n.txt
            python -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]); assert not r.findall('.//skipped')" proof/run-$n.xml
          done
          (cd proof && sha256sum executed_sha *.txt *.xml source-inputs.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int10c-offline-${{ github.sha }}
          path: proof/
