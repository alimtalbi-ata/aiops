name: Proactive observer qualification

on:
  push:
    branches:
      - feature/central-proactive-cron-v1

permissions:
  contents: read

concurrency:
  group: proactive-observer-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targeted-tests-and-int07-build:
    name: proactive-tests-and-int07-exact-sha-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 636205a7b24de08ff6c52e4b956a42904b58cee9
      PYTHONPATH: deploy
    steps:
      - name: Checkout trusted orchestrator candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          persist-credentials: false

      - name: Checkout frozen INT07 source
        uses: actions/checkout@v4
        with:
          ref: 636205a7b24de08ff6c52e4b956a42904b58cee9
          path: source
          persist-credentials: false

      - name: Verify exact source and clean checkout
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        working-directory: orchestrator
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile observer scripts
        working-directory: orchestrator
        run: python -m py_compile deploy/proactive_candidate.py deploy/proactive_watchdog.py deploy/proactive_build_handoff.py deploy/proactive_update_discovery.py scripts/verify_proactive_image_archive.py && bash -n deploy/install-proactive-observer.sh && bash -n deploy/rollback-proactive-observer.sh

      - name: Run candidate and update discovery tests explicitly
        working-directory: orchestrator
        run: |
          python -m pytest -q -ra tests/test_proactive_candidate.py tests/test_proactive_update_discovery.py tests/test_proactive_watchdog_handoff.py tests/test_proactive_rollback.py tests/test_proactive_installer.py tests/test_proactive_image_archive.py

      - name: Build frozen INT07 image on GitHub-hosted runner
        working-directory: source
        run: |
          bash "$GITHUB_WORKSPACE/orchestrator/scripts/proactive_portal_build.sh" "$SOURCE_SHA" | tee "$GITHUB_WORKSPACE/int07-build-receipt.json"

      - name: Export exact built image for independent QA
        run: |
          docker save "aiops2-portal-qualification:$SOURCE_SHA" -o "$GITHUB_WORKSPACE/int07-image.tar"

      - name: Verify receipt against exported Docker config and OCI index
        run: |
          docker_id="$(docker image inspect --platform linux/amd64 --format '{{.Id}}' "aiops2-portal-qualification:$SOURCE_SHA")"
          python3 "$GITHUB_WORKSPACE/orchestrator/scripts/verify_proactive_image_archive.py" "$GITHUB_WORKSPACE/int07-image.tar" "$GITHUB_WORKSPACE/int07-build-receipt.json" "$SOURCE_SHA" "aiops2-portal-qualification:$SOURCE_SHA" "$docker_id"
          sha256sum "$GITHUB_WORKSPACE/int07-image.tar" > "$GITHUB_WORKSPACE/int07-image.tar.sha256"

      - name: Require complete qualified package
        if: success()
        run: |
          test -s int07-build-receipt.json
          test -s int07-image.tar
          test -s int07-image.tar.sha256

      - name: Upload exact-SHA build package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: int07-exact-sha-build-package
          path: |
            int07-build-receipt.json
            int07-image.tar
            int07-image.tar.sha256
          if-no-files-found: error
          retention-days: 14
