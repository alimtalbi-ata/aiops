name: STAR simulated Policy command contract (offline)
on:
  pull_request:
    paths:
      - 'shared/simulation_policy_contract.py'
      - 'app/worker/main.py'
      - 'app/policy/main.py'
      - 'tests/test_simulation_policy_contract.py'
      - 'tests/test_simulation_policy_wiring.py'
      - '.github/workflows/star-simulation-policy-contract-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      AIOPS_STAR_NO_RUNTIME: '1'
      AIOPS_POLICY_EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline policy import dependencies
        run: python -m pip install 'fastapi==0.128.2' 'pydantic==2.13.5'
      - name: Compile policy mapping and worker source
        run: python -m py_compile shared/simulation_policy_contract.py app/worker/main.py app/policy/main.py
      - name: Qualify simulated vs LIVE policy decision without network
        run: |
          python -m unittest discover -s tests -p 'test_simulation_policy_contract.py' -v
          python -m unittest discover -s tests -p 'test_simulation_policy_wiring.py' -v
