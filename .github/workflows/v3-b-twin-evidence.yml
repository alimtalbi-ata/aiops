name: V3 B Twin Evidence Synthetic
on:
  push:
    branches:
      - 'v3-spike/b-attested-snapshot-20261121'
    paths:
      - 'v3-spike/contracts/twin_evidence_boundary.py'
      - 'v3-spike/contracts/test_twin_evidence_boundary.py'
      - 'v3-spike/contracts/decision_evidence_synthetic.py'
      - 'v3-spike/contracts/test_decision_evidence_synthetic.py'
      - 'v3-spike/contracts/test_decision_evidence_trust_mutations.py'
      - 'v3-spike/contracts/test_decision_evidence_sqlite_faults.py'
      - 'v3-spike/contracts/test_backend_attestation_boundary.py'
      - 'v3-spike/contracts/test_backend_binding_adversarial.py'
      - 'v3-spike/contracts/test_backend_atomic_consume.py'
      - '.github/workflows/v3-b-twin-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twin-evidence-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-source synthetic unittest and JUnit
        run: |
          python -m pip install --disable-pip-version-check unittest-xml-reporting==3.2.0
          cd v3-spike/contracts
          python -m xmlrunner discover -s . -p 'test_twin_evidence_boundary.py' -o ../../reports/twin-evidence
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-evidence-junit
          path: reports/twin-evidence/
          if-no-files-found: error

  decision-evidence-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run 24 adversarial DecisionEvidence cases and verify semantic JUnit
        run: |
          python -m pip install --disable-pip-version-check unittest-xml-reporting==3.2.0
          cd v3-spike/contracts
          python -m xmlrunner discover -s . -p 'test_decision_evidence_synthetic.py' -o ../../reports/decision-evidence
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('../../reports/decision-evidence').glob('*.xml'))
          assert files, 'Missing JUnit files'
          cases = [c for file in files for c in ET.parse(file).iter('testcase')]
          names = [c.attrib.get('name', '') for c in cases]
          import ast
          source = Path('test_decision_evidence_synthetic.py')
          tree = ast.parse(source.read_text(encoding='utf-8'))
          expected = {n.name for cls in tree.body if isinstance(cls, ast.ClassDef)
                      and cls.name == 'DecisionEvidenceTests'
                      for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and n.name.startswith('test_')}
          assert len(expected) == 24, f'Expected 24 source test methods, got {len(expected)}'
          assert len(cases) == 24, f'Expected 24 executed cases, got {len(cases)}'
          assert len(set(names)) == 24, 'Duplicate test identities'
          assert set(names) == expected, f'JUnit/source mismatch: missing={sorted(expected-set(names))}, extra={sorted(set(names)-expected)}'
          assert all(c.attrib.get('classname', '').endswith('DecisionEvidenceTests') for c in cases), 'Unexpected JUnit test class'
          assert not any(c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None for c in cases), 'JUnit has failures/errors/skips'
          print(f'PASS semantic DecisionEvidence JUnit: {len(cases)} unique testcases')
          PY
      - name: Upload DecisionEvidence JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-evidence-junit
          path: reports/decision-evidence/
          if-no-files-found: error

  decision-evidence-trust-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute 16 independent adversarial trust mutations
        run: |
          python -m pip install --disable-pip-version-check unittest-xml-reporting==3.2.0
          cd v3-spike/contracts
          python -m xmlrunner discover -s . -p 'test_decision_evidence_trust_mutations.py' -o ../../reports/trust-mutations
          python - <<'PY'
          import ast
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tree = ast.parse(Path('test_decision_evidence_trust_mutations.py').read_text())
          expected = {m.name for cls in tree.body if isinstance(cls, ast.ClassDef)
                      and cls.name == 'DecisionEvidenceTrustMutations'
                      for m in cls.body if isinstance(m, ast.FunctionDef) and m.name.startswith('test_')}
          files = list(Path('../../reports/trust-mutations').glob('*.xml'))
          assert files, 'Missing trust-mutation JUnit'
          cases = [case for path in files for case in ET.parse(path).iter('testcase')]
          names = [case.get('name') for case in cases]
          assert len(expected) == len(cases) == len(set(names)) == 18
          assert set(names) == expected
          assert all(case.get('classname', '').endswith('DecisionEvidenceTrustMutations') for case in cases)
          assert all(not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for case in cases)
          print('PASS trust mutation semantic JUnit 16/16')
          PY
      - name: Upload trust mutation JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-evidence-trust-mutations-junit
          path: reports/trust-mutations/
          if-no-files-found: error

