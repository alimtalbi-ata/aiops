name: STAR screenshot integrity collector

on:
  pull_request:
    paths:
      - 'demo/star_capture_evidence.py'
      - 'demo/star_png_integrity.py'
      - 'demo/star_snapshot_choreography.py'
      - 'tests/test_star_capture_evidence.py'
      - 'tests/test_star_png_integrity.py'
      - 'demo/star_portal_storyboard.py'
      - 'tests/test_star_portal_storyboard.py'
      - 'demo/star_portal_transport.py'
      - 'tests/test_star_portal_transport.py'
      - 'demo/star_portal_html.py'
      - 'tests/test_star_portal_html.py'
      - 'demo/star_portal_export.py'
      - 'tests/test_star_portal_export.py'
      - 'demo/star_scene_scripts.py'
      - 'tests/test_star_scene_scripts.py'
      - 'demo/star_navigable_preview.py'
      - 'tests/test_star_navigable_preview.py'
      - 'demo/star_navigable_export.py'
      - 'tests/test_star_navigable_export.py'
      - 'demo/star_legacy_playwright_audit.py'
      - 'tests/test_star_legacy_playwright_audit.py'
      - 'demo/star_legacy_png_verify.py'
      - 'tests/test_star_legacy_png_verify.py'
      - 'demo/star_legacy_capture_gap_plan.py'
      - 'tests/test_star_legacy_capture_gap_plan.py'
      - 'demo/star_capture_identity_plan.py'
      - 'tests/test_star_capture_identity_plan.py'
      - 'tests/test_star_snapshot_choreography.py'
      - '.github/workflows/star-capture-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-capture-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modules
        run: python -m py_compile demo/star_png_integrity.py demo/star_capture_evidence.py demo/star_snapshot_choreography.py demo/star_portal_storyboard.py demo/star_portal_transport.py demo/star_portal_html.py demo/star_portal_export.py demo/star_scene_scripts.py demo/star_navigable_preview.py demo/star_navigable_export.py demo/star_legacy_playwright_audit.py demo/star_legacy_png_verify.py demo/star_legacy_capture_gap_plan.py demo/star_capture_identity_plan.py
      - name: Verify offline integrity and storyboard contracts
        run: python -m unittest discover -s tests -p 'test_star_snapshot_choreography.py' -v && python -m unittest discover -s tests -p 'test_star_capture_evidence.py' -v && python -m unittest discover -s tests -p 'test_star_png_integrity.py' -v && python -m unittest discover -s tests -p 'test_star_portal_storyboard.py' -v && python -m unittest discover -s tests -p 'test_star_portal_transport.py' -v && python -m unittest discover -s tests -p 'test_star_portal_html.py' -v && python -m unittest discover -s tests -p 'test_star_portal_export.py' -v && python -m unittest discover -s tests -p 'test_star_scene_scripts.py' -v && python -m unittest discover -s tests -p 'test_star_navigable_preview.py' -v && python -m unittest discover -s tests -p 'test_star_navigable_export.py' -v && python -m unittest discover -s tests -p 'test_star_legacy_playwright_audit.py' -v && python -m unittest discover -s tests -p 'test_star_legacy_png_verify.py' -v && python -m unittest discover -s tests -p 'test_star_legacy_capture_gap_plan.py' -v && python -m unittest discover -s tests -p 'test_star_capture_identity_plan.py' -v
