name: Portal HTTP security candidate exact-head tests

on:
  pull_request:
    paths:
      - "tests/test_portal_error_response_security_20261110.py"
      - "tests/test_portal_method_error_security_20261110.py"
      - "tests/test_portal_navigation_supersession.mjs"
      - ".github/workflows/portal-http-security-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-http-security-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi==0.116.1" "pydantic==2.11.7" "httpx==0.28.1" "requests==2.32.4" "pytest==8.4.2"
      - name: Check isolated Python tests compile
        run: python -m py_compile tests/test_portal_error_response_security_20261110.py tests/test_portal_method_error_security_20261110.py
      - name: Execute 404 and 405 security contract tests
        env:
          AIOPS_INTERNAL_TOKEN: ci-ephemeral-synthetic-portal-http-security-only
        run: python -m pytest -q tests/test_portal_error_response_security_20261110.py tests/test_portal_method_error_security_20261110.py
      - name: Execute navigation supersession regression
        run: node --test tests/test_portal_navigation_supersession.mjs
