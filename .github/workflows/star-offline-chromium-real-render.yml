name: STAR Chromium actual offline fixture render
on:
  pull_request:
    paths:
      - 'demo/star_offline_chromium_fixture.py'
      - 'demo/star_png_integrity.py'
      - 'tests/test_star_offline_chromium_render.py'
      - 'tests/test_star_offline_chromium_nine_scenes.py'
      - 'tests/test_noc_unified_chromium.py'
      - 'demo/noc_browser_evidence_gate.py'
      - 'tests/test_noc_browser_evidence_gate.py'
      - 'demo/noc_evidence_index.py'
      - 'tests/test_noc_evidence_index.py'
      - 'demo/noc_evidence_center.py'
      - 'tests/test_noc_evidence_center.py'
      - 'demo/noc_unified_offline.py'
      - 'demo/noc_wallboard.py'
      - 'demo/noc_checkmk_offline_wallboard.py'
      - '.github/workflows/star-offline-chromium-real-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-local-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Playwright Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Execute Chromium render on local fixture only
        env:
          AIOPS_NOC_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/noc-browser-evidence
        run: |
          python -m unittest discover -s tests -p 'test_star_offline_chromium_render.py' -v
          python -m unittest discover -s tests -p 'test_star_offline_chromium_nine_scenes.py' -v
          python -m unittest discover -s tests -p 'test_noc_unified_chromium.py' -v
          python -m unittest discover -s tests -p 'test_noc_browser_evidence_gate.py' -v
          python -m unittest discover -s tests -p 'test_noc_evidence_index.py' -v
          python -m unittest discover -s tests -p 'test_noc_evidence_center.py' -v
          python -c 'import os,json; from pathlib import Path; from demo.noc_evidence_center import render_noc_evidence_center; p=Path(os.environ["AIOPS_NOC_BROWSER_EVIDENCE_DIR"]); (p/"evidence-center.html").write_text(render_noc_evidence_center(json.loads((p/"evidence-index.json").read_text(encoding="utf-8"))),encoding="utf-8")'
          python -c 'import os,json; from pathlib import Path; from demo.noc_evidence_index import build_noc_evidence_index; p=Path(os.environ["AIOPS_NOC_BROWSER_EVIDENCE_DIR"]); (p/"evidence-index.json").write_text(json.dumps(build_noc_evidence_index(p),indent=2)+"\\n",encoding="utf-8")'
          python -c 'import os; from pathlib import Path; from demo.noc_browser_evidence_gate import verify_noc_offline_browser_evidence; print(verify_noc_offline_browser_evidence(Path(os.environ["AIOPS_NOC_BROWSER_EVIDENCE_DIR"])))'
      - name: Upload explicitly offline NOC browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noc-offline-browser-evidence
          path: ${{ runner.temp }}/noc-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
