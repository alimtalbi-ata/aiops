name: AIOps isolated runtime qualification

on:
  pull_request:
    paths:
      - "app/**"
      - "compose.yml"
      - "config/**"
      - "db/**"
      - "deploy/**"
      - "tests/**"
      - ".github/workflows/runtime-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show runner disk capacity
        run: df -h
      - name: Generate disposable test credentials
        run: bash deploy/init-env.sh
      - name: Build application images and pull pinned services
        run: docker compose --env-file .env build --pull
      - name: Start isolated stack
        run: docker compose --env-file .env up -d
      - name: Qualify container health and exposed endpoints
        run: bash tests/qualification.sh
      - name: Run deterministic synthetic end-to-end
        run: bash tests/synthetic-e2e.sh
      - name: Collect redacted service logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color --tail=100
      - name: Stop and remove isolated stack
        if: always()
        run: docker compose --env-file .env down --volumes --remove-orphans
