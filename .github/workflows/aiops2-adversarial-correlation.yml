name: AIOps2 adversarial correlation contracts (offline)

on:
  pull_request:
    paths:
      - 'tests/test_aiops2_correlation_adversarial_contract.py'
      - 'scripts/aiops2_event_correlation.py'
      - '.github/workflows/aiops2-adversarial-correlation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.2'
      - name: Adversarial multi-source tenant provenance freshness and UNKNOWN contracts
        run: python -m pytest -q tests/test_aiops2_correlation_adversarial_contract.py
