name: STAR event-source byte binding (offline)

on:
  pull_request:
    paths:
      - 'demo/star_event_source_binding.py'
      - 'demo/star_event_capture_alignment.py'
      - 'demo/star_browser_manifest_gate.py'
      - 'tests/test_star_event_source_binding.py'
      - '.github/workflows/star-event-source-binding-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-byte-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AIOPS_STAR_NO_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile offline source integrity verifier
        run: python -m py_compile demo/star_event_source_binding.py
      - name: Run synthetic event source binding contract
        run: python -m unittest discover -s tests -p 'test_star_event_source_binding.py' -v
