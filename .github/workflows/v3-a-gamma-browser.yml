name: V3 A GAMMA isolated Chromium
on:
  push:
    branches: [v3-spike/a-gamma-snapshot-ci-20261121]
    paths:
      - 'v3-spike/ux/**'
      - '.github/workflows/v3-a-gamma-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gamma-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          python3 --version
      - name: Install pinned browser and JUnit reporter
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0' 'unittest-xml-reporting==3.2.0'
          python3 -m playwright install --with-deps chromium
      - name: Run strict five Chromium acceptance tests
        run: |
          mkdir -p reports
          python3 -B - <<'PY'
          import importlib.util, pathlib, sys, unittest, xmlrunner
          p = pathlib.Path("v3-spike/ux/test_gamma.py").resolve()
          spec = importlib.util.spec_from_file_location("v3_gamma", p)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(module.GammaAcceptance)
          count = suite.countTestCases()
          print(f"collected={count} expected=5", flush=True)
          if count != 5:
              raise SystemExit("FAIL: test collection mismatch")
          result = xmlrunner.XMLTestRunner(output="reports", verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 5:
              raise SystemExit("FAIL: browser acceptance")
          print("PASS: 5/5 Chromium synthetic acceptance", flush=True)
          PY
      - name: Run offline Chromium thirteen-case suite (no HTTP, exact HTML)
        run: |
          mkdir -p reports/offline
          python3 -B - <<'PY'
          import importlib.util, pathlib, sys, unittest, xmlrunner
          p = pathlib.Path("v3-spike/ux/test_gamma_offline.py").resolve()
          spec = importlib.util.spec_from_file_location("gamma_offline", p)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(module.GammaOffline)
          if suite.countTestCases() != 13:
              raise SystemExit("FAIL: offline collection mismatch")
          result = xmlrunner.XMLTestRunner(output="reports/offline", verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 13:
              raise SystemExit("FAIL: offline Chromium acceptance")
          print("PASS: offline 13/13", flush=True)
          PY
      - name: UTC receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB"
          echo "runtime=NOT_RUN production=DENIED"
      - name: Validate JUnit test counts and zero failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import ast

          def expected_test_names(source, class_name):
              tree = ast.parse(Path(source).read_text(encoding="utf-8"))
              matches = [node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == class_name]
              if len(matches) != 1:
                  raise SystemExit(f"FAIL: missing/duplicate test class {class_name}")
              names = [node.name for node in matches[0].body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")]
              if len(names) != len(set(names)):
                  raise SystemExit("FAIL: duplicate source test identities")
              return set(names)

          for folder, expected, source, class_name in ((Path("reports"), 5, "v3-spike/ux/test_gamma.py", "GammaAcceptance"), (Path("reports/offline"), 13, "v3-spike/ux/test_gamma_offline.py", "GammaOffline")):
              expected_names = expected_test_names(source, class_name)
              if len(expected_names) != expected:
                  raise SystemExit(f"FAIL: source identities {len(expected_names)} != {expected}")
              observed_names = []
              files = sorted(folder.glob("*.xml"))
              if not files:
                  raise SystemExit(f"FAIL: missing JUnit XML in {folder}")
              total = 0
              for file in files:
                  root = ET.parse(file).getroot()
                  suites = [root] if root.tag == "testsuite" else list(root) if root.tag == "testsuites" else []
                  if not suites or any(suite.tag != "testsuite" for suite in suites):
                      raise SystemExit(f"FAIL: malformed JUnit suite in {file}")
                  if root.tag == "testsuites":
                      for key in ("failures", "errors", "skipped"):
                          if int(root.attrib.get(key, "0")) != 0:
                              raise SystemExit(f"FAIL: JUnit root {key} counter in {file}")
                      if "tests" in root.attrib and int(root.attrib["tests"]) != sum(len(s.findall("testcase")) for s in suites):
                          raise SystemExit(f"FAIL: JUnit root test count mismatch in {file}")
                  for suite in suites:
                      cases = suite.findall("testcase")
                      declared = int(suite.attrib.get("tests", "-1"))
                      if declared != len(cases):
                          raise SystemExit(f"FAIL: JUnit case count mismatch in {file}")
                      if any(suite.findall(tag) for tag in ("failure", "error", "skipped")):
                          raise SystemExit(f"FAIL: invalid JUnit suite in {file}")
                      if any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped")):
                          raise SystemExit(f"FAIL: failing/skipped JUnit case in {file}")
                      if any(int(suite.attrib.get(k, "0")) != 0 for k in ("failures", "errors", "skipped")):
                          raise SystemExit(f"FAIL: nonzero JUnit failure counters in {file}")
                      for case in cases:
                          name = case.attrib.get("name", "")
                          classname = case.attrib.get("classname", "")
                          if not name or not classname.endswith("." + class_name) and classname != class_name:
                              raise SystemExit(f"FAIL: invalid JUnit testcase identity {name}/{classname}")
                          observed_names.append(name)
                      total += len(cases)
              if len(observed_names) != len(set(observed_names)) or set(observed_names) != expected_names:
                  raise SystemExit(f"FAIL: duplicated/substituted JUnit test identities in {folder}")
              if total != expected:
                  raise SystemExit(f"FAIL: JUnit {folder} counted={total}, expected={expected}")
              print(f"PASS: JUnit {folder} {total}/{expected} no failures/errors/skips")
          PY
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gamma-chromium-junit
          path: reports/
          if-no-files-found: error
