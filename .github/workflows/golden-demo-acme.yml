name: AIOPS2 Golden Demo ACME

# Qualification préalable requise :
# - dépendances Python complètes
# - absence de connexion aux services de production
# - fixtures et services de test isolés
#
# Exécution sur PR de la golden demo et déclenchement manuel.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'deploy/debian-acme-sim-e2e.py'
      - 'scripts/acme_demo_readiness.py'
      - 'tests/test_acme_demo_readiness.py'
      - 'tests/test_acme_sandbox_services.py'
      - 'tests/test_policy_acme_sandbox.py'
      - 'tests/test_worker_acme_simulated_hitl.py'
      - 'tests/test_debian_portal_ux_contracts.py'
      - '.github/workflows/golden-demo-acme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-demo-contracts:
    name: ACME functional contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check             "pytest>=8,<9"             "fastapi==0.116.1"             "pydantic==2.11.7"             "httpx==0.28.1"             "requests==2.32.4"             "psycopg[binary]==3.2.9"

      - name: Compile application
        run: python -m compileall -q app

      - name: ACME functional contracts
        env:
          PYTHONPATH: app
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q --tb=short tests/test_acme_sandbox_services.py tests/test_policy_acme_sandbox.py tests/test_worker_acme_simulated_hitl.py tests/test_debian_portal_ux_contracts.py
          # Keep legacy unittest modules isolated from pytest's global module cache.
          # Both import shared.* and may encounter a conflicting 'shared' package
          # when collected together in one pytest process.
          python -m unittest discover -s tests -p 'test_intelligence_contract.py' -v
          python -m unittest discover -s tests -p 'test_evidence_contract.py' -v

      - name: Golden demo readiness safety contracts
        run: python -m unittest discover -s tests -p 'test_acme_demo_readiness.py' -v
