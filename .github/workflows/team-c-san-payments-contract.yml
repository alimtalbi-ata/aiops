name: TEAM C SAN to Payments contract (offline)
on:
  pull_request:
    paths:
      - 'docs/contracts/team-c-san-payments-run-journey.schema.json'
      - 'docs/demo/TEAM-C-SAN-PAYMENTS-E2E.md'
      - 'tests/test_team_c_san_payments_contract.py'
      - 'tests/fixtures/team_c/**'
      - '.github/workflows/team-c-san-payments-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile contract tests
        run: python -m py_compile tests/test_team_c_san_payments_contract.py
      - name: Run positive and negative contract tests
        run: python -m unittest tests.test_team_c_san_payments_contract -v
