name: ACME sandbox simulated approval safety

on:
  pull_request:
    paths:
      - 'app/simulator/**'
      - 'app/twin/**'
      - 'tests/test_acme_sandbox_services.py'
      - '.github/workflows/acme-sandbox-simulated.yml'
  push:
    branches:
      - 'feat/acme-twin-simulated-approval-*'
    paths:
      - 'app/simulator/**'
      - 'app/twin/**'
      - 'tests/test_acme_sandbox_services.py'
      - '.github/workflows/acme-sandbox-simulated.yml'

permissions:
  contents: read

jobs:
  sandbox-no-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source HEAD (never synthetic PR merge)
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "ACME_EXACT_HEAD=$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned disposable dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi==0.116.1' 'pydantic==2.11.7' 'requests==2.32.4' 'pytest==8.4.2'
      - name: Compile owned sandbox modules
        run: python -m py_compile app/simulator/acme_sandbox.py app/twin/acme_sandbox.py app/simulator/main.py app/twin/main.py
      - name: ACME negative and structural simulation checks (no host/GLPI)
        run: |
          set -euo pipefail
          PYTHONPATH=app:. python -m pytest -q tests/test_acme_sandbox_services.py | tee /tmp/acme-sandbox-tests.log
          grep -E '^120 passed in ' /tmp/acme-sandbox-tests.log
          ! grep -E 'skipped|xfailed|xpassed' /tmp/acme-sandbox-tests.log
