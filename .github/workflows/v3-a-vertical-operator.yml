name: V3 A GAMMA vertical operator Chromium
on:
  push:
    branches: [v3-spike/a-gamma-snapshot-ci-20261121]
    paths:
      - 'v3-spike/ux/vertical_operator.html'
      - 'v3-spike/ux/test_vertical_operator.py'
      - '.github/workflows/v3-a-vertical-operator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vertical-operator-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and environment
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 --version
          date -u +%FT%TZ
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB"
      - name: Install pinned Playwright and JUnit reporter
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0' 'unittest-xml-reporting==3.2.0'
          python3 -m playwright install --with-deps chromium
      - name: Run eleven synthetic Chromium vertical tests
        run: |
          mkdir -p reports/vertical
          python3 -B - <<'PY'
          import importlib.util, pathlib, sys, unittest, xmlrunner
          p=pathlib.Path("v3-spike/ux/test_vertical_operator.py").resolve()
          spec=importlib.util.spec_from_file_location("gamma_vertical",p)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          suite=unittest.defaultTestLoader.loadTestsFromTestCase(module.VerticalOperator)
          if suite.countTestCases()!=11:
              raise SystemExit("FAIL: expected eleven vertical tests")
          result=xmlrunner.XMLTestRunner(output="reports/vertical",verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun!=11:
              raise SystemExit("FAIL: vertical Chromium")
          print("PASS: vertical Chromium 11/11 synthetic",flush=True)
          PY
      - name: Validate JUnit exact eleven and no failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path("reports/vertical").glob("*.xml"))
          if not files: raise SystemExit("FAIL: JUnit missing")
          import ast
          source=Path("v3-spike/ux/test_vertical_operator.py")
          tree=ast.parse(source.read_text(encoding="utf-8"))
          classes=[node for node in tree.body if isinstance(node,ast.ClassDef) and node.name=="VerticalOperator"]
          if len(classes)!=1: raise SystemExit("FAIL: missing or duplicate VerticalOperator class")
          expected={"gamma_vertical.VerticalOperator."+node.name for node in classes[0].body if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name.startswith("test_")}
          if len(expected)!=11: raise SystemExit("FAIL: expected eleven distinct source test identities")
          actual=[]
          total=0
          for file in files:
              root=ET.parse(file).getroot()
              suites=[root] if root.tag=="testsuite" else list(root) if root.tag=="testsuites" else []
              if not suites: raise SystemExit("FAIL: malformed JUnit")
              for suite in suites:
                  cases=suite.findall("testcase")
                  if int(suite.attrib.get("tests","-1"))!=len(cases): raise SystemExit("FAIL: JUnit count")
                  if any(int(suite.attrib.get(k,"0")) for k in ("failures","errors","skipped")): raise SystemExit("FAIL: JUnit failures")
                  if any(c.find(tag) is not None for c in cases for tag in ("failure","error","skipped")): raise SystemExit("FAIL: JUnit case failure")
                  for case in cases:
                      classname=case.attrib.get("classname","")
                      name=case.attrib.get("name","")
                      if not classname or not name: raise SystemExit("FAIL: JUnit testcase missing identity")
                      actual.append(classname+"."+name)
                  total+=len(cases)
          if total!=11: raise SystemExit("FAIL: JUnit expected eleven")
          if len(set(actual))!=len(actual): raise SystemExit("FAIL: duplicate JUnit testcase")
          if set(actual)!=expected: raise SystemExit("FAIL: substituted or missing JUnit testcase identities")
          print("PASS: vertical JUnit 11/11")
          PY
      - name: UTC receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID job=$GITHUB_JOB production=DENIED runtime=NOT_RUN"
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gamma-vertical-chromium-junit
          path: reports/vertical/
          if-no-files-found: error
