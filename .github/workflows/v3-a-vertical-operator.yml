name: V3 A GAMMA vertical operator Chromium
on:
  push:
    branches: [v3-spike/a-gamma-snapshot-ci-20261121]
    paths:
      - 'v3-spike/ux/vertical_operator.html'
      - 'v3-spike/ux/test_vertical_operator.py'
      - '.github/workflows/v3-a-vertical-operator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vertical-operator-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA and environment
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 --version
          date -u +%FT%TZ
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB"
      - name: Install pinned Playwright and JUnit reporter
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0' 'unittest-xml-reporting==3.2.0'
          python3 -m playwright install --with-deps chromium
      - name: Run sixteen synthetic Chromium vertical tests
        run: |
          mkdir -p reports/vertical
          python3 -B - <<'PY'
          import importlib.util, pathlib, sys, unittest, xmlrunner
          p=pathlib.Path("v3-spike/ux/test_vertical_operator.py").resolve()
          spec=importlib.util.spec_from_file_location("gamma_vertical",p)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          suite=unittest.defaultTestLoader.loadTestsFromTestCase(module.VerticalOperator)
          if suite.countTestCases()!=16:
              raise SystemExit("FAIL: expected sixteen vertical tests")
          result=xmlrunner.XMLTestRunner(output="reports/vertical",verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun!=16:
              raise SystemExit("FAIL: vertical Chromium")
          print("PASS: vertical Chromium 16/16 synthetic",flush=True)
          PY
      - name: Validate JUnit exact sixteen and no failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path("reports/vertical").glob("*.xml"))
          if not files: raise SystemExit("FAIL: JUnit missing")
          import ast
          source=Path("v3-spike/ux/test_vertical_operator.py")
          tree=ast.parse(source.read_text(encoding="utf-8"))
          classes=[node for node in tree.body if isinstance(node,ast.ClassDef) and node.name=="VerticalOperator"]
          if len(classes)!=1: raise SystemExit("FAIL: missing or duplicate VerticalOperator class")
          expected={"gamma_vertical.VerticalOperator."+node.name for node in classes[0].body if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name.startswith("test_")}
          if len(expected)!=16: raise SystemExit("FAIL: expected sixteen distinct source test identities")
          actual=[]
          total=0
          for file in files:
              root=ET.parse(file).getroot()
              suites=[root] if root.tag=="testsuite" else list(root) if root.tag=="testsuites" else []
              if not suites: raise SystemExit("FAIL: malformed JUnit")
              for suite in suites:
                  cases=suite.findall("testcase")
                  if int(suite.attrib.get("tests","-1"))!=len(cases): raise SystemExit("FAIL: JUnit count")
                  if any(int(suite.attrib.get(k,"0")) for k in ("failures","errors","skipped")): raise SystemExit("FAIL: JUnit failures")
                  if any(c.find(tag) is not None for c in cases for tag in ("failure","error","skipped")): raise SystemExit("FAIL: JUnit case failure")
                  for case in cases:
                      classname=case.attrib.get("classname","")
                      name=case.attrib.get("name","")
                      if not classname or not name: raise SystemExit("FAIL: JUnit testcase missing identity")
                      actual.append(classname+"."+name)
                  total+=len(cases)
          if total!=16: raise SystemExit("FAIL: JUnit expected sixteen")
          if len(set(actual))!=len(actual): raise SystemExit("FAIL: duplicate JUnit testcase")
          if set(actual)!=expected: raise SystemExit("FAIL: substituted or missing JUnit testcase identities")
          print("PASS: vertical JUnit 16/16")
          PY
      - name: Verify five Chromium screenshots and emit SHA256 manifest
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct, zlib
          from pathlib import Path
          def verify_png(data, path):
              if len(data) < 45 or data[:8] != bytes.fromhex("89504e470d0a1a0a"):
                  raise SystemExit(f"FAIL: invalid PNG signature {path}")
              pos, width, height, idat, ended = 8, None, None, False, False
              while pos < len(data):
                  if pos + 12 > len(data):
                      raise SystemExit(f"FAIL: truncated PNG chunk {path}")
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  end = pos + 12 + length
                  if end > len(data):
                      raise SystemExit(f"FAIL: truncated PNG data {path}")
                  kind = data[pos+4:pos+8]
                  chunk = data[pos+8:pos+8+length]
                  crc = struct.unpack(">I", data[pos+8+length:end])[0]
                  if zlib.crc32(kind + chunk) & 0xffffffff != crc:
                      raise SystemExit(f"FAIL: PNG CRC mismatch {path}")
                  if pos == 8:
                      if kind != b"IHDR" or length != 13:
                          raise SystemExit(f"FAIL: PNG IHDR missing {path}")
                      width, height = struct.unpack(">II", chunk[:8])
                  if kind == b"IDAT":
                      idat = True
                  if kind == b"IEND":
                      if length or end != len(data) or not idat:
                          raise SystemExit(f"FAIL: PNG IEND/IDAT invalid {path}")
                      ended = True
                      break
                  pos = end
              if not ended or not width or not height:
                  raise SystemExit(f"FAIL: incomplete PNG {path}")
              return width, height
          root = Path("reports/vertical")
          names = ["R1-deny-1280", "R2-simulate-only-1280",
                   "viewport-320", "viewport-1280", "viewport-1920"]
          output = {"commit_sha": os.environ["GITHUB_SHA"],
                    "run_id": os.environ["GITHUB_RUN_ID"],
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "screenshots": {}}
          for name in names:
              path = root / "screenshots" / (name + ".png")
              if not path.is_file():
                  raise SystemExit(f"FAIL: missing screenshot {path}")
              data = path.read_bytes()
              width, height = verify_png(data, path)
              expected_width = 320 if name == "viewport-320" else 1920 if name == "viewport-1920" else 1280
              if width != expected_width or height < 1:
                  raise SystemExit(f"FAIL: screenshot dimensions {path}: {width}x{height}")
              output["screenshots"][name] = {
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "bytes": len(data), "width": width, "height": height}
          manifest = root / "screenshot-manifest.json"
          manifest.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PASS: five source-exact Chromium PNG screenshots verified")
          PY
      - name: UTC receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID job=$GITHUB_JOB production=DENIED runtime=NOT_RUN"
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gamma-vertical-chromium-junit
          path: reports/vertical/
          if-no-files-found: error
