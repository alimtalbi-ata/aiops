name: V3 native GLPI boot lab
on:
  pull_request:
    branches: [v3-spike/central-integration]
    paths: ['v3-spike/kit/glpi-native*', '.github/workflows/v3-native-glpi.yml']
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GLPI_LAB_IMAGE: glpi/glpi:12.0.2
      GLPI_LAB_PORT: "18080"
      COMPOSE_PROJECT_NAME: v3-glpi-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Boot fresh GLPI
        shell: bash
        run: |
          set -euo pipefail
          export GLPI_LAB_DB_PASSWORD="$(openssl rand -hex 24)"
          export GLPI_LAB_ROOT_PASSWORD="$(openssl rand -hex 24)"
          compose() { docker compose -f v3-spike/kit/glpi-native.compose.yml "$@"; }
          trap 'compose down -v --remove-orphans' EXIT
          compose config --quiet
          compose pull
          compose up -d
          for i in $(seq 1 120); do
            if curl -fsSL --max-time 5 "http://127.0.0.1:$GLPI_LAB_PORT/" -o /tmp/glpi-lab.html && grep -qi GLPI /tmp/glpi-lab.html; then
              echo "Native GLPI HTTP page available; installation and REST not yet qualified"
              exit 0
            fi
            sleep 3
          done
          compose ps
          exit 1
