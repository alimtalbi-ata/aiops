name: V3 selective convergence - offline Twin and Run Journey
on:
  pull_request:
    paths:
      - 'app/portal/acme_*.py'
      - 'app/portal/main.py'
      - 'tests/test_acme_v3_cockpit_adapter.py'
      - 'docs/contracts/team-c-san-payments-run-journey.schema.json'
      - 'tests/fixtures/team_c/run-journey.valid.json'
      - 'tests/test_team_c_san_payments_contract.py'
      - 'tests/test_acme_signal_context.py'
      - 'tests/test_acme_twin_consumer.py'
      - 'tests/test_acme_twin_provenance.py'
      - '.github/workflows/v3-selective-run-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned isolated API test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi==0.116.1' 'pydantic==2.11.7' 'httpx==0.28.1' 'pytest==8.4.2'
      - name: Compile imported read-only modules and tests
        run: |
          python -m py_compile app/portal/acme_run_journey_projection.py app/portal/acme_signal_context.py app/portal/acme_twin_provenance.py app/portal/acme_twin_consumer.py app/portal/acme_lifecycle_read_model.py app/portal/acme_itil_readiness.py app/portal/acme_evidence_collection_plan.py app/portal/acme_analyst_critic_review.py app/portal/acme_workbench_presentation.py app/portal/acme_incident_cockpit.py app/portal/acme_incident_cockpit_html.py app/portal/acme_v3_cockpit_adapter.py app/portal/main.py
          python -m py_compile tests/test_team_c_san_payments_contract.py tests/test_acme_signal_context.py tests/test_acme_twin_consumer.py tests/test_acme_twin_provenance.py tests/test_acme_v3_cockpit_adapter.py
      - name: Offline contract, provenance, signal, Twin and route integration tests
        env:
          PYTHONPATH: app
          AIOPS_INTERNAL_TOKEN: ci-synthetic-internal-token-not-for-runtime
        run: |
          python -m unittest discover -s tests -p 'test_team_c_san_payments_contract.py' -v
          python -m unittest discover -s tests -p 'test_acme_signal_context.py' -v
          python -m unittest discover -s tests -p 'test_acme_twin_consumer.py' -v
          python -m unittest discover -s tests -p 'test_acme_twin_provenance.py' -v
          python -m unittest discover -s tests -p 'test_acme_v3_cockpit_adapter.py' -v
