name: V3 selective convergence - offline Twin and Run Journey
on:
  pull_request:
    paths:
      - 'app/portal/acme_*.py'
      - 'docs/contracts/team-c-san-payments-run-journey.schema.json'
      - 'tests/fixtures/team_c/run-journey.valid.json'
      - 'tests/test_team_c_san_payments_contract.py'
      - 'tests/test_acme_signal_context.py'
      - 'tests/test_acme_twin_consumer.py'
      - 'tests/test_acme_twin_provenance.py'
      - '.github/workflows/v3-selective-run-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile imported read-only modules and tests
        run: |
          python -m py_compile app/portal/acme_run_journey_projection.py app/portal/acme_signal_context.py app/portal/acme_twin_provenance.py app/portal/acme_twin_consumer.py app/portal/acme_lifecycle_read_model.py app/portal/acme_itil_readiness.py app/portal/acme_evidence_collection_plan.py app/portal/acme_analyst_critic_review.py app/portal/acme_workbench_presentation.py app/portal/acme_incident_cockpit.py app/portal/acme_incident_cockpit_html.py
          python -m py_compile tests/test_team_c_san_payments_contract.py tests/test_acme_signal_context.py tests/test_acme_twin_consumer.py tests/test_acme_twin_provenance.py
      - name: Offline contract, provenance, signal and Twin consumer tests
        run: |
          python -m unittest discover -s tests -p 'test_team_c_san_payments_contract.py' -v
          python -m unittest discover -s tests -p 'test_acme_signal_context.py' -v
          python -m unittest discover -s tests -p 'test_acme_twin_consumer.py' -v
          python -m unittest discover -s tests -p 'test_acme_twin_provenance.py' -v
