name: Portal UI consolidation contracts

on:
  pull_request:
    branches:
      - deploy/aiops2-stable
    paths:
      - "app/portal/components/**"
      - "app/portal/portal_bootstrap_client.js"
      - "tests/test_portal_bootstrap_client.mjs"
      - "app/portal/runs_display.py"
      - "app/portal/main.py"
      - "tests/test_portal_runs_display.py"
      - "tests/test_portal_acme_run_navigation.py"
      - "app/portal/demo_run_identity.py"
      - "tests/test_portal_demo_run_identity.py"
      - "scripts/ops/run_local_temporal_demo.py"
      - "app/shared/fresh_run_evidence.py"
      - "tests/test_fresh_run_evidence.py"
      - "tests/ops/test_local_temporal_demo.py"
      - "scripts/ops/live_usecase_qualification.py"
      - "tests/ops/test_live_usecase_qualification.py"
      - ".github/workflows/portal-ui-consolidation-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-ui-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated UI contracts without network or secrets
        run: |
          node --test \
            app/portal/components/read_settlement_guard.test.mjs \
            app/portal/components/evidence_request_settlement.test.mjs \
            tests/test_portal_bootstrap_client.mjs
      - name: Verify bounded legacy cockpit Runs projection
        run: python -m unittest discover -s tests -p "test_portal_runs_display.py" -v
      - name: Compile Portal controller and projection
        run: python -m py_compile app/portal/main.py app/portal/runs_display.py
      - name: Verify ACME run navigation and launch guard
        run: python -m unittest discover -s tests -p "test_portal_acme_run_navigation.py" -v
      - name: Verify Core Run identity fail-closed contract
        run: python -m unittest discover -s tests -p "test_portal_demo_run_identity.py" -v
      - name: Verify isolated fresh-run launcher and read-only use-case probes
        run: |
          python -m unittest discover -s tests/ops -p "test_local_temporal_demo.py" -v
          python -m unittest discover -s tests/ops -p "test_live_usecase_qualification.py" -v
          python -m py_compile scripts/ops/run_local_temporal_demo.py scripts/ops/live_usecase_qualification.py
      - name: Verify persisted Evidence readback digest and negative contracts
        run: |
          python -m unittest discover -s tests -p "test_fresh_run_evidence.py" -v
          python -m py_compile app/shared/fresh_run_evidence.py
