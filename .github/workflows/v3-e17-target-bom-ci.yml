name: V3 isolated E17 target OCI BOM
on:
  pull_request:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/kit/release-lab/runtime_payload.py'
      - 'v3-spike/kit/release-lab/test_runtime_payload.py'
      - 'db/migrations/**'
      - 'v3-spike/kit/release-lab/oci_envelope.py'
      - 'v3-spike/kit/release-lab/test_oci_envelope.py'
      - 'v3-spike/kit/release-lab/oci_import.py'
      - 'v3-spike/kit/release-lab/test_oci_import.py'
      - 'v3-spike/kit/release-lab/oci_transport.py'
      - 'v3-spike/kit/release-lab/test_oci_transport.py'
      - 'v3-spike/kit/release-lab/stage-e17-target.py'
      - 'v3-spike/kit/release-lab/e17-runtime-ci.py'
      - 'v3-spike/kit/release-lab/e17-history-evidence.py'
      - 'v3-spike/kit/poc-image-bom.py'
      - 'v3-spike/kit/compose.poc-source.yml'
      - 'v3-spike/kit/compose.gamma-ci.yml'
      - 'v3-spike/kit/poc*e17*.py'
      - 'v3-spike/kit/release-lab/assemble.py'
      - 'v3-spike/vertical/**'
      - '.github/workflows/v3-e17-target-bom-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-bom:
    outputs:
      bom_sha256: ${{ steps.transport_identity.outputs.bom_sha256 }}
      archive_sha256: ${{ steps.transport_identity.outputs.archive_sha256 }}
      registry_ref: ${{ steps.transport_identity.outputs.registry_ref }}
      daemon_id: ${{ steps.transport_identity.outputs.daemon_id }}
      support_manifest: ${{ steps.runtime_support.outputs.manifest }}
      support_verifier: ${{ steps.runtime_support.outputs.verifier }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V3_ROOT: /tmp/aiops-v3-rootless-ci
      COMPOSE_PROJECT_NAME: v3-e17-target-build-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact branch checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify transport against isolated HTTP registry fixture
        working-directory: v3-spike/kit/release-lab
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_oci_transport.TransportTests test_oci_import.RestoreTests test_oci_envelope.EnvelopeTests test_runtime_payload.RuntimePayloadTests
      - name: Start isolated rootless daemon
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker-rootless-ci.list
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session docker-ce-rootless-extras
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          # Disposable runner only: provision dedicated daemon storage before starting Docker.
          test ! -e "$V3_ROOT"
          install -m 0700 -d "$V3_ROOT" "$HOME/.config/docker"
          test ! -e "$HOME/.config/docker/daemon.json"
          (umask 077; printf '{"data-root":"%s/docker-data"}\n' "$V3_ROOT" > "$HOME/.config/docker/daemon.json")
          dockerd-rootless-setuptool.sh install --force
          systemctl --user start docker
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Prepare actual nine-image immutable BOM
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true
          test "$V3_ROOT" = /tmp/aiops-v3-rootless-ci
          test "$(id -u)" != 0
          docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless
          test "$(docker info --format '{{.DockerRootDir}}')" = "$V3_ROOT/docker-data"
          export V3_DB_PASSWORD="$(openssl rand -hex 24)"
          export V3_LAB_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$V3_DB_PASSWORD"
          echo "::add-mask::$V3_LAB_TOKEN"
          mkdir -p "$V3_ROOT/data/postgres" "$V3_ROOT/data/temporal-postgres" "$V3_ROOT/bom"
          printf 'V3_DB_PASSWORD=%s\nV3_LAB_TOKEN=%s\n' "$V3_DB_PASSWORD" "$V3_LAB_TOKEN" > "$V3_ROOT/poc.env"
          out="$V3_ROOT/bom"
          base=v3-spike/kit/compose.poc-source.yml
          compose=(docker compose --env-file "$V3_ROOT/poc.env" -f "$base" -f v3-spike/kit/compose.gamma-ci.yml --profile orchestration)
          docker run -d --name v3-lab-kit-registry -p 127.0.0.1:15080:5000 registry:2
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:15080/v2/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:15080/v2/ >/dev/null
          python3 -m py_compile v3-spike/kit/poc-image-bom.py
          python3 - "$V3_ROOT/build.json" <<'PY'
          import json,sys
          names=("core","twin","evidence","policy","worker","gamma")
          with open(sys.argv[1],"x") as f:
              json.dump({"services":{s:{"image":"127.0.0.1:15080/aiops-v3/"+s+":ci"} for s in names}},f)
          PY
          "${compose[@]}" -f "$V3_ROOT/build.json" build core twin evidence policy worker gamma
          "${compose[@]}" pull postgres temporal
          docker tag postgres:16-alpine 127.0.0.1:15080/aiops-v3/postgres:ci
          docker tag postgres:16-alpine 127.0.0.1:15080/aiops-v3/temporal-postgres:ci
          docker tag temporalio/auto-setup:1.29.7 127.0.0.1:15080/aiops-v3/temporal:ci
          python3 v3-spike/kit/poc-image-bom.py create-gamma "$out" "$(git rev-parse HEAD)"
      - name: Build and verify tenth image from immutable Worker base
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true
          test "$V3_ROOT" = /tmp/aiops-v3-rootless-ci
          test "$(id -u)" != 0
          docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless
          test "$(docker info --format '{{.DockerRootDir}}')" = "$V3_ROOT/docker-data"
          worker=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"]["worker"]["reference"])' "$V3_ROOT/bom/image-bom.json")
          python3 v3-spike/kit/release-lab/stage-e17-target.py v3-spike "$V3_ROOT/e17-context" "$worker" > "$V3_ROOT/e17-context-report.json"
          docker build --network none --pull --platform linux/amd64 -t 127.0.0.1:15080/aiops-v3/e17-target:ci "$V3_ROOT/e17-context"
          install -m 0700 -d "$V3_ROOT/target-bom"
          python3 v3-spike/kit/poc-image-bom.py create-e17-target "$V3_ROOT/target-bom" "$GITHUB_SHA"
          python3 v3-spike/kit/poc-image-bom.py extend-e17 "$V3_ROOT/bom" "$V3_ROOT/target-bom" "$V3_ROOT/e17-bom" "$GITHUB_SHA"
          target=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"]["e17-target"]["reference"])' "$V3_ROOT/e17-bom/image-bom.json")
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "$target" -c 'import os,sys,ast,pathlib; assert os.getuid()==1000; p=pathlib.Path("/lab"); files=list(p.rglob("*.py")); assert len(files)==29; [ast.parse(f.read_bytes()) for f in files]; import temporalio; print("E17_TARGET_IMAGE_STATIC_ONLY")'
      - name: Prepare isolated Chromium from integrated checkout
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          probe=v3-spike/vertical/tests/gamma_oci_e17_readback.py
          test -f "$probe"
          git ls-files --error-unmatch "$probe" >/dev/null
          echo "A probe blob=$(git hash-object "$probe")"
          install -m 0600 "$probe" "$V3_ROOT/a-e17-probe.py"
          python3 -m venv "$V3_ROOT/browser-venv"
          "$V3_ROOT/browser-venv/bin/python" -m pip install --no-cache-dir playwright==1.51.0
          PLAYWRIGHT_BROWSERS_PATH="$V3_ROOT/chromium" "$V3_ROOT/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Exercise pinned E17 Worker target and readback
        run: python3 v3-spike/kit/release-lab/e17-runtime-ci.py
      - name: Export and independently verify original registry content
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true
          test "$V3_ROOT" = /tmp/aiops-v3-rootless-ci
          test "$(id -u)" != 0
          docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless
          test "$(docker info --format '{{.DockerRootDir}}')" = "$V3_ROOT/docker-data"
          bom="$V3_ROOT/e17-bom/image-bom.json"
          expected="sha256:$(sha256sum "$bom" | cut -d' ' -f1)"
          python3 v3-spike/kit/release-lab/oci_transport.py export "$bom" "$V3_ROOT/e17-content-export" > "$V3_ROOT/e17-content-export.json"
          python3 v3-spike/kit/release-lab/oci_transport.py verify "$V3_ROOT/e17-content-export" "$expected" > "$V3_ROOT/e17-content-verify.json"
          cmp "$V3_ROOT/e17-content-export.json" "$V3_ROOT/e17-content-verify.json"
          cat "$V3_ROOT/e17-content-verify.json"
      - name: Pack exact OCI content into deterministic archive
        run: |
          set -euo pipefail
          umask 077
          expected="sha256:$(sha256sum "$V3_ROOT/e17-content-export/image-bom.json" | cut -d' ' -f1)"
          python3 v3-spike/kit/release-lab/oci_envelope.py pack "$V3_ROOT/e17-content-export" "$V3_ROOT/e17-content.tar" "$expected" > "$V3_ROOT/e17-envelope-pack.json"
          cat "$V3_ROOT/e17-envelope-pack.json"
      - name: Bind payload to producer and immutable registry bootstrap
        id: transport_identity
        run: |
          set -euo pipefail
          expected="sha256:$(sha256sum "$V3_ROOT/e17-content-export/image-bom.json" | cut -d' ' -f1)"
          registry_ref=$(docker image inspect registry:2 --format '{{json .RepoDigests}}' | python3 -c 'import json,re,sys; refs=[r for r in json.load(sys.stdin) if re.fullmatch(r"(?:docker.io/library/)?registry@sha256:[a-f0-9]{64}",r)]; assert len(refs)==1; print("docker.io/library/registry@"+refs[0].split("@")[1])')
          daemon_id=$(docker info --format '{{.ID}}')
          test -n "$daemon_id"
          archive="sha256:$(sha256sum "$V3_ROOT/e17-content.tar" | cut -d' ' -f1)"
          python3 - "$V3_ROOT/e17-envelope-pack.json" "$archive" "$expected" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["archive_sha256"] == sys.argv[2] and r["bom_sha256"] == sys.argv[3]
          assert r["result"] == "PASS" and r["production_authorized"] is False
          PY
          printf 'bom_sha256=%s\narchive_sha256=%s\nregistry_ref=%s\ndaemon_id=%s\n' "$expected" "$archive" "$registry_ref" "$daemon_id" >> "$GITHUB_OUTPUT"
      - name: Stage and bind exact runtime support
        id: runtime_support
        run: |
          set -euo pipefail
          umask 077
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import subprocess,sys
          sys.path.insert(0,"v3-spike/kit/release-lab")
          from runtime_payload import FILES
          for name in sorted(FILES):
              subprocess.run(["git","ls-files","--error-unmatch",name],check=True,stdout=subprocess.DEVNULL)
          PY
          python3 v3-spike/kit/release-lab/runtime_payload.py stage "$GITHUB_WORKSPACE" "$V3_ROOT/runtime-support" "$GITHUB_SHA" > "$V3_ROOT/runtime-support-stage.json"
          manifest="sha256:$(sha256sum "$V3_ROOT/runtime-support/runtime-manifest.json" | cut -d' ' -f1)"
          verifier="$(sha256sum "$GITHUB_WORKSPACE/v3-spike/kit/release-lab/runtime_payload.py" | cut -d' ' -f1)"
          test "$(sha256sum "$V3_ROOT/runtime-support/v3-spike/kit/release-lab/runtime_payload.py" | cut -d' ' -f1)" = "$verifier"
          python3 v3-spike/kit/release-lab/runtime_payload.py verify "$V3_ROOT/runtime-support" "$manifest" "$GITHUB_SHA" > "$V3_ROOT/runtime-support-verify.json"
          cmp "$V3_ROOT/runtime-support-stage.json" "$V3_ROOT/runtime-support-verify.json"
          printf 'manifest=%s\nverifier=%s\n' "$manifest" "$verifier" >> "$GITHUB_OUTPUT"
      - name: Transfer only allowlisted runtime support
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-e17-runtime-support
          path: /tmp/aiops-v3-rootless-ci/runtime-support/
          if-no-files-found: error
          retention-days: 1
      - name: Transfer verified OCI payload only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-e17-content-payload
          path: /tmp/aiops-v3-rootless-ci/e17-content.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Restore exact content to a fresh registry with source stopped
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true
          test "$V3_ROOT" = /tmp/aiops-v3-rootless-ci
          test "$(id -u)" != 0
          docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless
          test "$(docker info --format '{{.DockerRootDir}}')" = "$V3_ROOT/docker-data"
          registry_id=$(docker inspect --type container --format '{{.Image}}' v3-lab-kit-registry)
          [[ "$registry_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          if docker container inspect v3-e17-import-registry >/dev/null 2>&1; then exit 1; fi
          docker stop v3-lab-kit-registry >/dev/null
          cid=$(docker run -d --pull never --name v3-e17-import-registry -p 127.0.0.1:15081:5000 "$registry_id")
          [[ "$cid" =~ ^[a-f0-9]{64}$ ]]
          trap 'docker rm -fv "$cid" >/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:15081/v2/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:15081/v2/ >/dev/null
          if curl -fsS --max-time 2 http://127.0.0.1:15080/v2/ >/dev/null; then exit 1; fi
          expected="sha256:$(sha256sum "$V3_ROOT/e17-bom/image-bom.json" | cut -d' ' -f1)"
          python3 v3-spike/kit/release-lab/oci_import.py "$V3_ROOT/e17-content-export" "$expected" > "$V3_ROOT/e17-content-restore.json"
          python3 - "$V3_ROOT" <<'PY'
          import json, pathlib, runpy, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          bom = json.loads((root / "e17-bom/image-bom.json").read_text())
          restore = json.loads((root / "e17-content-restore.json").read_text())
          reader = runpy.run_path("v3-spike/kit/poc-image-bom.py")["platform_config"]
          if restore["result"] != "PASS" or restore["manifests"] != {s:r["manifest_digest"] for s,r in bom["images"].items()}:
              raise SystemExit("restore receipt mismatch")
          for service, row in sorted(bom["images"].items()):
              ref = "127.0.0.1:15081/aiops-v3/" + service + "@" + row["manifest_digest"]
              subprocess.run(["docker", "pull", "--platform", "linux/amd64", ref], check=True)
              if reader(ref, root) != row["config_digest"]:
                  raise SystemExit("restored engine config mismatch")
          receipt = {"classification":"V3_E17_RESTORED_REGISTRY_PULL", "result":"PASS",
                     "source_sha":bom["source_sha"], "images":len(bom["images"]),
                     "source_registry_stopped":True, "same_prepared_daemon":True,
                     "production_authorized":False}
          (root / "e17-content-pull.json").write_text(json.dumps(receipt, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve OCI identity and build context receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-e17-target-bom
          path: |
            /tmp/aiops-v3-rootless-ci/runtime-support-stage.json
            /tmp/aiops-v3-rootless-ci/runtime-support-verify.json
            /tmp/aiops-v3-rootless-ci/runtime-support/runtime-manifest.json
            /tmp/aiops-v3-rootless-ci/e17-envelope-pack.json
            /tmp/aiops-v3-rootless-ci/e17-content-restore.json
            /tmp/aiops-v3-rootless-ci/e17-content-pull.json
            /tmp/aiops-v3-rootless-ci/e17-content-export.json
            /tmp/aiops-v3-rootless-ci/e17-content-verify.json
            /tmp/aiops-v3-rootless-ci/e17-context-report.json
            /tmp/aiops-v3-rootless-ci/e17-bom/image-bom.json
            /tmp/aiops-v3-rootless-ci/e17-bom/compose.pinned.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product-worker.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product-worker-replay.json
            /tmp/aiops-v3-rootless-ci/e17-history-before.json
            /tmp/aiops-v3-rootless-ci/e17-history-after.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-recreated-target.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product-gamma.json
            /tmp/aiops-v3-rootless-ci/e17-browser/e17-browser.json
            /tmp/aiops-v3-rootless-ci/e17-browser/e17-readback.png
            /tmp/aiops-v3-rootless-ci/e17-browser/trace.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable registry only
        if: always()
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless && test "$(docker info --format '{{.DockerRootDir}}')" = "$V3_ROOT/docker-data"; then
            docker rm -f v3-lab-kit-registry || true
          fi

  cold-install:
    needs: target-bom
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V3_ROOT: /tmp/aiops-v3-rootless-ci
      COMPOSE_PROJECT_NAME: v3-e17-cold-install-ci
      EXPECTED_BOM_SHA: ${{ needs.target-bom.outputs.bom_sha256 }}
      EXPECTED_ARCHIVE_SHA: ${{ needs.target-bom.outputs.archive_sha256 }}
      REGISTRY_REF: ${{ needs.target-bom.outputs.registry_ref }}
      PRODUCER_DAEMON: ${{ needs.target-bom.outputs.daemon_id }}
      EXPECTED_SUPPORT_MANIFEST: ${{ needs.target-bom.outputs.support_manifest }}
      EXPECTED_SUPPORT_VERIFIER: ${{ needs.target-bom.outputs.support_verifier }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert no source checkout
        run: |
          set -eu
          test -d "$GITHUB_WORKSPACE"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then exit 1; fi
          echo "NO_SOURCE_CHECKOUT"
      - name: Start isolated rootless daemon
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker-rootless-ci.list
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session docker-ce-rootless-extras
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          # Disposable runner only: provision dedicated daemon storage before starting Docker.
          test ! -e "$V3_ROOT"
          install -m 0700 -d "$V3_ROOT" "$HOME/.config/docker"
          test ! -e "$HOME/.config/docker/daemon.json"
          (umask 077; printf '{"data-root":"%s/docker-data"}\n' "$V3_ROOT" > "$HOME/.config/docker/daemon.json")
          dockerd-rootless-setuptool.sh install --force
          systemctl --user start docker
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Assert a cold independent rootless daemon
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(id -u)" != 0
          test "$DOCKER_HOST" = "unix:///run/user/$(id -u)/docker.sock"
          docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless
          test "$(docker info --format '{{.DockerRootDir}}')" = "$V3_ROOT/docker-data"
          test -z "$(docker image ls -aq)"
          test -z "$(docker container ls -aq)"
          test -z "$(docker volume ls -q)"
          destination=$(docker info --format '{{.ID}}')
          test -n "$PRODUCER_DAEMON"
          test -n "$destination"
          test "$destination" != "$PRODUCER_DAEMON"
          echo "COLD_DAEMON_EMPTY_AND_DISTINCT"
          install -m 0700 -d "$V3_ROOT/transport-inbox"
      - name: Receive only the allowlisted runtime support
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v3-e17-runtime-support
          path: /tmp/aiops-v3-rootless-ci/runtime-support
      - name: Verify bootstrap and support before executing any transferred code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          support="$V3_ROOT/runtime-support"
          verifier="$support/v3-spike/kit/release-lab/runtime_payload.py"
          [[ "$EXPECTED_SUPPORT_VERIFIER" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_SUPPORT_MANIFEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 -I - "$support" "$EXPECTED_SUPPORT_VERIFIER" "$EXPECTED_SUPPORT_MANIFEST" <<'PY'
          import hashlib, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          for rel,expected in [("v3-spike/kit/release-lab/runtime_payload.py",sys.argv[2]),("runtime-manifest.json",sys.argv[3][7:])]:
              path=root/rel
              assert root.resolve()==root and path.resolve()==path and path.is_file()
              assert 0<path.stat().st_size<=8*1024**2
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected
          PY
          python3 -I -B "$verifier" verify "$support" "$EXPECTED_SUPPORT_MANIFEST" "$GITHUB_SHA" > "$V3_ROOT/cold-support-verify.json"
          cat "$V3_ROOT/cold-support-verify.json"
          test ! -e "$support/.git"
      - name: Receive exact OCI payload from producer job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v3-e17-content-payload
          path: /tmp/aiops-v3-rootless-ci/transport-inbox
      - name: Validate and unpack archive before registry writes
        run: |
          set -euo pipefail
          umask 077
          cd "$V3_ROOT/runtime-support"
          test "$(find "$V3_ROOT/transport-inbox" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          python3 v3-spike/kit/release-lab/oci_envelope.py unpack "$V3_ROOT/transport-inbox/e17-content.tar" "$V3_ROOT/e17-content-export" "$EXPECTED_ARCHIVE_SHA" "$EXPECTED_BOM_SHA" > "$V3_ROOT/cold-envelope-unpack.json"
          python3 v3-spike/kit/release-lab/oci_transport.py verify "$V3_ROOT/e17-content-export" "$EXPECTED_BOM_SHA" > "$V3_ROOT/cold-content-verify.json"
          cat "$V3_ROOT/cold-envelope-unpack.json"
          python3 -c 'import json,os,sys; r=json.load(open(sys.argv[1])); assert r["source_sha"]==os.environ["GITHUB_SHA"] and r["production_authorized"] is False' "$V3_ROOT/cold-content-verify.json"
      - name: Bootstrap only the pinned registry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY_REF" =~ ^docker\.io/library/registry@sha256:[a-f0-9]{64}$ ]]
          docker pull --platform linux/amd64 "$REGISTRY_REF"
          docker run -d --pull never --name v3-lab-kit-registry -p 127.0.0.1:15080:5000 "$REGISTRY_REF"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:15080/v2/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:15080/v2/ >/dev/null
      - name: Restore and cold pull all original image digests
        run: |
          set -euo pipefail
          umask 077
          cd "$V3_ROOT/runtime-support"
          python3 - "$V3_ROOT" <<'PY'
          import json, os, pathlib, runpy, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          sys.path.insert(0, "v3-spike/kit/release-lab")
          from oci_import import restore
          from oci_transport import read_bom
          archive = root / "e17-content-export"
          expected = os.environ["EXPECTED_BOM_SHA"]
          result = restore(archive, expected, port=15080)
          raw = (archive / "image-bom.json").read_bytes()
          bom = read_bom(raw)
          assert bom["source_sha"] == os.environ["GITHUB_SHA"]
          assert result["manifests"] == {s:r["manifest_digest"] for s,r in bom["images"].items()}
          reader = runpy.run_path("v3-spike/kit/poc-image-bom.py")["platform_config"]
          # Inspect all references before the first product pull (shared PG identity is legitimate).
          for row in bom["images"].values():
              assert subprocess.run(["docker","image","inspect",row["reference"]],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode != 0
          for name, row in sorted(bom["images"].items()):
              ref = row["reference"]
              subprocess.run(["docker","pull","--platform","linux/amd64",ref],check=True)
              assert reader(ref, root) == row["config_digest"]
              # Engine-local IDs need not be portable; record destination identity
              # only after the registry and platform config identity are verified.
              info = json.loads(subprocess.check_output(["docker","image","inspect",ref]))[0]
              assert info["Os"]=="linux" and info["Architecture"]=="amd64"
              row["engine_image_id"] = info["Id"]
          (root/"e17-bom").mkdir(mode=0o700)
          (root/"bom").mkdir(mode=0o700)
          (root/"e17-bom/image-bom.json").write_text(json.dumps(bom,sort_keys=True)+"\n")
          base = {**bom,"classification":"DISPOSABLE_POC_IMAGE_BOM","images":{s:r for s,r in bom["images"].items() if s!="e17-target"}}
          (root/"bom/image-bom.json").write_text(json.dumps(base,sort_keys=True)+"\n")
          receipt = {**result,"classification":"V3_E17_COLD_RUNNER_PULL","source_sha":bom["source_sha"],
                     "empty_distinct_daemon":True,"product_build":False,"product_references_present_before_pull":False}
          (root/"cold-content-pull.json").write_text(json.dumps(receipt,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Prepare isolated Chromium from verified runtime support
        run: |
          set -euo pipefail
          umask 077
          cd "$V3_ROOT/runtime-support"
          probe=v3-spike/vertical/tests/gamma_oci_e17_readback.py
          test -f "$probe"
          test ! -L "$probe"
          install -m 0600 "$probe" "$V3_ROOT/a-e17-probe.py"
          python3 -m venv "$V3_ROOT/browser-venv"
          "$V3_ROOT/browser-venv/bin/python" -m pip install --no-cache-dir playwright==1.51.0
          PLAYWRIGHT_BROWSERS_PATH="$V3_ROOT/chromium" "$V3_ROOT/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Run E17 from support only without checkout or rebuild
        run: |
          set -euo pipefail
          cd "$V3_ROOT/runtime-support"
          python3 v3-spike/kit/release-lab/e17-runtime-ci.py
          python3 -I -B v3-spike/kit/release-lab/runtime_payload.py verify "$V3_ROOT/runtime-support" "$EXPECTED_SUPPORT_MANIFEST" "$GITHUB_SHA" > "$V3_ROOT/cold-support-after.json"
          cmp "$V3_ROOT/cold-support-verify.json" "$V3_ROOT/cold-support-after.json"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          python3 -I - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["V3_ROOT"])
          support=json.loads((root/"cold-support-after.json").read_text())
          pull=json.loads((root/"cold-content-pull.json").read_text())
          report=json.loads((root/"temporal-e17-product.json").read_text())
          browser=json.loads((root/"e17-browser/e17-browser.json").read_text())
          assert support["result"]==pull["result"]==report["result"]==browser["result"]=="PASS"
          assert support["source_sha"]==pull["source_sha"]==os.environ["GITHUB_SHA"]
          assert report["production_authorized"] is False and browser["production_authorized"] is False
          receipt={"classification":"V3_E17_NO_CHECKOUT_RUNTIME","result":"PASS","source_sha":os.environ["GITHUB_SHA"],
                   "support_manifest_sha256":support["manifest_sha256"],"bom_sha256":pull["bom_sha256"],
                   "archive_sha256":os.environ["EXPECTED_ARCHIVE_SHA"],"checkout_present":False,
                   "product_build":False,"support_unchanged":True,"production_authorized":False}
          (root/"cold-no-checkout.json").write_text(json.dumps(receipt,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve cold-runner proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-e17-cold-runner
          path: |
            /tmp/aiops-v3-rootless-ci/cold-support-verify.json
            /tmp/aiops-v3-rootless-ci/cold-support-after.json
            /tmp/aiops-v3-rootless-ci/cold-no-checkout.json
            /tmp/aiops-v3-rootless-ci/runtime-support/runtime-manifest.json
            /tmp/aiops-v3-rootless-ci/cold-envelope-unpack.json
            /tmp/aiops-v3-rootless-ci/cold-content-verify.json
            /tmp/aiops-v3-rootless-ci/cold-content-pull.json
            /tmp/aiops-v3-rootless-ci/e17-bom/image-bom.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product-worker.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product-worker-replay.json
            /tmp/aiops-v3-rootless-ci/e17-history-before.json
            /tmp/aiops-v3-rootless-ci/e17-history-after.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-recreated-target.json
            /tmp/aiops-v3-rootless-ci/temporal-e17-product-gamma.json
            /tmp/aiops-v3-rootless-ci/e17-browser/e17-browser.json
            /tmp/aiops-v3-rootless-ci/e17-browser/e17-readback.png
            /tmp/aiops-v3-rootless-ci/e17-browser/trace.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Remove cold disposable registry only
        if: always()
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q name=rootless && test "$(docker info --format '{{.DockerRootDir}}')" = "$V3_ROOT/docker-data"; then
            docker rm -fv v3-lab-kit-registry || true
          fi
