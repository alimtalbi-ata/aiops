name: V3 product BOM static preflight
on:
  push:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/kit/product_preflight.py'
      - 'v3-spike/kit/test_product_preflight.py'
      - 'v3-spike/kit/verify_junit.py'
      - 'v3-spike/kit/test_verify_junit.py'
      - 'v3-spike/kit/product-bom.json'
      - 'v3-spike/kit/docker-compose.yml'
      - 'v3-spike/product/docker-compose.yml'
      - 'v3-spike/kit/fixture.py'
      - 'v3-spike/vertical/**'
      - 'v3-spike/kit/verify_product_provenance.py'
      - 'v3-spike/kit/verify_product_compose.py'
      - 'v3-spike/kit/test_product_alignment.py'
      - 'v3-spike/product/oci-provenance.json'
      - '.github/workflows/v3-product-preflight.yml'
  pull_request:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/kit/verify_product_compose.py'
      - 'v3-spike/kit/test_product_alignment.py'
      - '.github/workflows/v3-product-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-dev:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact SHA
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          date -u +%FT%TZ
      - name: Run eighteen isolated BOM and CLI tests and write JUnit
        run: |
          set -eu
          mkdir -p reports
          python3 -m pip install --disable-pip-version-check 'unittest-xml-reporting==3.2.0'
          python3 -B - <<'PY'
          import sys, unittest
          import xmlrunner
          sys.path.insert(0, 'v3-spike/kit')
          suite = unittest.defaultTestLoader.discover('v3-spike/kit', pattern='test_product_preflight.py')
          count = suite.countTestCases()
          assert count == 18, f'FAIL collection {count} != 18'
          result = xmlrunner.XMLTestRunner(output='reports', verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == count, 'FAIL product BOM tests'
          print('PASS product BOM static and CLI 18/18; runtime NOT_RUN')
          PY
      - name: Verify fourteen adversarial JUnit mutations
        run: |
          set -eu
          PYTHONPATH=v3-spike/kit python3 -B -m unittest -v test_verify_junit
      - name: Verify product JUnit receipt integrity
        run: |
          set -eu
          python3 -B v3-spike/kit/verify_junit.py reports --expected 18 --source v3-spike/kit/test_product_preflight.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest reports/receipt-manifest.json
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-synthetic-dev-junit
          path: |
            reports/*.xml
            reports/receipt-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "qualification=synthetic-dev runtime=NOT_RUN deploy_authorized=false"
  vertical-synthetic:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute eight unit and four black-box synthetic CLI tests
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd v3-spike/vertical
          python3 -m pip install --disable-pip-version-check 'unittest-xml-reporting==3.2.0'
          mkdir -p ../../vertical-junit/unit ../../vertical-junit/cli
          python3 -B - <<'PYTEST'
          import unittest
          import xmlrunner
          for module, expected, target in (
              ('test_vertical_demo', 8, '../../vertical-junit/unit'),
              ('test_vertical_cli_smoke', 4, '../../vertical-junit/cli'),
          ):
              suite = unittest.defaultTestLoader.loadTestsFromName(module)
              count = suite.countTestCases()
              assert count == expected, f'FAIL collection {module}: {count} != {expected}'
              result = xmlrunner.XMLTestRunner(output=target, verbosity=2).run(suite)
              assert result.wasSuccessful() and result.testsRun == expected, f'FAIL execution {module}'
          PYTEST
          python3 -B ../../v3-spike/kit/verify_junit.py ../../vertical-junit/unit --expected 8 --source test_vertical_demo.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest ../../vertical-junit/unit/manifest.json
          python3 -B ../../v3-spike/kit/verify_junit.py ../../vertical-junit/cli --expected 4 --source test_vertical_cli_smoke.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest ../../vertical-junit/cli/manifest.json
          python3 -B vertical_demo.py > ../../vertical-denied.json
          python3 -B vertical_demo.py --approved-synthetic > ../../vertical-simulated.json
          python3 - <<'PY'
          import json
          from vertical_demo import verify_projection
          denied = json.load(open('../../vertical-denied.json'))
          simulated = json.load(open('../../vertical-simulated.json'))
          assert verify_projection(denied) and verify_projection(simulated)
          assert denied['policy']['decision'] == 'DENY'
          assert simulated['policy']['decision'] == 'SIMULATE_ONLY'
          assert not denied['production_authorized'] and not simulated['production_authorized']
          assert not simulated['run']['executed_on_host']
          print('PASS synthetic vertical denied/simulated; production NO-GO')
          PY
      - name: Upload verified vertical JUnit and SHA manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-vertical-synthetic-junit
          path: |
            vertical-junit/**/*.xml
            vertical-junit/**/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic vertical receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-vertical-synthetic-receipts
          path: vertical-*.json
          if-no-files-found: warn
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA synthetic_only=true runtime=NOT_RUN"
  compose-static:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate canonical normalized Compose default and demo with synthetic digest inputs
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f v3-spike/product/docker-compose.yml
          export CORE_IMAGE="example.invalid/core@sha256:$(printf 'a%.0s' {1..64})"
          export TEMPORAL_IMAGE="example.invalid/temporal@sha256:$(printf 'b%.0s' {1..64})"
          export WORKER_IMAGE="example.invalid/worker@sha256:$(printf 'c%.0s' {1..64})"
          export POLICY_IMAGE="example.invalid/policy@sha256:$(printf 'd%.0s' {1..64})"
          export HITL_IMAGE="example.invalid/hitl@sha256:$(printf 'e%.0s' {1..64})"
          export EVIDENCE_IMAGE="example.invalid/evidence@sha256:$(printf 'f%.0s' {1..64})"
          export GAMMA_IMAGE="example.invalid/gamma@sha256:$(printf '1%.0s' {1..64})"
          export DEMO_IMAGE="example.invalid/demo@sha256:$(printf '2%.0s' {1..64})"
          mkdir -p compose-reports
          docker compose -f v3-spike/product/docker-compose.yml config --format json > compose-reports/default.json
          docker compose --profile demo -f v3-spike/product/docker-compose.yml config --format json > compose-reports/demo.json
          PYTHONPATH=v3-spike/kit python3 - <<'PY'
          import json, pathlib, re
          from verify_product_compose import verify_draft_volumes
          base = pathlib.Path('compose-reports')
          required = {'gamma','core','temporal','worker','policy','hitl','evidence'}
          for profile, expected in [('default', required), ('demo', required | {'demo'})]:
              doc = json.loads((base / (profile+'.json')).read_text())
              verify_draft_volumes(doc, normalized=True)
              services = doc['services']
              assert set(services) == expected, (profile, sorted(services))
              for name, spec in services.items():
                  assert re.fullmatch(r'example[.]invalid/[a-z]+@sha256:[0-9a-f]{64}', spec['image']), name
                  assert not spec.get('privileged'), name
                  assert spec.get('network_mode') != 'host', name
                  for port in spec.get('ports', []):
                      assert name == 'gamma' and port.get('host_ip') == '127.0.0.1', (name,port)
                      assert int(port.get('published')) not in {7770,7777,7790}, port
              print('PASS normalized synthetic Compose', profile, len(services))
          PY
          date -u +%FT%TZ
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID job=$GITHUB_JOB synthetic_digests_only=true runtime=NOT_RUN"
      - name: Upload normalized Compose JSON evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-compose-normalized-synthetic
          path: compose-reports/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA compose_static_only=true runtime=NOT_RUN"
  decision-evidence-contract:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout reviewed B synthetic trust boundary at immutable SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 676900cd9bcd927c5d63d5ea11789eba094acd90
          path: b-contract
          persist-credentials: false
      - name: Run exact 24 B trust-boundary adversarial tests
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C b-contract rev-parse HEAD)" = "676900cd9bcd927c5d63d5ea11789eba094acd90"
          python3 -m venv .venv-trust
          .venv-trust/bin/python -m pip install --disable-pip-version-check 'unittest-xml-reporting==3.2.0'
          mkdir -p trust-junit
          .venv-trust/bin/python - <<'PY'
          import sys, unittest, xmlrunner
          sys.path.insert(0, 'b-contract/v3-spike/contracts')
          suite = unittest.defaultTestLoader.loadTestsFromName('test_decision_evidence_synthetic')
          assert suite.countTestCases() == 24, f'FAIL trust collection: {suite.countTestCases()} != 24'
          result = xmlrunner.XMLTestRunner(output='trust-junit', verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 24, 'FAIL trust execution'
          print('PASS B synthetic DecisionEvidence 24/24; not production authorization')
          PY
          # Verify semantic JUnit integrity against the exact B source before hashing receipts.
          python3 -B v3-spike/kit/verify_junit.py trust-junit --expected 24 --source b-contract/v3-spike/contracts/test_decision_evidence_synthetic.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest trust-junit/semantic-manifest.json
          # The shared verifier's 14 mutation tests independently exercise fail-closed semantics.
          PYTHONPATH=v3-spike/kit python3 -B -m unittest -v test_verify_junit
          python3 - <<'PY'
          import json, os, pathlib, hashlib, datetime
          p = pathlib.Path('b-contract/v3-spike/contracts/decision_evidence_synthetic.py')
          t = pathlib.Path('b-contract/v3-spike/contracts/test_decision_evidence_synthetic.py')
          reports = sorted(pathlib.Path('trust-junit').glob('*.xml'))
          assert reports, 'FAIL no JUnit'
          manifest = {'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'integration_sha': os.environ['GITHUB_SHA'],
                      'source_sha': '676900cd9bcd927c5d63d5ea11789eba094acd90',
                      'run_id': os.environ['GITHUB_RUN_ID'], 'job': os.environ['GITHUB_JOB'],
                      'tests_expected': 24, 'semantic_manifest': 'trust-junit/semantic-manifest.json',
                      'sha256': {str(x): hashlib.sha256(x.read_bytes()).hexdigest()
                                 for x in [p,t,*reports]}}
          pathlib.Path('trust-junit/manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Upload B trust contract JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-b-decision-evidence-contract-junit
          path: trust-junit/
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB integration_sha=$GITHUB_SHA b_sha=676900cd9bcd927c5d63d5ea11789eba094acd90 runtime=NOT_RUN production_authorized=false"
  product-alignment-synthetic:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute sixty-one BOM Compose provenance mutation tests
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'unittest-xml-reporting==3.2.0'
          mkdir -p alignment-junit
          PYTHONPATH=v3-spike/kit python3 -B - <<'PY'
          import unittest, xmlrunner
          suite = unittest.defaultTestLoader.loadTestsFromName('test_product_alignment')
          assert suite.countTestCases() == 61, f'FAIL expected 61, got {suite.countTestCases()}'
          result = xmlrunner.XMLTestRunner(output='alignment-junit', verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 61, 'FAIL alignment tests'
          PY
          python3 -B v3-spike/kit/verify_junit.py alignment-junit --expected 61 --source v3-spike/kit/test_product_alignment.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest alignment-junit/manifest.json
      - name: Upload alignment JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-product-alignment-junit
          path: alignment-junit/
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA synthetic_only=true runtime=NOT_RUN"

  product-qualification:
    if: github.ref == 'refs/heads/v3-spike/central-integration' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify SHA and product BOM provenance gate
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          date -u +%FT%TZ
          test -f v3-spike/kit/product-bom.json || { echo 'FAIL: product BOM absent; synthetic fixtures cannot qualify product'; exit 1; }
          python3 -B v3-spike/kit/product_preflight.py v3-spike/kit/product-bom.json
          test -f v3-spike/product/oci-provenance.json || { echo 'FAIL: OCI provenance manifest absent'; exit 1; }
          python3 -B v3-spike/kit/verify_product_provenance.py v3-spike/kit/product-bom.json v3-spike/product/oci-provenance.json
          echo 'STRUCTURAL_ONLY: independent OCI provenance gate remains pending; release still blocked'
      - name: Product BOM to Compose consistency
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          set -eu
          echo 'STRUCTURAL_ONLY: normalized effective Compose required for interpolated image inputs'
          test -f v3-spike/product/docker-compose.yml
          # Fail closed on absent registry-verified image inputs, without making
          # downstream Compose validation permanently unreachable.
          for image in CORE TEMPORAL WORKER POLICY HITL EVIDENCE GAMMA DEMO; do
            key="${image}_IMAGE"
            eval 'value=${'"${key}"'-}'
            test -n "$value" || { echo "NOT_ATTESTED: missing verified $key"; exit 1; }
          done
          docker compose -f v3-spike/product/docker-compose.yml config --format json > /tmp/product-default.json
          docker compose --profile demo -f v3-spike/product/docker-compose.yml config --format json > /tmp/product-demo.json
          python3 -B v3-spike/kit/verify_product_compose.py v3-spike/kit/product-bom.json v3-spike/product/docker-compose.yml /tmp/product-default.json
          python3 -B v3-spike/kit/verify_product_compose.py v3-spike/kit/product-bom.json v3-spike/product/docker-compose.yml /tmp/product-demo.json
          echo 'STRUCTURAL_ONLY: normalized Compose checked; independent OCI promotion still NO-GO'
      - name: Product Compose gate
        run: |
          set -eu
          test -f v3-spike/product/docker-compose.yml || { echo 'FAIL: canonical PRODUCT compose absent'; exit 1; }
          cd v3-spike/product
          docker compose -f docker-compose.yml config --quiet
          docker compose --profile demo -f docker-compose.yml config --quiet
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "qualification=product runtime=NOT_RUN deploy_authorized=false"
