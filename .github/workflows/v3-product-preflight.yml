name: V3 product BOM static preflight
on:
  push:
    branches: [v3-spike/central-integration]
    paths:
      - 'v3-spike/kit/product_preflight.py'
      - 'v3-spike/kit/test_product_preflight.py'
      - 'v3-spike/kit/verify_junit.py'
      - 'v3-spike/kit/test_verify_junit.py'
      - 'v3-spike/kit/product-bom.json'
      - 'v3-spike/kit/docker-compose.yml'
      - 'v3-spike/product/docker-compose.yml'
      - 'v3-spike/kit/fixture.py'
      - 'v3-spike/vertical/**'
      - 'v3-spike/kit/verify_product_provenance.py'
      - 'v3-spike/kit/verify_product_compose.py'
      - 'v3-spike/product/oci-provenance.json'
      - '.github/workflows/v3-product-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-dev:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact SHA
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          date -u +%FT%TZ
      - name: Run eighteen isolated BOM and CLI tests and write JUnit
        run: |
          set -eu
          mkdir -p reports
          python3 -m pip install --disable-pip-version-check 'unittest-xml-reporting==3.2.0'
          python3 -B - <<'PY'
          import sys, unittest
          import xmlrunner
          sys.path.insert(0, 'v3-spike/kit')
          suite = unittest.defaultTestLoader.discover('v3-spike/kit', pattern='test_product_preflight.py')
          count = suite.countTestCases()
          assert count == 18, f'FAIL collection {count} != 18'
          result = xmlrunner.XMLTestRunner(output='reports', verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == count, 'FAIL product BOM tests'
          print('PASS product BOM static and CLI 18/18; runtime NOT_RUN')
          PY
      - name: Verify fourteen adversarial JUnit mutations
        run: |
          set -eu
          PYTHONPATH=v3-spike/kit python3 -B -m unittest -v test_verify_junit
      - name: Verify product JUnit receipt integrity
        run: |
          set -eu
          python3 -B v3-spike/kit/verify_junit.py reports --expected 18 --source v3-spike/kit/test_product_preflight.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest reports/receipt-manifest.json
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-synthetic-dev-junit
          path: |
            reports/*.xml
            reports/receipt-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "qualification=synthetic-dev runtime=NOT_RUN deploy_authorized=false"
  vertical-synthetic:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute eight unit and four black-box synthetic CLI tests
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd v3-spike/vertical
          python3 -m pip install --disable-pip-version-check 'unittest-xml-reporting==3.2.0'
          mkdir -p ../../vertical-junit/unit ../../vertical-junit/cli
          python3 -B - <<'PYTEST'
          import unittest
          import xmlrunner
          for module, expected, target in (
              ('test_vertical_demo', 8, '../../vertical-junit/unit'),
              ('test_vertical_cli_smoke', 4, '../../vertical-junit/cli'),
          ):
              suite = unittest.defaultTestLoader.loadTestsFromName(module)
              count = suite.countTestCases()
              assert count == expected, f'FAIL collection {module}: {count} != {expected}'
              result = xmlrunner.XMLTestRunner(output=target, verbosity=2).run(suite)
              assert result.wasSuccessful() and result.testsRun == expected, f'FAIL execution {module}'
          PYTEST
          python3 -B ../../v3-spike/kit/verify_junit.py ../../vertical-junit/unit --expected 8 --source test_vertical_demo.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest ../../vertical-junit/unit/manifest.json
          python3 -B ../../v3-spike/kit/verify_junit.py ../../vertical-junit/cli --expected 4 --source test_vertical_cli_smoke.py --sha "$GITHUB_SHA" --job "$GITHUB_JOB" --manifest ../../vertical-junit/cli/manifest.json
          python3 -B vertical_demo.py > ../../vertical-denied.json
          python3 -B vertical_demo.py --approved-synthetic > ../../vertical-simulated.json
          python3 - <<'PY'
          import json
          from vertical_demo import verify_projection
          denied = json.load(open('../../vertical-denied.json'))
          simulated = json.load(open('../../vertical-simulated.json'))
          assert verify_projection(denied) and verify_projection(simulated)
          assert denied['policy']['decision'] == 'DENY'
          assert simulated['policy']['decision'] == 'SIMULATE_ONLY'
          assert not denied['production_authorized'] and not simulated['production_authorized']
          assert not simulated['run']['executed_on_host']
          print('PASS synthetic vertical denied/simulated; production NO-GO')
          PY
      - name: Upload verified vertical JUnit and SHA manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-vertical-synthetic-junit
          path: |
            vertical-junit/**/*.xml
            vertical-junit/**/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic vertical receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-vertical-synthetic-receipts
          path: vertical-*.json
          if-no-files-found: warn
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA synthetic_only=true runtime=NOT_RUN"
  compose-static:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compose default and demo independent of BOM provenance
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f v3-spike/product/docker-compose.yml || { echo 'FAIL: canonical product Compose absent'; exit 1; }
          docker compose -f v3-spike/product/docker-compose.yml config --quiet
          docker compose --profile demo -f v3-spike/product/docker-compose.yml config --quiet
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA compose_static_only=true runtime=NOT_RUN"
  product-qualification:
    if: github.ref == 'refs/heads/v3-spike/central-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify SHA and product BOM provenance gate
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          date -u +%FT%TZ
          test -f v3-spike/kit/product-bom.json || { echo 'FAIL: product BOM absent; synthetic fixtures cannot qualify product'; exit 1; }
          python3 -B v3-spike/kit/product_preflight.py v3-spike/kit/product-bom.json
          test -f v3-spike/product/oci-provenance.json || { echo 'FAIL: OCI provenance manifest absent'; exit 1; }
          python3 -B v3-spike/kit/verify_product_provenance.py v3-spike/kit/product-bom.json v3-spike/product/oci-provenance.json
      - name: Product BOM to Compose consistency
        run: |
          set -eu
          python3 -B v3-spike/kit/verify_product_compose.py v3-spike/kit/product-bom.json v3-spike/product/docker-compose.yml
      - name: Product Compose gate
        run: |
          set -eu
          test -f v3-spike/product/docker-compose.yml || { echo 'FAIL: canonical PRODUCT compose absent'; exit 1; }
          cd v3-spike/product
          docker compose -f docker-compose.yml config --quiet
          docker compose --profile demo -f docker-compose.yml config --quiet
      - name: Receipt
        if: always()
        run: |
          date -u +%FT%TZ
          echo "run=$GITHUB_RUN_ID job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "qualification=product runtime=NOT_RUN deploy_authorized=false"
