name: Core ACME T2 evidence projection exact-head
on:
  pull_request:
    branches:
      - feat/acme-396-core-same-run-journey-20261103
    paths:
      - app/core/acme_sandbox_journey.py
      - tests/test_core_acme_journey_evidence.py
      - .github/workflows/core-acme-t2-evidence-exact-head.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-t2-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable source HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated source-test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi==0.116.1' 'pytest==8.4.2'
      - name: Compile and run 28 source contracts with no skip
        env:
          PYTHONPATH: app
        run: |
          set -euo pipefail
          python -m compileall -q app/core/acme_sandbox_journey.py tests/test_core_acme_journey.py tests/test_core_acme_journey_evidence.py
          python -m pytest -q tests/test_core_acme_journey.py tests/test_core_acme_journey_evidence.py 2>&1 | tee /tmp/core-t2-evidence.log
          grep -E '^28 passed in ' /tmp/core-t2-evidence.log
          ! grep -E 'skipped|xfailed|xpassed' /tmp/core-t2-evidence.log
          echo 'SOURCE_ONLY=true SAME_RUN_CORE_PG16_INTERNAL_ONLY=true HUMAN_GLPI_AUTH=UNKNOWN EFFECT_ALLOWED=false'
