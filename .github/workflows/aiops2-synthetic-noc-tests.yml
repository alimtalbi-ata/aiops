name: AIOps2 synthetic NOC tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/aiops2_*.py"
      - "app/portal/**"
      - "app/shared/**"
      - "app/requirements.txt"
      - "tests/test_aiops2_*.py"
      - ".github/workflows/aiops2-synthetic-noc-tests.yml"
  push:
    branches:
      - integration/aiops2-convergence-20261114
    paths:
      - "scripts/aiops2_*.py"
      - "app/portal/**"
      - "app/shared/**"
      - "app/requirements.txt"
      - "tests/test_aiops2_*.py"
      - ".github/workflows/aiops2-synthetic-noc-tests.yml"

permissions:
  contents: read

jobs:
  synthetic-noc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify offline synthetic contracts
        run: |
          python -m pytest -q \
            tests/test_aiops2_event_correlation.py \
            tests/test_aiops2_digital_twin_impact.py \
            tests/test_aiops2_analyst_critic.py \
            tests/test_aiops2_noc_decision.py \
            tests/test_aiops2_noc_decision_html.py \
            tests/test_aiops2_server_authorization.py

  offline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIOPS_INTERNAL_TOKEN: synthetic-test-only-not-a-live-credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install portal dependencies and E2E test runner
        run: python -m pip install -r app/requirements.txt pytest httpx
      - name: Verify cross-layer offline E2E and fail-closed portal
        run: python -m pytest -q tests/test_aiops2_cross_layer_e2e.py tests/test_aiops2_auth_boundary_e2e.py tests/test_aiops2_http_tenant_spoof_e2e.py
