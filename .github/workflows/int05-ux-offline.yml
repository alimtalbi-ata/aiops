name: INT05 isolated UX observations
on:
  push:
    branches: [qualification/int05-ux-offline]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "fastapi==0.116.1" "pydantic==2.11.7" "httpx==0.28.1" "requests==2.32.4" "PyJWT[crypto]==2.10.1" "uvicorn==0.35.0" "playwright==1.55.0"
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_int05_ux_observations.py' -v
        env:
          AIOPS_E2E_ARTIFACT_DIR: ${{ runner.temp }}/int05-ux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int05-ux-${{ github.sha }}
          path: ${{ runner.temp }}/int05-ux
          if-no-files-found: error
