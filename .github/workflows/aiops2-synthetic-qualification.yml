name: AIOps2 synthetic qualification

on:
  pull_request:
    paths:
      - 'scripts/aiops2_*.py'
      - 'tests/test_aiops2_*.py'
      - 'app/portal/aiops2_computed_noc_demo.py'
      - 'app/portal/main.py'
      - '.github/workflows/aiops2-synthetic-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Compile offline intelligence and portal demo modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = [
              *Path("scripts").glob("aiops2_*.py"),
              Path("app/portal/aiops2_computed_noc_demo.py"),
          ]
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(paths)} Python modules")
          PY
      - name: Run deterministic synthetic contracts
        run: |
          python -m pytest -q \
            tests/test_aiops2_event_correlation.py \
            tests/test_aiops2_digital_twin_impact.py \
            tests/test_aiops2_analyst_critic.py \
            tests/test_aiops2_noc_decision.py \
            tests/test_aiops2_noc_decision_html.py \
            tests/test_aiops2_computed_noc_portal.py \
            tests/test_aiops2_computed_noc_navigation.py
