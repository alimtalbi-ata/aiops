name: Twin ACME 019 replay provenance PG16 (disposable)
on:
  pull_request:
    branches:
      - deploy/aiops2-stable
    paths:
      - db/migrations/020_acme_sandbox_twin_provenance_fence.sql
      - tests/test_acme_topology_020_pg16.py
      - .github/workflows/twin-acme-topology-pg16.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twin-acme-019-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: postgres:16-bookworm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiops
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: ci-acme-topology-disposable-only
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://aiops:ci-acme-topology-disposable-only@postgres:5432/aiops
      AIOPS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Install disposable PG16 test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 python3-venv git ca-certificates
          python3 -m venv /tmp/acme-topology-venv
          /tmp/acme-topology-venv/bin/python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.13"
      - name: Checkout exact source PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact SHA, real PG16 and seven negative/idempotent contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$AIOPS_EXPECTED_HEAD_SHA"
          psql "$DATABASE_URL" -Atqc 'show server_version_num' | grep -E '^16[0-9]{4}$'
          /tmp/acme-topology-venv/bin/python -m compileall -q tests/test_acme_topology_020_pg16.py
          /tmp/acme-topology-venv/bin/python -m unittest discover -s tests -p 'test_acme_topology_020_pg16.py' -v 2>&1 | tee /tmp/twin-acme-019.log
          grep -E '^Ran 7 tests in ' /tmp/twin-acme-019.log
          grep -x 'OK' /tmp/twin-acme-019.log
          ! grep -E 'skipped=|NOT_QUALIFIED' /tmp/twin-acme-019.log
          echo 'TWIN_019_PROVENANCE_PG16_PASS SIMULATION_ONLY=true HOST_DEPLOY=false LIVE_EFFECTS=false'
