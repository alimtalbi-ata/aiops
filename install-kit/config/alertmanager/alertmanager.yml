global:
  resolve_timeout: 5m
route:
  receiver: acme-null
  routes:
  - receiver: aiops2-fs385
    matchers:
    - aiops_test="FS385"
    group_by:
    - alertname
    - aiops_test
    - filesystem
    group_wait: 1s
    group_interval: 10s
    repeat_interval: 1h
receivers:
- name: acme-null
- name: aiops2-fs385
