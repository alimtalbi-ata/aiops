name: INT-06A integrated refusal contracts
on:
  push:
    branches: [integration/aiops2-int06a-20261118]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r app/requirements.txt pytest
      - name: Integrated offline refusal tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pytest -q -rs tests/test_int06a_integrated_refusals.py tests/test_acme_runtime_context.py tests/test_acme_workbench_presentation.py tests/test_int06a_contract.py tests/test_worker_temporal_transition_receipts.py tests/test_worker_acme_simulated_hitl.py tests/test_acme_cross_lot_consumers.py tests/test_worker_demo_postcheck_boundary.py tests/test_core_unqualified_resolve.py --junitxml=int06a-integrated.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("int06a-integrated.xml"); assert not r.findall(".//skipped")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int06a-integrated-${{ github.sha }}
          path: int06a-integrated.xml
