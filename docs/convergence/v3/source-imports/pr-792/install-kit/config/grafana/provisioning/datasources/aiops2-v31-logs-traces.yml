apiVersion: 1
datasources:
  - name: AIOPS2-Loki
    uid: aiops2-loki-v31
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
  - name: AIOPS2-Tempo
    uid: aiops2-tempo-v31
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: aiops2-loki-v31
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags: ['service.name', 'trace_id']
        filterByTraceID: true
        filterBySpanID: false
