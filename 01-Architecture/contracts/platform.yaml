name: aiops2
release: 8.0.0
author: Abdelhalim Talbi
external_ports: {portal: 7777, glpi: 8080, n8n: 5678, prometheus: 9090, grafana: 3000}
internal_ports: {core: 810, twin: 811, evidence: 812, policy: 813, copilot: 814, simulator: 816, integration: 817, intelligence: 818, rag: 819, temporal: 7233, postgres: 5432, mariadb: 3306}
networks: [aiops2_front, aiops2_core, aiops2_data, aiops2_temporal, aiops2_observability, aiops2_itsm]
