platform: aiops2
release: 8.0.0
author: Abdelhalim Talbi
external_ports:
  portal: 7777
  glpi: 8080
  n8n: 5678
  prometheus: 9090
  grafana: 3000
internal_ports:
  core: 810
  twin: 811
  evidence: 812
  policy: 813
  copilot: 814
  simulator: 816
  integration: 817
  intelligence: 818
  rag: 819
  temporal: 7233
  postgres: 5432
  mariadb: 3306
networks:
  front: aiops2_front
  core: aiops2_core
  data: aiops2_data
  temporal: aiops2_temporal
  observability: aiops2_observability
  itsm: aiops2_itsm
canonical_ids:
  - correlation_id
  - incident_id
  - run_id
  - event_id
  - evidence_id
  - decision_id
  - remediation_id
  - receipt_id
modes: [LIVE, DEMO, REPLAY, STORY]
invariants:
  immutable_run_events: true
  evidence_provenance_required: true
  observed_at_and_known_at: true
  demo_isolation_by_run_id: true
  unknown_evidence_fails_closed: true
  outbox_idempotent: true
  temporal_single_executor: true
  external_writes_policy_gated: true
  legacy_retirement_requires_runtime_qualification: true
