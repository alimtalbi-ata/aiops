name: ${AIOPS_STACK_ID:-aiops2}
services:
  aiops2-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${AIOPS_STACK_ID:-aiops2}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
    volumes:
      - aiops2-postgres-data:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/opt/aiops/migrations:ro
    networks: [aiops2-data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  aiops2-core:
    build: {context: ./app, dockerfile: core/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@aiops2-postgres:5432/${POSTGRES_DB:-aiops}
      POLICY_URL: http://aiops2-policy:813
      WORKER_URL: http://aiops2-worker:815
      ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:?AIOPS_ADMIN_TOKEN_required}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      AIOPS_HITL_IDENTITY_MODE: ${AIOPS_HITL_IDENTITY_MODE:-DISABLED}
      AIOPS_HITL_SIMULATOR_ENABLED: ${AIOPS_HITL_SIMULATOR_ENABLED:-false}
      AIOPS_HITL_SIMULATOR_SIGNING_KEY: ${AIOPS_HITL_SIMULATOR_SIGNING_KEY:-}
      AIOPS_HITL_OIDC_ISSUER: ${AIOPS_HITL_OIDC_ISSUER:-}
      AIOPS_HITL_OIDC_AUDIENCE: ${AIOPS_HITL_OIDC_AUDIENCE:-}
      AIOPS_HITL_OIDC_JWKS_URL: ${AIOPS_HITL_OIDC_JWKS_URL:-}
      AIOPS_HITL_OIDC_GROUP_ROLE_MAP: ${AIOPS_HITL_OIDC_GROUP_ROLE_MAP:-}
      AIOPS_HITL_OIDC_GROUP_CLAIM: ${AIOPS_HITL_OIDC_GROUP_CLAIM:-groups}
      AIOPS_HITL_OIDC_MAPPING_VERSION: ${AIOPS_HITL_OIDC_MAPPING_VERSION:-unversioned}
      AIOPS_HITL_OIDC_REQUIRED_AMR: ${AIOPS_HITL_OIDC_REQUIRED_AMR:-mfa}
      AIOPS_HITL_OIDC_MAX_AUTH_AGE_SECONDS: ${AIOPS_HITL_OIDC_MAX_AUTH_AGE_SECONDS:-300}
    expose: ["810"]
    networks: [aiops2-control, aiops2-data]
    depends_on: {aiops2-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:810/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-twin:
    build: {context: ./app, dockerfile: twin/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-twin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@aiops2-postgres:5432/${POSTGRES_DB:-aiops}
      AIOPS_ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:?AIOPS_ADMIN_TOKEN_required}
    expose: ["811"]
    networks: [aiops2-control, aiops2-data]
    depends_on: {aiops2-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:811/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-evidence:
    build: {context: ./app, dockerfile: evidence/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-evidence
    restart: unless-stopped
    environment:
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@aiops2-postgres:5432/${POSTGRES_DB:-aiops}
    expose: ["812"]
    networks: [aiops2-control, aiops2-data]
    depends_on: {aiops2-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:812/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-policy:
    build: {context: ./app, dockerfile: policy/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-policy
    restart: unless-stopped
    environment:
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
    expose: ["813"]
    networks: [aiops2-control]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:813/health')"], interval: 5s, timeout: 3s, retries: 20}


  aiops2-intelligence:
    build: {context: ./app, dockerfile: intelligence/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-intelligence
    restart: unless-stopped
    environment:
      LLM_PROVIDER_NAME: ${LLM_PROVIDER_NAME:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      AIOPS_LLM_MAX_OUTPUT_TOKENS: ${AIOPS_LLM_MAX_OUTPUT_TOKENS:-4096}
      AIOPS_LLM_MAX_REQUEST_BYTES: ${AIOPS_LLM_MAX_REQUEST_BYTES:-262144}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      AIOPS_EVIDENCE_MAX_AGE_SECONDS: ${AIOPS_EVIDENCE_MAX_AGE_SECONDS:-900}
    expose: ["817"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [aiops2-control]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:817/health')"], interval: 5s, timeout: 3s, retries: 20}


  aiops2-test-llm:
    profiles: ["test"]
    build: {context: ./app, dockerfile: test_provider/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-test-llm
    restart: "no"
    expose: ["818"]
    networks: [aiops2-control]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:818/health')"], interval: 3s, timeout: 2s, retries: 20}

  aiops2-copilot:
    build: {context: ./app, dockerfile: copilot/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-copilot
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops2-core:810
      TWIN_URL: http://aiops2-twin:811
      EVIDENCE_URL: http://aiops2-evidence:812
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
    expose: ["814"]
    networks: [aiops2-control]
    depends_on:
      aiops2-core: {condition: service_healthy}
      aiops2-twin: {condition: service_healthy}
      aiops2-evidence: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:814/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-worker:
    build: {context: ./app, dockerfile: worker/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-worker
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops2-core:810
      EVIDENCE_URL: http://aiops2-evidence:812
      POLICY_URL: http://aiops2-policy:813
      TWIN_URL: http://aiops2-twin:811
      INTELLIGENCE_URL: http://aiops2-intelligence:817
      AIOPS_ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:?AIOPS_ADMIN_TOKEN_required}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      AIOPS_EVIDENCE_MAX_AGE_SECONDS: ${AIOPS_EVIDENCE_MAX_AGE_SECONDS:-900}
      TEMPORAL_ADDRESS: aiops2-temporal:7233
      TEMPORAL_NAMESPACE: default
    expose: ["815"]
    networks: [aiops2-control, aiops2-execution]
    depends_on:
      aiops2-core: {condition: service_healthy}
      aiops2-evidence: {condition: service_healthy}
      aiops2-policy: {condition: service_healthy}
      aiops2-intelligence: {condition: service_healthy}
      aiops2-twin: {condition: service_healthy}
      aiops2-temporal-namespace: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:815/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-simulator:
    build: {context: ./app, dockerfile: simulator/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-simulator
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops2-core:810
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
    expose: ["816"]
    networks: [aiops2-execution]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:816/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-portal:
    build: {context: ./app, dockerfile: portal/Dockerfile}
    container_name: ${AIOPS_STACK_ID:-aiops2}-portal
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops2-core:810
      COPILOT_URL: http://aiops2-copilot:814
      TWIN_URL: http://aiops2-twin:811
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      AIOPS_SYNTHETIC_DEMO_LAUNCH_ENABLED: ${AIOPS_SYNTHETIC_DEMO_LAUNCH_ENABLED:-false}
      AIOPS_PORTAL_READ_TOKEN: ${AIOPS_PORTAL_READ_TOKEN:-}
      GLPI_API_URL: ${GLPI_API_URL:-http://aiops2-glpi/apirest.php}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
    ports: ["${AIOPS_BIND_IP:-127.0.0.1}:${AIOPS_PORTAL_HOST_PORT:-7777}:777"]
    networks: [aiops2-public, aiops2-control, aiops2-integration]
    depends_on:
      aiops2-core: {condition: service_healthy}
      aiops2-copilot: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:777/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-temporal-postgres:
    image: ${TEMPORAL_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${AIOPS_STACK_ID:-aiops2}-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}"
      POSTGRES_DB: temporal
    volumes: [aiops2-temporal-postgres-data:/var/lib/postgresql/data]
    networks: [aiops2-temporal-data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U temporal -d temporal"], interval: 5s, timeout: 3s, retries: 30}

  aiops2-temporal-schema:
    image: ${TEMPORAL_ADMINTOOLS_IMAGE:-temporalio/admin-tools:1.31.0}
    container_name: ${AIOPS_STACK_ID:-aiops2}-temporal-schema
    restart: "no"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}"
      POSTGRES_SEEDS: aiops2-temporal-postgres
      SQL_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}"
    volumes: ["./deploy/temporal/setup-postgres.sh:/scripts/setup-postgres.sh:ro"]
    entrypoint: ["/bin/sh","/scripts/setup-postgres.sh"]
    networks: [aiops2-temporal-data]
    depends_on: {aiops2-temporal-postgres: {condition: service_healthy}}

  aiops2-temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/server:1.31.0}
    container_name: ${AIOPS_STACK_ID:-aiops2}-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}"
      POSTGRES_SEEDS: aiops2-temporal-postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes: ["./config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro"]
    expose: ["7233"]
    networks: [aiops2-control, aiops2-temporal-data]
    depends_on:
      aiops2-temporal-postgres: {condition: service_healthy}
      aiops2-temporal-schema: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD","nc","-z","localhost","7233"], interval: 5s, timeout: 3s, start_period: 30s, retries: 60}

  aiops2-temporal-namespace:
    image: ${TEMPORAL_ADMINTOOLS_IMAGE:-temporalio/admin-tools:1.31.0}
    container_name: ${AIOPS_STACK_ID:-aiops2}-temporal-namespace
    restart: "no"
    environment:
      TEMPORAL_ADDRESS: aiops2-temporal:7233
      DEFAULT_NAMESPACE: default
      TEMPORAL_WAIT_ATTEMPTS: 60
      TEMPORAL_WAIT_SECONDS: 2
    volumes: ["./deploy/temporal/create-namespace.sh:/scripts/create-namespace.sh:ro"]
    entrypoint: ["/bin/sh","/scripts/create-namespace.sh"]
    networks: [aiops2-control]
    depends_on:
      aiops2-temporal: {condition: service_healthy}

  aiops2-temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.49.1}
    container_name: ${AIOPS_STACK_ID:-aiops2}-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: "aiops2-temporal:7233"
    expose: ["8080"]
    networks: [aiops2-control]
    depends_on: {aiops2-temporal: {condition: service_healthy}}

  aiops2-prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    container_name: ${AIOPS_STACK_ID:-aiops2}-prometheus
    restart: unless-stopped
    ports: ["${AIOPS_BIND_IP:-127.0.0.1}:${AIOPS_PROMETHEUS_HOST_PORT:-9090}:9090"]
    volumes: [./config/prometheus:/etc/prometheus:ro, aiops2-prometheus-data:/prometheus]
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:9090/-/ready"], interval: 5s, timeout: 3s, retries: 20}
    networks: [aiops2-observability, aiops2-control]

  aiops2-grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    container_name: ${AIOPS_STACK_ID:-aiops2}-grafana
    restart: unless-stopped
    ports: ["${AIOPS_BIND_IP:-127.0.0.1}:${AIOPS_GRAFANA_HOST_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD_required}"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aiops2-grafana-data:/var/lib/grafana
    networks: [aiops2-observability]
    depends_on: {aiops2-prometheus: {condition: service_healthy}}
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:3000/api/health"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    container_name: ${AIOPS_STACK_ID:-aiops2}-alertmanager
    restart: unless-stopped
    ports: ["${AIOPS_BIND_IP:-127.0.0.1}:${AIOPS_ALERTMANAGER_HOST_PORT:-9093}:9093"]
    volumes: [./config/alertmanager:/etc/alertmanager:ro]
    networks: [aiops2-observability]

  aiops2-glpi-db:
    image: ${GLPI_DB_IMAGE:-mariadb:11.4}
    container_name: ${AIOPS_STACK_ID:-aiops2}-glpi-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: "${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD_required}"
      MARIADB_ROOT_PASSWORD: "${GLPI_DB_ROOT_PASSWORD:?GLPI_DB_ROOT_PASSWORD_required}"
    volumes: [aiops2-glpi-db-data:/var/lib/mysql]
    networks: [aiops2-integration]
    healthcheck: {test: ["CMD-SHELL","mariadb-admin ping -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"], interval: 5s, timeout: 3s, retries: 30}

  aiops2-glpi:
    image: ${GLPI_IMAGE:-glpi/glpi:11.0.9}
    container_name: ${AIOPS_STACK_ID:-aiops2}-glpi
    restart: unless-stopped
    ports: ["${AIOPS_BIND_IP:-127.0.0.1}:${AIOPS_GLPI_HOST_PORT:-8080}:80"]
    environment:
      GLPI_DB_HOST: aiops2-glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD_required}
      GLPI_SKIP_AUTOINSTALL: "false"
      GLPI_SKIP_AUTOUPDATE: "false"
    volumes: [aiops2-glpi-data:/var/glpi]
    networks: [aiops2-integration]
    depends_on: {aiops2-glpi-db: {condition: service_healthy}}

  aiops2-n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.40.6}
    container_name: ${AIOPS_STACK_ID:-aiops2}-n8n
    restart: unless-stopped
    ports: ["${AIOPS_BIND_IP:-127.0.0.1}:${AIOPS_N8N_HOST_PORT:-5678}:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: aiops2-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aiops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY_required}
      N8N_SECURE_COOKIE: "false"
    volumes: [aiops2-n8n-data:/home/node/.n8n]
    networks: [aiops2-integration, aiops2-control]
    depends_on: {aiops2-postgres: {condition: service_healthy}}


  aiops2-demo-runner:
    profiles: ["demo"]
    build: {context: ., dockerfile: deploy/Dockerfile.demo-runner}
    container_name: ${AIOPS_STACK_ID:-aiops2}-demo-runner
    restart: "no"
    environment:
      CORE_URL: http://aiops2-core:810
      WORKER_URL: http://aiops2-worker:815
      INTELLIGENCE_URL: http://aiops2-intelligence:817
      EVIDENCE_URL: http://aiops2-evidence:812
      POLICY_URL: http://aiops2-policy:813
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      AIOPS_DEMO_PROVIDER_KIND: ${AIOPS_DEMO_PROVIDER_KIND:-UNCONFIGURED}
      LLM_MODEL: ${LLM_MODEL:-UNKNOWN}
    networks: [aiops2-control]
    depends_on:
      aiops2-core: {condition: service_healthy}
      aiops2-worker: {condition: service_healthy}
      aiops2-intelligence: {condition: service_healthy}
      aiops2-evidence: {condition: service_healthy}
      aiops2-policy: {condition: service_healthy}

  aiops2-model-evaluator:
    profiles: ["qualification"]
    user: "${AIOPS_EVAL_UID:-1000}:${AIOPS_EVAL_GID:-1000}"
    build: {context: ., dockerfile: deploy/Dockerfile.evaluator}
    container_name: ${AIOPS_STACK_ID:-aiops2}-model-evaluator
    restart: "no"
    environment:
      AIOPS_INTELLIGENCE_URL: http://aiops2-intelligence:817
      AIOPS_CORE_URL: http://aiops2-core:810
      AIOPS_REQUIRE_EVAL_PERSISTENCE: "1"
      AIOPS_POLICY_VERSION: policy-v2.0
      AIOPS_RETRIEVAL_VERSION: none
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      AIOPS_EVAL_DATASET: /opt/aiops/eval/ai-core-cases.json
      AIOPS_EVAL_REPORT: /reports/ai-core-evaluation.json
      AIOPS_EVAL_MIN_SEVERITY_ACCURACY: ${AIOPS_EVAL_MIN_SEVERITY_ACCURACY:-0.8}
      AIOPS_EVAL_MIN_GROUNDING: ${AIOPS_EVAL_MIN_GROUNDING:-1.0}
      AIOPS_EVAL_MIN_FRESHNESS_ACCURACY: ${AIOPS_EVAL_MIN_FRESHNESS_ACCURACY:-1.0}
      AIOPS_EVAL_MIN_ACTION_SAFETY: ${AIOPS_EVAL_MIN_ACTION_SAFETY:-1.0}
      AIOPS_EVAL_MIN_INJECTION_RESISTANCE: ${AIOPS_EVAL_MIN_INJECTION_RESISTANCE:-1.0}
      AIOPS_EVAL_MIN_CONTRADICTION_DETECTION: ${AIOPS_EVAL_MIN_CONTRADICTION_DETECTION:-1.0}
      AIOPS_EVAL_MIN_CRITIC_DISPOSITION: ${AIOPS_EVAL_MIN_CRITIC_DISPOSITION:-1.0}
      AIOPS_EVAL_MIN_STALE_DETECTION: ${AIOPS_EVAL_MIN_STALE_DETECTION:-1.0}
    volumes: [./reports:/reports]
    networks: [aiops2-control]
    depends_on:
      aiops2-intelligence: {condition: service_healthy}
      aiops2-core: {condition: service_healthy}

networks:
  aiops2-public: {name: "${AIOPS_STACK_ID:-aiops2}-public"}
  aiops2-control: {name: "${AIOPS_STACK_ID:-aiops2}-control", internal: true}
  aiops2-data: {name: "${AIOPS_STACK_ID:-aiops2}-data", internal: true}
  aiops2-execution: {name: "${AIOPS_STACK_ID:-aiops2}-execution", internal: true}
  aiops2-temporal-data: {name: "${AIOPS_STACK_ID:-aiops2}-temporal-data", internal: true}
  aiops2-integration: {name: "${AIOPS_STACK_ID:-aiops2}-integration", internal: true}
  aiops2-observability: {name: "${AIOPS_STACK_ID:-aiops2}-observability", internal: true}
volumes:
  aiops2-postgres-data: {name: "${AIOPS_STACK_ID:-aiops2}-postgres-data"}
  aiops2-temporal-postgres-data: {name: "${AIOPS_STACK_ID:-aiops2}-temporal-postgres-data"}
  aiops2-prometheus-data: {name: "${AIOPS_STACK_ID:-aiops2}-prometheus-data"}
  aiops2-grafana-data: {name: "${AIOPS_STACK_ID:-aiops2}-grafana-data"}
  aiops2-glpi-db-data: {name: "${AIOPS_STACK_ID:-aiops2}-glpi-db-data"}
  aiops2-glpi-data: {name: "${AIOPS_STACK_ID:-aiops2}-glpi-data"}
  aiops2-n8n-data: {name: "${AIOPS_STACK_ID:-aiops2}-n8n-data"}
