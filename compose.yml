name: acme-aiops
services:
  aiops-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: aiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Newaiops26$}
    volumes:
      - aiops-postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks: [aiops-data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  aiops-core:
    build: {context: ./app, dockerfile: core/Dockerfile}
    container_name: aiops-core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-Newaiops26$}@aiops-postgres:5432/${POSTGRES_DB:-aiops}
      POLICY_URL: http://aiops-policy:813
      WORKER_URL: http://aiops-worker:815
      ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:-Newaiops26$}
    expose: ["810"]
    networks: [aiops-control, aiops-data]
    depends_on: {aiops-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:810/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-twin:
    build: {context: ./app, dockerfile: twin/Dockerfile}
    container_name: aiops-twin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-Newaiops26$}@aiops-postgres:5432/${POSTGRES_DB:-aiops}
      AIOPS_ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:-Newaiops26$}
    expose: ["811"]
    networks: [aiops-control, aiops-data]
    depends_on: {aiops-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:811/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-evidence:
    build: {context: ./app, dockerfile: evidence/Dockerfile}
    container_name: aiops-evidence
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-Newaiops26$}@aiops-postgres:5432/${POSTGRES_DB:-aiops}
    expose: ["812"]
    networks: [aiops-control, aiops-data]
    depends_on: {aiops-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:812/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-policy:
    build: {context: ./app, dockerfile: policy/Dockerfile}
    container_name: aiops-policy
    restart: unless-stopped
    expose: ["813"]
    networks: [aiops-control]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:813/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-rag:
    build: {context: ./app, dockerfile: rag/Dockerfile}
    container_name: aiops-rag
    restart: unless-stopped
    environment:
      EVIDENCE_URL: http://aiops-evidence:812
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:-Newaiops26$}
    expose: ["819"]
    networks: [aiops-control]
    depends_on:
      aiops-evidence: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:819/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-intelligence:
    build: {context: ./app, dockerfile: intelligence/Dockerfile}
    container_name: aiops-intelligence
    restart: unless-stopped
    environment:
      TWIN_URL: http://aiops-twin:811
      RAG_URL: http://aiops-rag:819
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:-Newaiops26$}
    expose: ["818"]
    networks: [aiops-control]
    depends_on:
      aiops-twin: {condition: service_healthy}
      aiops-rag: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:818/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-copilot:
    build: {context: ./app, dockerfile: copilot/Dockerfile}
    container_name: aiops-copilot
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops-core:810
      TWIN_URL: http://aiops-twin:811
      EVIDENCE_URL: http://aiops-evidence:812
      RAG_URL: http://aiops-rag:819
    expose: ["814"]
    networks: [aiops-control]
    depends_on:
      aiops-core: {condition: service_healthy}
      aiops-twin: {condition: service_healthy}
      aiops-evidence: {condition: service_healthy}
      aiops-rag: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:814/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-worker:
    build: {context: ./app, dockerfile: worker/Dockerfile}
    container_name: aiops-worker
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops-core:810
      EVIDENCE_URL: http://aiops-evidence:812
      POLICY_URL: http://aiops-policy:813
      TWIN_URL: http://aiops-twin:811
      RAG_URL: http://aiops-rag:819
      INTELLIGENCE_URL: http://aiops-intelligence:818
      AIOPS_ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:-Newaiops26$}
      OUTBOX_WORKER_ID: worker-1
      TEMPORAL_ADDRESS: aiops-temporal:7233
      TEMPORAL_NAMESPACE: default
    expose: ["815"]
    networks: [aiops-control, aiops-execution]
    depends_on:
      aiops-core: {condition: service_healthy}
      aiops-evidence: {condition: service_healthy}
      aiops-policy: {condition: service_healthy}
      aiops-twin: {condition: service_healthy}
      aiops-rag: {condition: service_healthy}
      aiops-intelligence: {condition: service_healthy}
      aiops-temporal: {condition: service_started}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:815/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-simulator:
    build: {context: ./app, dockerfile: simulator/Dockerfile}
    container_name: aiops-simulator
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops-core:810
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:-Newaiops26$}
    expose: ["816"]
    networks: [aiops-execution, aiops-control]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:816/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-integration:
    build: {context: ./app, dockerfile: integration/Dockerfile}
    container_name: aiops-integration
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops-core:810
      GLPI_URL: http://aiops-glpi:80
      N8N_URL: http://aiops-n8n:5678
      INTEGRATION_DELIVERY: ${INTEGRATION_DELIVERY:-MOCK}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:-Newaiops26$}
      OUTBOX_WORKER_ID: integration-1
    expose: ["817"]
    networks: [aiops-control, aiops-integration]
    depends_on:
      aiops-core: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:817/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-portal:
    build: {context: ./app, dockerfile: portal/Dockerfile}
    container_name: aiops-portal
    restart: unless-stopped
    environment:
      CORE_URL: http://aiops-core:810
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:-Newaiops26$}
      COPILOT_URL: http://aiops-copilot:814
      TWIN_URL: http://aiops-twin:811
    ports: ["7777:777"]
    networks: [aiops-public, aiops-control]
    depends_on:
      aiops-core: {condition: service_healthy}
      aiops-copilot: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:777/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops-temporal-postgres:
    image: ${TEMPORAL_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: aiops-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Newaiops26$}"
      POSTGRES_DB: temporal
    volumes: [aiops-temporal-postgres-data:/var/lib/postgresql/data]
    networks: [aiops-temporal-data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U temporal -d temporal"], interval: 5s, timeout: 3s, retries: 30}

  aiops-temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.32.1}
    container_name: aiops-temporal
    restart: unless-stopped
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTGRES_PASSWORD:-Newaiops26$}"
      POSTGRES_SEEDS: aiops-temporal-postgres
    expose: ["7233"]
    networks: [aiops-control, aiops-temporal-data]
    depends_on: {aiops-temporal-postgres: {condition: service_healthy}}

  aiops-temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.56.0}
    container_name: aiops-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: "aiops-temporal:7233"
    expose: ["8080"]
    networks: [aiops-control]
    depends_on: {aiops-temporal: {condition: service_started}}

  aiops-prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    container_name: aiops-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes: [./config/prometheus:/etc/prometheus:ro, aiops-prometheus-data:/prometheus]
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:9090/-/ready"], interval: 5s, timeout: 3s, retries: 20}
    networks: [aiops-observability, aiops-control]

  aiops-grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    container_name: aiops-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-Newaiops26$}"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aiops-grafana-data:/var/lib/grafana
    networks: [aiops-observability]
    depends_on: {aiops-prometheus: {condition: service_healthy}}
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:3000/api/health"], interval: 5s, timeout: 3s, retries: 20}

  aiops-alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    container_name: aiops-alertmanager
    restart: unless-stopped
    ports: ["9093:9093"]
    volumes: [./config/alertmanager:/etc/alertmanager:ro]
    networks: [aiops-observability]

  aiops-glpi-db:
    image: ${GLPI_DB_IMAGE:-mariadb:11.4}
    container_name: aiops-glpi-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: "${GLPI_DB_PASSWORD:-Newaiops26$}"
      MARIADB_ROOT_PASSWORD: "${GLPI_DB_ROOT_PASSWORD:-Newaiops26$}"
    volumes: [aiops-glpi-db-data:/var/lib/mysql]
    networks: [aiops-integration]
    healthcheck: {test: ["CMD-SHELL","mariadb-admin ping -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"], interval: 5s, timeout: 3s, retries: 30}

  aiops-glpi:
    image: ${GLPI_IMAGE:-glpi/glpi:11.0.9}
    container_name: aiops-glpi
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      GLPI_DB_HOST: aiops-glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:-Newaiops26$}
      GLPI_SKIP_AUTOINSTALL: "false"
      GLPI_SKIP_AUTOUPDATE: "false"
    volumes: [aiops-glpi-data:/var/glpi]
    networks: [aiops-integration]
    depends_on: {aiops-glpi-db: {condition: service_healthy}}

  aiops-n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.40.6}
    container_name: aiops-n8n
    restart: unless-stopped
    ports: ["5678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: aiops-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aiops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-Newaiops26$}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-Newaiops26$-N8N}
      N8N_SECURE_COOKIE: "false"
    volumes: [aiops-n8n-data:/home/node/.n8n]
    networks: [aiops-integration]
    depends_on: {aiops-postgres: {condition: service_healthy}}

networks:
  aiops-public: {name: aiops-public}
  aiops-control: {name: aiops-control, internal: true}
  aiops-data: {name: aiops-data, internal: true}
  aiops-execution: {name: aiops-execution, internal: true}
  aiops-temporal-data: {name: aiops-temporal-data, internal: true}
  aiops-integration: {name: aiops-integration, internal: true}
  aiops-observability: {name: aiops-observability, internal: true}
volumes:
  aiops-postgres-data: {name: aiops-postgres-data}
  aiops-temporal-postgres-data: {name: aiops-temporal-postgres-data}
  aiops-prometheus-data: {name: aiops-prometheus-data}
  aiops-grafana-data: {name: aiops-grafana-data}
  aiops-glpi-db-data: {name: aiops-glpi-db-data}
  aiops-glpi-data: {name: aiops-glpi-data}
  aiops-n8n-data: {name: aiops-n8n-data}
