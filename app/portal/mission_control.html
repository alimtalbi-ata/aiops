<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOPS² Mission Control</title><style>
:root{color-scheme:dark;--bg:#07111e;--panel:#111f32;--line:#29405a;--ink:#edf6ff;--muted:#a4b8ce;--accent:#57e6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:24px;letter-spacing:2px;color:var(--accent)}button,a,select{font:inherit}button,a.action{background:#17354b;color:var(--ink);border:1px solid #40617c;border-radius:9px;padding:11px 15px;cursor:pointer;text-decoration:none}button:hover,a.action:hover{background:#23506a}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:85vh}nav{padding:18px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}nav button{text-align:left}nav button[aria-current=true]{border-color:var(--accent);color:var(--accent)}main{padding:clamp(16px,3vw,40px);min-width:0}h1{font-size:clamp(26px,4vw,42px);margin:0 0 8px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:linear-gradient(145deg,#15283e,var(--panel));border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.value{font-size:34px;color:var(--accent);font-weight:700;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.warn{color:#ffd17a}.good{color:#8de8b0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto}label{display:block;margin:12px 0}select{max-width:100%;padding:10px;background:var(--panel);color:var(--ink)}@media(max-width:760px){.layout{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav button{flex:1 1 135px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body><header><strong>AIOPS² / MISSION CONTROL</strong><span id="session" role="status">Session : vérification…</span><a class="action" href="/auth/oidc/login">Connexion opérateur</a></header><div class="layout"><nav aria-label="Navigation principale" id="nav"></nav><main><h1 id="title"></h1><p id="intro"></p><div class="actions"><button id="refresh">Actualiser les données</button><a class="action" href="/legacy">Interface historique</a></div><p id="status" role="status" aria-live="polite"></p><div class="grid" id="cards"></div><section id="detail"></section></main></div><script>
"use strict";
const sections=[
["Pilotage","État des services et accès aux fonctions existantes", [["Santé Portal","/health"],["Composants","/api/portal/components"],["Session","/api/portal/session"]],[["NOC","/noc"],["Observabilité","/observability"]]],
["Opérations","Données opérateur protégées", [["État runtime","/api/noc/runtime-state"],["Corrélation","/api/noc/correlation"]],[["Workspace","/workspace"],["Runs","/runs"]]],
["Digital Twin","Analyse d’impact — projection de démonstration, non LIVE",[["Impact ACME","/api/demo/acme-impact"]],[["Explorateur impact","/demo/acme-impact"],["CMDB","/cmdb"]]],
["Intelligence","Analyse et Critic — projection DEMO",[["Analyst / Critic","/api/demo/acme-analyst-critic-review"],["RAG NOC","/api/noc/demo-rag"]],[["Workbench","/demo/acme-workbench"]]],
["Gouvernance","Preuves de démonstration et accès ITSM protégé",[["Evidence DEMO","/api/demo/acme-evidence-plan"],["ITSM","/api/portal/itsm"]],[["GLPI","/itsm"],["Evidence","/demo/acme-evidence-plan"]]],
["Observabilité","Santé Grafana et outils de consultation",[["Grafana","/api/noc/grafana-health"]],[["Dashboards","/observability"],["Prometheus","/prometheus"]]],
["Laboratoire","SIMULATION — aucune autorité de remédiation réelle présumée",[["SameRun","/api/demo/acme-samerun"],["Workbench","/api/demo/acme-workbench"],["FS Lab","/api/fs-demo/health"]],[["Explore Story","/demo/explore-story"],["FS Lab","/fs-demo"],["Demo Center","/demo-center"]]]
];
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
let selection=0, generation=0, controller;
async function read(path,signal){const r=await fetch(path,{credentials:"same-origin",cache:"no-store",redirect:"error",signal,headers:{Accept:"application/json"}});if(!r.ok)throw Error(r.status===401||r.status===403?"Accès protégé : connexion ou permission requise.":"HTTP "+r.status);return r.json()}
function inspect(name,data){const d=$("detail");d.replaceChildren(el("h2",name));const p=el("p","Sélectionnez un champ pour inspecter sa valeur. Source : réponse API, sans interprétation d’autorité.");d.append(p);const entries=Object.entries(data&&typeof data==="object"?data:{value:data});const s=el("select");s.setAttribute("aria-label","Champ à inspecter");for(const [k] of entries){const o=el("option",k);o.value=k;s.append(o)}const pre=el("pre");const update=()=>{const pair=entries.find(([k])=>k===s.value);pre.textContent=pair?JSON.stringify(pair[1],null,2):"Aucune donnée"};s.addEventListener("change",update);d.append(s,pre);update()}
async function render(){const id=++generation;controller?.abort();controller=new AbortController();const signal=controller.signal;const [name,intro,apis,links]=sections[selection];$("title").textContent=name;$("intro").textContent=intro;$("detail").replaceChildren();$("cards").replaceChildren();$("status").textContent="Chargement…";[...$("nav").children].forEach((b,i)=>b.setAttribute("aria-current",i===selection?"true":"false"));for(const [label,href] of links){const a=el("a",label,"action");a.href=href;$("cards").append(a)}await Promise.all(apis.map(async ([label,path])=>{const c=el("article",undefined,"card");c.append(el("h2",label));const state=el("p","Chargement…");c.append(state);$("cards").append(c);try{const data=await read(path,signal);if(id!==generation)return;state.textContent="Réponse API reçue";state.className="good";const fields=Object.entries(data&&typeof data==="object"?data:{}).filter(([k,v])=>/^(status|component|mode|provenance|count|total|schema|binding_status)$/.test(k)&&["string","number","boolean"].includes(typeof v));for(const [k,v] of fields)c.append(el("p",k+" : "+String(v)));const b=el("button","Inspecter les données");b.addEventListener("click",()=>inspect(label,data));c.append(b)}catch(e){if(id!==generation)return;state.textContent=e.message;state.className="warn"}}));if(id===generation)$("status").textContent="Consultation terminée · "+new Date().toLocaleTimeString("fr-FR")}
sections.forEach(([name],i)=>{const b=el("button",name);b.addEventListener("click",()=>{selection=i;render()});$("nav").append(b)});$("refresh").addEventListener("click",render);read("/api/portal/session").then(()=>{$("session").textContent="Session : réponse reçue (droits à vérifier)"}).catch(()=>{$("session").textContent="Session non vérifiée"});render();
</script></body></html>
