global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: aiops-core
    metrics_path: /metrics
    static_configs: [{targets: ['aiops-core:810']}]
  - job_name: aiops-twin
    metrics_path: /metrics
    static_configs: [{targets: ['aiops-twin:811']}]
  - job_name: aiops-evidence
    metrics_path: /metrics
    static_configs: [{targets: ['aiops-evidence:812']}]
  - job_name: aiops-policy
    static_configs: [{targets: ['aiops-policy:813']}]

  - job_name: aiops-worker
    metrics_path: /metrics
    static_configs: [{targets: ['aiops-worker:815']}]
