global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: aiops2-core
    metrics_path: /metrics
    static_configs: [{targets: ['aiops2-core:810']}]
  - job_name: aiops2-twin
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/aiops2/twin-metrics-token
    static_configs: [{targets: ['aiops2-twin:811']}]
  - job_name: aiops2-evidence
    metrics_path: /metrics
    static_configs: [{targets: ['aiops2-evidence:812']}]
  - job_name: aiops2-policy
    static_configs: [{targets: ['aiops2-policy:813']}]

  - job_name: aiops2-worker
    metrics_path: /metrics
    static_configs: [{targets: ['aiops2-worker:815']}]
