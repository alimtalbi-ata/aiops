name: aiops2-isolated
services:
  aiops2-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
    volumes:
      - aiops2-postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      aiops2-data: {ipv4_address: 172.30.20.2}
      aiops2-integration: {ipv4_address: 172.30.50.4}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  aiops2-core:
    build: {context: ./app, dockerfile: core/Dockerfile}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@172.30.20.2:5432/${POSTGRES_DB:-aiops}
      POLICY_URL: http://172.30.10.13:813
      WORKER_URL: http://172.30.10.15:815
      ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:?AIOPS_ADMIN_TOKEN_required}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
    expose: ["810"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.10}
      aiops2-data: {ipv4_address: 172.30.20.10}
      aiops2-execution: {ipv4_address: 172.30.30.12}
    depends_on: {aiops2-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:810/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-twin:
    build: {context: ./app, dockerfile: twin/Dockerfile}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@172.30.20.2:5432/${POSTGRES_DB:-aiops}
      AIOPS_ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:?AIOPS_ADMIN_TOKEN_required}
    expose: ["811"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.11}
      aiops2-data: {ipv4_address: 172.30.20.11}
    depends_on: {aiops2-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:811/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-evidence:
    build: {context: ./app, dockerfile: evidence/Dockerfile}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@172.30.20.2:5432/${POSTGRES_DB:-aiops}
    expose: ["812"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.12}
      aiops2-data: {ipv4_address: 172.30.20.12}
    depends_on: {aiops2-postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:812/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-policy:
    build: {context: ./app, dockerfile: policy/Dockerfile}
    restart: unless-stopped
    expose: ["813"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.13}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:813/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-copilot:
    build: {context: ./app, dockerfile: copilot/Dockerfile}
    restart: unless-stopped
    environment:
      CORE_URL: http://172.30.10.10:810
      TWIN_URL: http://172.30.10.11:811
      EVIDENCE_URL: http://172.30.10.12:812
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
    expose: ["814"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.14}
    depends_on:
      aiops2-core: {condition: service_healthy}
      aiops2-twin: {condition: service_healthy}
      aiops2-evidence: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:814/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-worker:
    build: {context: ./app, dockerfile: worker/Dockerfile}
    restart: unless-stopped
    environment:
      CORE_URL: http://172.30.10.10:810
      EVIDENCE_URL: http://172.30.10.12:812
      POLICY_URL: http://172.30.10.13:813
      TWIN_URL: http://172.30.10.11:811
      AIOPS_ADMIN_TOKEN: ${AIOPS_ADMIN_TOKEN:?AIOPS_ADMIN_TOKEN_required}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      TEMPORAL_ADDRESS: 172.30.10.20:7233
      TEMPORAL_NAMESPACE: default
    expose: ["815"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.15}
      aiops2-execution: {ipv4_address: 172.30.30.10}
    depends_on:
      aiops2-core: {condition: service_healthy}
      aiops2-evidence: {condition: service_healthy}
      aiops2-policy: {condition: service_healthy}
      aiops2-twin: {condition: service_healthy}
      aiops2-temporal: {condition: service_started}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:815/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-simulator:
    build: {context: ./app, dockerfile: simulator/Dockerfile}
    restart: unless-stopped
    environment:
      CORE_URL: http://172.30.10.10:810
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
    expose: ["816"]
    networks:
      aiops2-execution: {ipv4_address: 172.30.30.11}
      aiops2-control: {ipv4_address: 172.30.10.16}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:816/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-portal:
    build: {context: ./app, dockerfile: portal/Dockerfile}
    restart: unless-stopped
    environment:
      CORE_URL: http://172.30.10.10:810
      COPILOT_URL: http://172.30.10.14:814
      TWIN_URL: http://172.30.10.11:811
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN_required}
      AIOPS_PORTAL_READ_TOKEN: ${AIOPS_PORTAL_READ_TOKEN:-}
      AIOPS_PORTAL_OPERATOR_TOKEN: ${AIOPS_PORTAL_OPERATOR_TOKEN:-}
      AIOPS_PORTAL_LINK_N8N: ${AIOPS_PORTAL_LINK_N8N:-}
      AIOPS_PORTAL_LINK_THRUK: ${AIOPS_PORTAL_LINK_THRUK:-}
      AIOPS_PORTAL_LINK_CHECKMK: ${AIOPS_PORTAL_LINK_CHECKMK:-}
      AIOPS_PORTAL_LINK_GRAFANA: ${AIOPS_PORTAL_LINK_GRAFANA:-}
      AIOPS_PORTAL_LINK_GLPI: ${AIOPS_PORTAL_LINK_GLPI:-}
      AIOPS_PORTAL_ALLOW_HTTP_LINKS: ${AIOPS_PORTAL_ALLOW_HTTP_LINKS:-false}
      AIOPS_PORTAL_HOST_PORT: ${AIOPS_PORTAL_HOST_PORT:-17777}
    ports: ["127.0.0.1:17777:777"]
    networks:
      aiops2-public: {ipv4_address: 172.30.70.2}
      aiops2-control: {ipv4_address: 172.30.10.17}
    depends_on:
      aiops2-core: {condition: service_healthy}
      aiops2-copilot: {condition: service_healthy}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:777/health')"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-temporal-postgres:
    image: ${TEMPORAL_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}"
      POSTGRES_DB: temporal
    volumes: [aiops2-temporal-postgres-data:/var/lib/postgresql/data]
    networks:
      aiops2-temporal-data: {ipv4_address: 172.30.40.2}
    healthcheck: {test: ["CMD-SHELL","pg_isready -U temporal -d temporal"], interval: 5s, timeout: 3s, retries: 30}

  aiops2-temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.32.1}
    restart: unless-stopped
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}"
      POSTGRES_SEEDS: 172.30.40.2
    expose: ["7233"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.20}
      aiops2-temporal-data: {ipv4_address: 172.30.40.10}
    depends_on: {aiops2-temporal-postgres: {condition: service_healthy}}

  aiops2-temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.56.0}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: "172.30.10.20:7233"
    expose: ["8080"]
    networks:
      aiops2-control: {ipv4_address: 172.30.10.21}
    depends_on: {aiops2-temporal: {condition: service_started}}

  aiops2-prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    restart: unless-stopped
    ports: ["127.0.0.1:19090:9090"]
    volumes: [./config/isolated/prometheus:/etc/prometheus:ro, aiops2-prometheus-data:/prometheus]
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:9090/-/ready"], interval: 5s, timeout: 3s, retries: 20}
    networks:
      aiops2-observability: {ipv4_address: 172.30.60.2}
      aiops2-control: {ipv4_address: 172.30.10.30}

  aiops2-grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    restart: unless-stopped
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD_required}"
    volumes:
      - ./config/isolated/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aiops2-grafana-data:/var/lib/grafana
    networks:
      aiops2-observability: {ipv4_address: 172.30.60.3}
    depends_on: {aiops2-prometheus: {condition: service_healthy}}
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:3000/api/health"], interval: 5s, timeout: 3s, retries: 20}

  aiops2-alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    restart: unless-stopped
    ports: ["127.0.0.1:19093:9093"]
    volumes: [./config/alertmanager:/etc/alertmanager:ro]
    networks:
      aiops2-observability: {ipv4_address: 172.30.60.4}

  aiops2-glpi-db:
    image: ${GLPI_DB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: "${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD_required}"
      MARIADB_ROOT_PASSWORD: "${GLPI_DB_ROOT_PASSWORD:?GLPI_DB_ROOT_PASSWORD_required}"
    volumes: [aiops2-glpi-db-data:/var/lib/mysql]
    networks:
      aiops2-integration: {ipv4_address: 172.30.50.2}
    healthcheck: {test: ["CMD-SHELL","mariadb-admin ping -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"], interval: 5s, timeout: 3s, retries: 30}

  aiops2-glpi:
    image: ${GLPI_IMAGE:-glpi/glpi:11.0.9}
    restart: unless-stopped
    ports: ["127.0.0.1:18080:80"]
    environment:
      GLPI_DB_HOST: 172.30.50.2
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD_required}
      GLPI_SKIP_AUTOINSTALL: "false"
      GLPI_SKIP_AUTOUPDATE: "false"
    volumes: [aiops2-glpi-data:/var/glpi]
    networks:
      aiops2-integration: {ipv4_address: 172.30.50.3}
    depends_on: {aiops2-glpi-db: {condition: service_healthy}}

  aiops2-n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.40.6}
    restart: unless-stopped
    ports: ["127.0.0.1:15678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: 172.30.50.4
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aiops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY_required}
      N8N_SECURE_COOKIE: "false"
    volumes: [aiops2-n8n-data:/home/node/.n8n]
    networks:
      aiops2-integration: {ipv4_address: 172.30.50.5}
      aiops2-control: {ipv4_address: 172.30.10.31}
    depends_on: {aiops2-postgres: {condition: service_healthy}}

networks:
  aiops2-public:
    name: aiops2-isolated_public
    ipam: {config: [{subnet: 172.30.70.0/24}]}
  aiops2-control:
    name: aiops2-isolated_control
    internal: true
    ipam: {config: [{subnet: 172.30.10.0/24}]}
  aiops2-data:
    name: aiops2-isolated_data
    internal: true
    ipam: {config: [{subnet: 172.30.20.0/24}]}
  aiops2-execution:
    name: aiops2-isolated_execution
    internal: true
    ipam: {config: [{subnet: 172.30.30.0/24}]}
  aiops2-temporal-data:
    name: aiops2-isolated_temporal_data
    internal: true
    ipam: {config: [{subnet: 172.30.40.0/24}]}
  aiops2-integration:
    name: aiops2-isolated_integration
    internal: true
    ipam: {config: [{subnet: 172.30.50.0/24}]}
  aiops2-observability:
    name: aiops2-isolated_observability
    internal: true
    ipam: {config: [{subnet: 172.30.60.0/24}]}
volumes:
  aiops2-postgres-data: {name: aiops2-isolated_postgres_data}
  aiops2-temporal-postgres-data: {name: aiops2-isolated_temporal_postgres_data}
  aiops2-prometheus-data: {name: aiops2-isolated_prometheus_data}
  aiops2-grafana-data: {name: aiops2-isolated_grafana_data}
  aiops2-glpi-db-data: {name: aiops2-isolated_glpi_db_data}
  aiops2-glpi-data: {name: aiops2-isolated_glpi_data}
  aiops2-n8n-data: {name: aiops2-isolated_n8n_data}
